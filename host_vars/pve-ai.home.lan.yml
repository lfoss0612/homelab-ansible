---
# host_vars/pve-ai.home.lan.yml

# --- Ballooning ---------------------------------------------------------------
#
# SUPERSEDED 2026-09-27 -- read this note before the history below it.
# The original 2026-08-27 decision (ceiling 49152/floor 24576, full history
# kept below) is no longer what's actually deployed. Live config as of
# 2026-09-27 (confirmed deliberate by the user, not drift):
#   memory (ceiling): 24576 MiB (24G) -- was 49152
#   balloon (floor):  8192 MiB (8G)   -- was 24576
# i.e. both halved from the original decision. Whatever prompted the change
# (freeing RAM on pve-ai for something else, most likely) happened out of
# band -- `qm set`, not this repo -- and was never written back here, which
# is exactly the trap this comment exists to close: `proxmox_qm_config`
# below is declarative, so before this update, running
# `playbooks/proxmox-config.yml` against this host would have silently
# fought the live change back to the stale 24576 floor on every run.
# Surfaced investigating k8s-worker-2's kubelet Capacity-at-boot bug (see
# homelab-vault DONE.md, Kubernetes) -- a reboot to test that fix landed the
# node at ~8-9GiB post-boot instead of the ~24GiB seen before the reboot,
# which is what led here. The ceiling is now also declared below (previously
# only `balloon` was Ansible-managed) so both halves of the live config are
# reproducible and drift-checked together, not just one of them.
#
# Original 2026-08-27 decision, kept for history -- ceiling/floor values in
# this paragraph are STALE, see above:
# Surfaced while investigating pve.home.lan's OOM-kill (see
# host_vars/pve.home.lan.yml): this host's only VM, 100 (k8s-worker-2, the RTX
# 5090 passthrough host), carried `balloon: 0` -- hard-pinned, zero elasticity,
# and sitting at ~100% of its declared 48G continuously for over a month
# (Zabbix trigger "Proxmox VE: VM [pve-ai/k8s-worker-2] high memory usage" open
# since 2026-07-18). Verified live before choosing a number, not guessed:
# actual usage was ~19.6G of 48G declared (free -m), dominated by
# llama-server's 9.03G RSS -- almost all genuine anonymous memory (RssAnon
# 8.47G via /proc/<pid>/status), not page cache; the loaded model (qwen3:4b,
# 5.3G) was fully VRAM-resident per Ollama's /api/ps, confirming normal-sized
# models offload to VRAM as intended and the 9G host-side overhead was
# llama-server's own compute/context buffers (-c 32768 -b 1024 -ub 1024), not
# model spillover. deepseek-r1:70b (42.5G) and codellama:70b (38.9G) both
# exceed the RTX 5090's 32G VRAM and were expected to keep spilling to CPU
# occasionally by design (homelab-vault TODO.md, "LiteLLM") -- the chosen
# floor was deliberately not sized against that worst case, since a floor is
# a minimum, not a cap, and an infrequent large load could still balloon up
# toward the (then-)unchanged 48G ceiling. That new VM (a planned additional
# k8s worker on this host) was expected to draw this VM's balloon toward its
# floor during normal operation -- deliberate, not a risk to design around.
#
# `balloon` and `memory` are both in the benign-key allowlist, not the
# protected-key denylist (playbooks/tasks/proxmox-assert-safe-keys.yml).
# pve-ai carries no proxmox_protected_vmids, so this applies with a plain
# `ansible-playbook playbooks/proxmox-config.yml`, no confirm flags.
# Verify live: `pvesh get /nodes/pve-ai/qemu/100/status/current` should show
# maxmem=25769803776 (24576 MiB) and balloon_min=8589934592 (8192 MiB).
# Changing `memory` (the ceiling) on a running VM without hotplug configured
# (this VM has none) does not take effect until the guest reboots -- if this
# ever needs re-applying, expect `qm set` to succeed immediately but the
# guest's own /proc/meminfo to keep showing the old ceiling until then.
proxmox_qm_config:
  - vmid: 100   # k8s-worker-2 -- RTX 5090 passthrough, LiteLLM/Ollama host
    settings:
      memory: 24576   # ceiling, halved from 49152 2026-09-27 (see note above)
      balloon: 8192    # floor, halved from 24576 2026-09-27 (see note above)
