---
# host_vars/pve.yml
# Extra exec allowlist entries for Proxmox hosts.
# The playbook writes exec-approvals.json with force: false, so it won't
# overwrite a file you've already customised. To push this automatically,
# you can add a separate task or use a merge approach.
 
# Proxmox management binaries you want the agent to call without approval prompts:
openclaw_exec_allowlist_extra:
  - /usr/bin/qm          # VM management
  - /usr/sbin/pvesh      # Proxmox REST API CLI
  - /usr/bin/pct         # LXC container management
  - /usr/sbin/pvesm      # Storage management
  - /usr/bin/pvecm       # Cluster management
  - /usr/bin/qmrestore   # VM restore
  - /usr/bin/vzdump      # Backups

# --- Ballooning ---------------------------------------------------------------
#
# Surfaced 2026-08-27: the kernel OOM-killer killed VM 105 (k8s-worker) here on
# 2026-08-24 20:00:07 -- anon-rss:24524056kB, essentially its whole declared
# 24G. Root-caused via the guest's own journal (persistent across the crash):
# zero internal OOM-killer activity and zero kubelet eviction/MemoryPressure
# signals across its entire 3.4-day pre-crash boot -- the guest was never
# stressed. The kill was a pure HOST decision: none of this host's 7 VMs had a
# `balloon:` line, which defaults to balloon = memory (the driver exists but its
# target is full allocation, so nothing is ever actually reclaimed). Guests
# naturally fill available RAM with page cache over uptime -- normal, harmless
# behavior on a real host, but on an unballooned VM the host cannot tell that
# apart from genuine need, so when combined demand across all 7 VMs (76G
# declared, 63.4G physical) caught up with it, the only lever left was to kill
# the single biggest consumer outright.
#
# `balloon:` is the guaranteed FLOOR; `memory:` stays the ceiling -- nothing
# here lowers any VM's maximum. Below the floor is where each value stops:
# generous margin for anything with a control-plane or interactively-used
# workload (k8s-master carries etcd; desktop is used directly), tighter where
# there is real slack. k8s-worker gets the most room to give back, since it is
# both the one that crashed and the one that actually needs the least most of
# the time (its own pod memory REQUESTS sum to 382Mi -- verified 2026-08-27).
#
# Staged rollout: VM 105 was applied and verified live first (2026-08-27) --
# pvesh status/current showed balloon_min=8192 landed and the live balloon
# target sitting at 22376 (above the floor, since the host had room at the
# time), VM uptime unchanged throughout, confirming this applies via QMP with
# no restart. The other six below were then enabled and applied the same way.
# `balloon` is not in the protected-key denylist
# (playbooks/tasks/proxmox-assert-safe-keys.yml lists it among the allowed
# runtime keys) and pve carries no proxmox_protected_vmids, so this applies with
# a plain `ansible-playbook playbooks/proxmox-config.yml`, no confirm flags.
proxmox_qm_config:
  - vmid: 102   # omv
    settings:
      balloon: 3072   # memory 4096, RSS was ~3.5-3.6G -- little slack, small floor cut
  - vmid: 103   # k8s-master -- carries etcd; conservative floor
    settings:
      balloon: 12288  # memory 16384
  - vmid: 104   # desktop -- interactively used; conservative floor
    settings:
      balloon: 12288  # memory 16384
  - vmid: 105   # k8s-worker -- the VM the kernel killed on 2026-08-24
    settings:
      balloon: 8192   # memory 24576. Pod memory requests sum to 382Mi; RSS
                       # after its post-crash reboot has stayed under 7G. The
                       # 24G ceiling is unchanged for whenever it is legitimately
                       # needed -- this only lowers what the host can reclaim.
  - vmid: 109   # vscode
    settings:
      balloon: 2048   # memory 4096
  - vmid: 111   # openclaw
    settings:
      balloon: 3072   # memory 8192, RSS was ~2G -- real slack here
  - vmid: 112   # haos -- home automation; conservative floor
    settings:
      balloon: 3072   # memory 4096
