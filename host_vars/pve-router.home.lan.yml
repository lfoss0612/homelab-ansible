---
# host_vars/pve-router.home.lan.yml

# Third host in the systemd-resolved standardization rollout (homelab-vault
# TODO.md). Pre-migration audit 2026-08-04, after pve-router joined
# openclaw_nodes: /etc/resolv.conf is a plain, non-immutable `nameserver
# 8.8.8.8` with no `.home.lan` awareness (this is why the openclaw-node
# service couldn't resolve openclaw.home.lan after the same-day fleet
# convergence). systemd-networkd is already active and owns the interfaces
# (vmbr0/vmbr1, the bridges the OPNsense VM's taps sit on, plus the VLAN
# sub-interface); systemd-resolved is not installed; NetworkManager and
# networking.service (ifupdown) are both inactive -- nothing competing for
# /etc/resolv.conf. This only changes the host's own userland DNS resolution
# (apt, openclaw-node, etc.) -- it does not touch vmbr0/vmbr1 bridge config
# or the network path OPNsense's guest traffic actually uses. Same shape as
# desktop's rollout: no blocker found.
openclaw_resolved_standardize: true

# LXC container config, managed by playbooks/proxmox-config.yml.
# Fixes the LXC DNS issue documented in README.md, Topology section: Proxmox's
# `pct` tooling writes /etc/resolv.conf directly into the container rootfs on
# every start, from host-side config only — not from anything set inside the
# guest. See homelab-vault TODO.md, "Standardize the fleet on systemd-resolved".
# The `ansible_default_ipv4.gateway` is a correct stand-in for "the right
# resolver" since OPNsense is both router and resolver on every VLAN.
proxmox_lxc_config:
  - vmid: 107   # cockpit (Ansible control node)
    settings:
      nameserver: "{{ ansible_default_ipv4.gateway }}"
  - vmid: 108   # pdm (Proxmox Datacenter Manager)
    settings:
      nameserver: "{{ ansible_default_ipv4.gateway }}"

# Guests needing a second confirmation on top of confirm_pve_router. That flag
# unlocks the host; this unlocks the guest. VM 106 is OPNsense -- it owns
# igc0/igc1/igc2 by PCIe passthrough, routes every VLAN in the house, serves
# DHCP and DNS, terminates HAProxy for all .home.lan services, and is the
# internal CA. It is also `protection: yes` in Proxmox itself. Nothing should
# reach it without someone typing the flag on purpose.
proxmox_protected_vmids: [106]

# First consumer of proxmox_qm_config -- the qm code path has existed since
# 2026-08-05 with none at all.
#
# Deliberately a NO-OP: every value below is already true on the live VM, so a
# correct run must report ZERO changes. That makes this a test of the
# read/parse/compare path carrying no write risk, while converting four facts
# that currently live only in the Proxmox UI into git-tracked declared state
# with drift detection on them.
#
# Every key here sits outside the protected-key denylist by design. The
# passthrough (hostpci0/1/2), disks, NICs and the OVMF/q35 boot chain are
# refused by playbooks/tasks/proxmox-assert-safe-keys.yml and stay manual,
# permanently. `protection` may be declared as 1 but never as 0 -- the same
# task file refuses a value that would disable it.
#
# Requires BOTH -e confirm_pve_router=true AND -e confirm_protected_vmids=true.
proxmox_qm_config:
  - vmid: 106   # OPNsense — the house router
    settings:
      onboot: 1
      startup: "order=1"
      protection: 1
      tags: "opnsense"
