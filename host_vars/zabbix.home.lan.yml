---
# host_vars/zabbix.home.lan.yml

# --- MySQL monitoring credentials ---------------------------------------------
#
# zabbix.home.lan runs its own MySQL 8.0 as the Zabbix server's database
# backend (DBUser=zabbix in /etc/zabbix/zabbix_server.conf). The Zabbix
# "MySQL by Zabbix agent 2" template needs its own read-only monitoring user,
# distinct from the zabbix-server's own DB user, for the same reason
# opnsense_api_key/_secret are dedicated per-caller (see
# group_vars/network_appliances.yml): sharing a credential between the
# server's own DB access and monitoring means neither can be revoked or
# re-scoped independently.
#
# playbooks/configure-mysql-monitoring.yml creates this user with:
#   GRANT SELECT ON performance_schema.* TO 'zbx_monitor'@'localhost';
#   GRANT REPLICATION CLIENT, PROCESS ON *.* TO 'zbx_monitor'@'localhost';
#
# Password generated with: openssl rand -base64 24 | tr -d '/+=' | head -c 32
zbx_mysql_user: zbx_monitor
zbx_mysql_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35626236393638313165336135383838363538623964346566383037373764356632666639303136
          3632623663313262656330396136303334653131353332640a366162633061653366373061643864
          33373033646564366134386636396663343263653034616463623465313331326535383436623263
          3762323931383234350a373065346461633535343532393539653531643466633764316566643166
          34333265653337633037656534303338666565336365396164353939613462316437

# --- Zabbix server's own MySQL DB user (DBUser=zabbix in zabbix_server.conf) --
#
# Distinct from zbx_mysql_password above -- that's the read-only monitoring
# user, this is the credential zabbix-server itself (and the web frontend's
# own separate /etc/zabbix/web/zabbix.conf.php) uses to reach its database.
# Rotated live 2026-09-26 by playbooks/rotate-zabbix-mysql-password.yml,
# which also fixed that play to actually sync the frontend config (found
# broken -- see the playbook's header comment) and to vault the new value
# here going forward, rather than leaving it unvaulted as before. Read via
# hostvars['zabbix.home.lan'].zabbix_db_password by any future playbook that
# needs it, same pattern as zabbix_api_token below. This value should be
# rotated by that playbook, not by hand-editing this block.
zabbix_db_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          38653935363764656331396238663936633835346465616664323032386364633964626362333235
          3464303932656561363063323633613631623565666539610a613962346134316332303565323435
          62333164313133626137313936363638623164316435646339336164303431343061633261396634
          3961366536643566650a626634376639643238643466353935666464346263636465373665323565
          33666664313966366264343261356464616662653932306632393566643437356337386630663139
          3237333137383765663231393266363537376633386536323432

# --- API token used by ~38 zabbix-*.yml / *-zabbix-*.yml playbooks ------------
#
# One token, shared across every playbook in this repo that calls the Zabbix
# JSON-RPC API from `hosts: localhost`. Those playbooks read it via
# `hostvars['zabbix.home.lan'].zabbix_api_token` rather than a `vars_files`
# include or plain group_vars auto-load, because `hosts: localhost` isn't a
# member of any inventory group this file applies to - hostvars resolves it
# anyway, since Ansible computes hostvars for every inventory host regardless
# of what the current play targets. Same reasoning as the openclaw_pin lookup
# in zabbix-openclaw-version-item.yml (see that file's header comment).
#
# Was plaintext, inline, in all ~38 playbooks until 2026-09-24 - moved here
# after the value got echoed into a Claude session transcript by an unrelated
# `grep -n` while looking up how to call the Zabbix API.
#
# Rotated 2026-09-27: belongs to the Zabbix user's token renamed
# "ansible-admin" (was "smart-monitoring" -- misleadingly named, since none
# of the SMART-monitoring playbooks ever used the API token at all;
# SMART/OOM-kill data delivery goes over the zabbix_sender/trapper
# protocol, which isn't gated by API-token RBAC. The ~38 playbooks that DO
# use this token need a genuinely broad ~31-method spread across hosts,
# discovery rules, items/prototypes, triggers/prototypes, macros, valuemaps,
# templates and dashboards). Minted by hand in the Zabbix UI (token.create/
# token.get are both refused to this token's own role, so that step can't
# be scripted -- see playbooks/rotate-zabbix-api-token.yml's header comment
# for why not routing around that via a raw DB insert).
#
# ROTATED A SECOND TIME the same day: the first replacement value was
# accidentally exposed in a Claude session transcript by a diagnostic uri
# task missing no_log:true (a Python http.client exception put the raw
# Authorization header, token included, into its error message). Confirmed
# THIS value is clean before vaulting: no trailing newline (the earlier
# exposure incidentally revealed the first replacement had one -- typing a
# token into an interactive `ansible-vault encrypt_string` prompt and
# pressing Enter before Ctrl+D captures that newline as part of the
# string), no other stray whitespace, and it authenticates live via
# host.get. The OLD (twice-since-superseded) token value is still active
# in Zabbix until disabled/deleted by hand in the UI.
zabbix_api_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          34643833366630306261343530316162363263616239373331386366653463646131373161623735
          3533326564643238386263313630373662626466313233630a323932386565306639323237336638
          61643366383830343931316637313064306133323765626632376338323032653135383861646239
          3933313931646363320a383639623130383139356666376636333366346162356638376633346262
          64346264393133376639373263363933393165316434643164626630306333363766666266623438
          61653936653532633662623030643932306236663264396334356231313466613165626438323832
          34343534383839303032373365333338353933343837643534643532643638396438663134313134
          36386133366465303035
