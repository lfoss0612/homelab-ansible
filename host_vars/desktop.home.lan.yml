---
# host_vars/desktop.home.lan.yml

# Second host in the systemd-networkd standardization rollout (homelab-vault
# TODO.md) -- the one real NetworkManager -> networkd migration in the fleet.
# desktop is the user's actively-used interactive workstation, so unlike every
# other host touched by this project, this is deliberately staged as
# prep-now/cutover-on-next-reboot rather than a live hot-swap: NetworkManager
# keeps running normally until the user reboots on their own schedule.
# ens18 is plain DHCP with no static overrides (confirmed via `nmcli con show
# "Wired connection 1"` 2026-08-03) -- no static Address/DNS to replicate.
openclaw_networkd_migrate_from_nm: true

# systemd-resolved standardization (homelab-vault TODO.md). Networkd cutover
# above is confirmed live (systemd-networkd active, NetworkManager inactive,
# 2026-08-04) -- the only thing left on this host is the resolver: no
# systemd-resolved package installed, /etc/resolv.conf is a static leftover
# NetworkManager wrote before it was disabled (nameserver 10.10.5.1, no
# chattr +i). No blocker found; same shape as pbs's rollout.
openclaw_resolved_standardize: true
