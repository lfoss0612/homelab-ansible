---
# One convergence stage of update-openclaw.yml (do not run it on its own). The wrapper imports
# it once per hop in openclaw_upgrade_path and once more for the pin; `openclaw_stage` says which:
#   openclaw_stage: 0, 1, 2   the hop openclaw_upgrade_path[stage]
#   openclaw_stage: -1        the pin (openclaw_pin, recorded by the wrapper from group_vars)
# Phases 1-4 are the old update-openclaw.yml unchanged except that, in a hop stage, a host that is
# already at or past the hop (or has no OpenClaw yet) is skipped, and the downgrade guard is not
# applied, because a hop is only ever a way up to the pin.
# The role does the real work: a changed package makes the gateway role stop the services and run
# `openclaw doctor --fix --non-interactive`, so doctor runs at every hop.

- name: Select the version for this stage
  hosts: openclaw:!openclaw_deferred
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Set openclaw_version to this stage's target
      ansible.builtin.set_fact:
        openclaw_version: >-
          {{ openclaw_upgrade_path[openclaw_stage | int] if (openclaw_stage | int) >= 0 else openclaw_pin }}
        openclaw_stage_is_hop: "{{ (openclaw_stage | int) >= 0 }}"

# ============================================================
# PHASE 1 — Verify: compare installed version against the pin
# ============================================================
- name: Detect installed OpenClaw versions
  hosts: openclaw:!openclaw_deferred
  gather_facts: false
  become: true
  # A host that cannot be reached here is not marked failed, so it is still
  # tried in its own convergence play below — where a *required* host failing
  # is loud, and an optional one is skipped. Suppressing it here loses nothing.
  #
  # It does NOT skip the rest of this play for that host, though: the two tasks
  # below read `openclaw_installed_version`, which on an unreachable host is a
  # dict with no `.rc`/`.stdout`. Both are therefore guarded, leaving
  # openclaw_update_required undefined — which the convergence plays read as
  # `| default(true)`.
  ignore_unreachable: true

  tasks:
    - name: Check installed openclaw CLI version
      ansible.builtin.command: openclaw --version
      register: openclaw_installed_version
      changed_when: false
      failed_when: false
      # Read-only, so it must run in --check too. Skipped there, every host
      # reads as "update required" and the downgrade guard below has no version
      # to compare, so a bump dry-run showed the whole fleet changing.
      check_mode: false

    - name: Determine whether this host needs updating
      ansible.builtin.set_fact:
        openclaw_update_required: >-
          {%- if openclaw_stage_is_hop | default(false) | bool -%}
          {{ openclaw_installed_version.rc == 0 and
             (openclaw_installed_version.stdout | regex_search('[0-9]+[.][0-9]+[.][0-9]+(-[0-9]+)?') | default('0.0.0', true))
             is version(openclaw_version, '<') }}
          {%- else -%}
          {{ openclaw_installed_version.rc != 0 or
             openclaw_version not in openclaw_installed_version.stdout }}
          {%- endif -%}
      when: not (openclaw_installed_version.unreachable | default(false))

    # A gateway that has already been migrated to a newer release cannot be
    # taken back: an older build refuses the newer SQLite schema ("unreleased
    # session schema"), and doctor does not downgrade. The weekly timer only
    # reads the pin in git, so a gateway bumped by hand ahead of a commit (or a
    # pin reverted after a rollback) would otherwise be "converged" into a
    # broken state. Versions compare as [year, minor, patch, suffix].
    - name: Refuse to downgrade the gateway
      ansible.builtin.assert:
        that: >-
          openclaw_downgrade_ok | default(false) | bool or
          (openclaw_installed_version.stdout | regex_findall('(\\d+)\\.(\\d+)\\.(\\d+)(?:-(\\d+))?') | first | default(['0','0','0',''])
           | map('int') | list)
          <= (openclaw_version | regex_findall('(\\d+)\\.(\\d+)\\.(\\d+)(?:-(\\d+))?') | first
              | map('int') | list)
        fail_msg: >-
          The gateway is on '{{ openclaw_installed_version.stdout }}', NEWER than
          the pin {{ openclaw_version }}. Refusing to downgrade it (older builds
          cannot read the newer state). Raise openclaw_version in
          group_vars/openclaw.yml, or pass -e openclaw_downgrade_ok=true after
          restoring state from backup.
        quiet: true
      when:
        - inventory_hostname in groups['openclaw_gateway']
        - not (openclaw_installed_version.unreachable | default(false))
        - openclaw_installed_version.rc == 0
        - not (openclaw_stage_is_hop | default(false) | bool)

    # Remembered across stages (set_fact persists per host) so the wrapper knows, after the last
    # stage, whether anything in the fleet moved and approvals are worth running.
    - name: Remember that this host was updated in this run
      ansible.builtin.set_fact:
        openclaw_was_updated: "{{ (openclaw_was_updated | default(false) | bool) or (openclaw_update_required | bool) }}"
      when: not (openclaw_installed_version.unreachable | default(false))

    - name: Report current state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ openclaw_installed_version.stdout | default('not installed') }}
          -> {{ 'hop ' ~ openclaw_version if openclaw_stage_is_hop | default(false) | bool else 'pin ' ~ openclaw_version }}:
          update {{ 'required' if openclaw_update_required else 'not required' }}
      when: not (openclaw_installed_version.unreachable | default(false))

    - name: Report an unreachable host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is unreachable — assuming an update is
          required; its convergence play decides whether that is a failure.
      when: openclaw_installed_version.unreachable | default(false)

# ============================================================
# PHASE 1b — Snapshot the gateway VM before its state is migrated
# ============================================================
# State migration is one-way: an older build refuses the migrated state, and three rollbacks
# on 2026-11-17 were all from a VM snapshot. Taken only when the gateway really will change in
# this stage; a second run on the same day keeps the first snapshot. Off with
# -e openclaw_pre_bump_snapshot=false. Remove old ones with playbooks/prune-snapshots.yml.
- name: Snapshot the gateway before it changes
  ansible.builtin.import_playbook: pre-change-snapshot.yml
  vars:
    snapshot_targets: openclaw_gateway
    snapshot_change: "openclaw-{{ openclaw_version | replace('.', '-') }}"
    snapshot_skip_existing: true
  when:
    - openclaw_pre_bump_snapshot | default(true) | bool
    - openclaw_update_required | default(false) | bool

# ============================================================
# PHASE 2 — Gateway first
# ============================================================
- name: Update gateway
  hosts: openclaw_gateway
  serial: 1
  become: true
  gather_facts: true

  tasks:
    # default(true) covers a host that was unreachable in Phase 1: assume it
    # needs updating rather than silently treating an undefined fact as
    # "converged".
    - name: Skip — gateway already at the pinned version
      ansible.builtin.meta: end_host
      when: not (openclaw_update_required | default(true))

    - name: Converge gateway to the pinned version
      ansible.builtin.include_role:
        name: openclaw.node.gateway

# ============================================================
# PHASE 3 — Nodes, serialized, gateway already verified healthy
# ============================================================
- name: Update nodes
  hosts: openclaw_nodes:!openclaw_optional:!openclaw_deferred
  serial: 1
  become: true
  gather_facts: false

  tasks:
    - name: Converge this node unless it is already at the pin
      ansible.builtin.include_tasks: tasks/converge-openclaw-node.yml
      when: openclaw_update_required | default(true)

# ============================================================
# PHASE 4 — Intermittently-powered nodes; offline is a skip, not a failure
# ============================================================
- name: Update intermittently-powered nodes
  hosts: openclaw_optional
  serial: 1
  become: true
  gather_facts: false
  ignore_unreachable: true

  tasks:
    # ignore_unreachable keeps a powered-off host out of the failed list but
    # does not stop it entering the tasks below, so gate on an explicit probe
    # rather than letting the role fail task by task.
    - name: Probe reachability — this host is allowed to be powered off
      ansible.builtin.ping:
      register: openclaw_optional_probe
      changed_when: false

    - name: Report a powered-off optional host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is unreachable — expected for an
          [openclaw_optional] host; it converges on the next run while up.
      when: openclaw_optional_probe.unreachable | default(false)

    - name: Converge this node unless it is already at the pin
      ansible.builtin.include_tasks: tasks/converge-openclaw-node.yml
      when:
        - not (openclaw_optional_probe.unreachable | default(false))
        - openclaw_update_required | default(true)
