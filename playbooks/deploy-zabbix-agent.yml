---
# Deploy Zabbix Agent 2 to all monitored hosts
#
# Usage:
#   ansible-playbook playbooks/deploy-zabbix-agent.yml --check --diff
#   ansible-playbook playbooks/deploy-zabbix-agent.yml

- name: Deploy Zabbix Agent 2
  hosts: all:!api_managed
  become: true

  vars:
    zabbix_server: "10.0.5.9"
    zabbix_server_port: "10051"

  handlers:
    - name: restart_zabbix_agent2
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install Zabbix Agent 2 repository key
      ansible.builtin.apt_key:
        url: https://repo.zabbix.com/zabbix-official-repo.key
        state: present
      register: zabbix_repo_key
      failed_when: false

    - name: Add Zabbix Agent 2 repository
      ansible.builtin.shell: |
        echo "deb https://repo.zabbix.com/zabbix/7.4/$(lsb_release -cs)/ main" > /etc/apt/sources.list.d/zabbix.list
      register: zabbix_repo
      changed_when: true
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: zabbix_repo.changed or zabbix_repo_key.changed
      changed_when: false

    - name: Install Zabbix Agent 2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
      register: zabbix_agent_install

    - name: Create Zabbix Agent 2 configuration directory
      ansible.builtin.file:
        path: /etc/zabbix/zabbix_agent2.d/plugins.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure Zabbix Agent 2
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - regexp: "^# Server="
          line: "Server={{ zabbix_server }}"
        - regexp: "^Server="
          line: "Server={{ zabbix_server }}"
        - regexp: "^# Hostname="
          line: "Hostname={{ inventory_hostname }}"
        - regexp: "^Hostname="
          line: "Hostname={{ inventory_hostname }}"
        - regexp: "^# ServerActive="
          line: "ServerActive={{ zabbix_server }}:{{ zabbix_server_port }}"
        - regexp: "^ServerActive="
          line: "ServerActive={{ zabbix_server }}:{{ zabbix_server_port }}"
      notify: restart_zabbix_agent2

    - name: Enable and start Zabbix Agent 2
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify Zabbix Agent 2 is running
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        state: started
      register: zabbix_agent_status

    - name: Show Zabbix Agent 2 status
      ansible.builtin.debug:
        msg: |
          Zabbix Agent 2 deployed on {{ inventory_hostname }}
          Server: {{ zabbix_server }}
          Port: {{ zabbix_server_port }}
          Hostname: {{ inventory_hostname }}
          Status: {{ zabbix_agent_status.status.ActiveState }}
