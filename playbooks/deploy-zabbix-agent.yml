---
# Deploy Zabbix Agent 2 to all monitored hosts
#
# Usage:
#   ansible-playbook playbooks/deploy-zabbix-agent.yml --check --diff
#   ansible-playbook playbooks/deploy-zabbix-agent.yml

- name: Deploy Zabbix Agent 2
  hosts: all:!api_managed
  become: true

  vars:
    zabbix_server: "10.0.5.9"
    zabbix_server_port: "10051"

  handlers:
    - name: restart_zabbix_agent
      ansible.builtin.systemd_service:
        name: zabbix-agent
        state: restarted

  tasks:
    - name: Clean up malformed Zabbix repository entries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/repo_zabbix_com_zabbix_7_4_trixie.list
        - /etc/apt/sources.list.d/repo_zabbix_com_zabbix_7_4_bookworm.list
        - /etc/apt/sources.list.d/repo_zabbix_com_zabbix_7_4_noble.list
        - /etc/apt/sources.list.d/zabbix.list
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Install Zabbix Agent
      ansible.builtin.apt:
        name: zabbix-agent
        state: present
      register: zabbix_agent_install

    - name: Configure Zabbix Agent
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - regexp: "^# Server="
          line: "Server={{ zabbix_server }}"
        - regexp: "^Server="
          line: "Server={{ zabbix_server }}"
        - regexp: "^# Hostname="
          line: "Hostname={{ inventory_hostname }}"
        - regexp: "^Hostname="
          line: "Hostname={{ inventory_hostname }}"
        - regexp: "^# ServerActive="
          line: "ServerActive={{ zabbix_server }}:{{ zabbix_server_port }}"
        - regexp: "^ServerActive="
          line: "ServerActive={{ zabbix_server }}:{{ zabbix_server_port }}"
      notify: restart_zabbix_agent

    - name: Enable and start Zabbix Agent
      ansible.builtin.systemd_service:
        name: zabbix-agent
        enabled: true
        state: started

    - name: Verify Zabbix Agent is running
      ansible.builtin.systemd_service:
        name: zabbix-agent
        state: started
      register: zabbix_agent_status

    - name: Show Zabbix Agent status
      ansible.builtin.debug:
        msg: |
          Zabbix Agent deployed on {{ inventory_hostname }}
          Server: {{ zabbix_server }}
          Port: {{ zabbix_server_port }}
          Hostname: {{ inventory_hostname }}
          Status: {{ zabbix_agent_status.status.ActiveState }}
