---
# Converge the MANAGED SUBSET of Unbound host overrides declared in
# host_vars/opnsense.home.lan.yml.
#
# This is the only play in this repo that writes to OPNsense. Its scope is
# deliberately one object type: Unbound host overrides, create and update only.
# Firewall rules, aliases, NAT, interfaces, HAProxy, VPN, the CA and ACME are
# all out of scope and stay manual. There is NO delete path — entries on the
# box that are not declared are reported and never touched.
#
# THREE GATES, all required:
#   1. opnsense_unbound_overrides_manage: true   (host_vars, opt-in per host)
#   2. opnsense_unbound_overrides_enforce: converge  (host_vars)
#   3. -e confirm_opnsense_write=true            (command line, every run)
# A missing gate reports and skips; it does not fail.
#
# confirm_opnsense_write is deliberately NOT confirm_pve_router. That flag
# means "you may mutate the hypervisor"; this one means "you may mutate the
# router's DNS". Reusing one variable for two meanings is exactly what caused
# the OpenClaw gateway outage during the HAProxy migration.
#
# Usage:
#   ansible-playbook playbooks/opnsense-unbound.yml --check --diff
#   ansible-playbook playbooks/opnsense-unbound.yml --check --diff -e confirm_opnsense_write=true
#   ansible-playbook playbooks/opnsense-unbound.yml -e confirm_opnsense_write=true
#
# Requires the oxlorg.opnsense collection and httpx on the control node:
#   ansible-playbook playbooks/bootstrap/opnsense-api-deps.yml
#   ansible-galaxy collection install -r collections/requirements.yml -p ~/.ansible/collections

- name: Converge Unbound host overrides
  hosts: network_appliances
  # See group_vars/network_appliances.yml: ansible_connection is local, so
  # without this every API call would sudo to root on the control node.
  become: false
  gather_facts: true

  handlers:
    # One reconfigure for N changed overrides, rather than the collection's
    # per-task `reload: true`. Unbound restarts are not free and there is no
    # reason to do it once per record.
    - name: reconfigure unbound
      ansible.builtin.uri:
        url: "{{ opnsense_api_base }}/unbound/service/reconfigure"
        method: POST
        url_username: "{{ opnsense_api_key }}"
        url_password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: true
        ca_path: "{{ opnsense_api_ca_file }}"
        status_code: [200]
        timeout: 120
      no_log: true
      when: not ansible_check_mode

  tasks:
    - name: Assert API credentials are present
      ansible.builtin.assert:
        that:
          - opnsense_api_key | default('') | length > 0
          - opnsense_api_secret | default('') | length > 0
        fail_msg: >-
          opnsense_api_key/opnsense_api_secret are empty in
          group_vars/network_appliances.yml. See that file for the
          ansible-vault encrypt_string instructions.
        quiet: true

    - name: Determine whether all write gates are open
      ansible.builtin.set_fact:
        opnsense_write_allowed: >-
          {{ (opnsense_unbound_overrides_manage | default(false) | bool)
             and (opnsense_unbound_overrides_enforce | default('report') == 'converge')
             and (confirm_opnsense_write | default(false) | bool) }}
      changed_when: false

    # Report-then-skip, matching tasks/confirm-pve-router.yml. A closed gate is
    # a normal outcome, not an error — the drift report below still runs and is
    # the useful output of such a run.
    - name: Report which write gates are closed
      ansible.builtin.debug:
        msg: >-
          Unbound overrides will NOT be written. Gates:
          opnsense_unbound_overrides_manage={{ opnsense_unbound_overrides_manage | default(false) }},
          opnsense_unbound_overrides_enforce={{ opnsense_unbound_overrides_enforce | default('report') }},
          confirm_opnsense_write={{ confirm_opnsense_write | default(false) }}.
          All three must be true/converge/true. Drift is reported below either way.
      when: not (opnsense_write_allowed | bool)

    - name: Classify declared overrides against the live state
      ansible.builtin.include_tasks: tasks/opnsense-unbound-diff.yml

    - name: Report that no change is pending
      ansible.builtin.debug:
        msg: "Unbound host overrides are already converged; nothing to do."
      when: opnsense_unbound_converged | bool

    # --- Back up before mutating ---------------------------------------------
    # The config.xml backup IS the rollback artefact for what follows, so it is
    # taken before the first write and the writes are gated on it succeeding.
    # A failed backup skips the writes (a safe no-op) rather than failing the
    # play or proceeding blind.
    - name: Back up the OPNsense config before writing
      ansible.builtin.include_tasks: tasks/opnsense-backup-config.yml
      when:
        - opnsense_write_allowed | bool
        - not (opnsense_unbound_converged | bool)

    - name: Report that writes are being skipped for want of a backup
      ansible.builtin.debug:
        msg: >-
          Skipping all Unbound writes: the pre-write config.xml backup did not
          validate, so there would be no rollback artefact. Fix the backup
          first (check the "System: Configuration: Backups" API privilege),
          then re-run. Nothing has been changed.
      when:
        - opnsense_write_allowed | bool
        - not (opnsense_unbound_converged | bool)
        - not (opnsense_backup_ok | default(false) | bool)
        - not ansible_check_mode

    # --- Write ---------------------------------------------------------------
    - name: Converge the managed Unbound host overrides
      oxlorg.opnsense.unbound_host:
        firewall: "{{ opnsense_api_host }}"
        api_port: 443
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        ssl_verify: true
        ssl_ca_file: "{{ opnsense_api_ca_file }}"
        hostname: "{{ item.hostname }}"
        domain: "{{ item.domain }}"
        record_type: "{{ item.rr | default('A') }}"
        value: "{{ item.server }}"
        description: "{{ item.description | default(omit) }}"
        state: present
        enabled: true
        # match_fields defaults to
        #   [hostname, domain, record_type, value, prio]
        # which means a CHANGED value makes the module treat the entry as a
        # brand-new record and CREATE A DUPLICATE instead of updating the
        # existing one. Verified against the module source
        # (plugins/modules/unbound_host.py) rather than assumed. Matching on
        # the identity of the record only — hostname+domain — gives
        # update-in-place, which is what this play means by "converge".
        match_fields: [hostname, domain]
        # The reconfigure is done once, by the handler, not per record.
        reload: false
      loop: >-
        {{ (opnsense_unbound_to_create | default([]))
           + (opnsense_unbound_to_update | default([])) }}
      loop_control:
        label: "{{ item.fqdn }} -> {{ item.server }}"
      no_log: true
      notify: reconfigure unbound
      when:
        - opnsense_write_allowed | bool
        - not (opnsense_unbound_converged | bool)
        - opnsense_backup_ok | default(false) | bool

    - name: Apply the Unbound configuration now
      ansible.builtin.meta: flush_handlers

    # --- Verify --------------------------------------------------------------
    # There is no dry-run/validate endpoint for Unbound, unlike `openclaw config
    # patch --dry-run` which the models role leans on. That is a real gap in the
    # safety model; the config.xml backup is what compensates for it. So verify
    # hard, after the fact.

    - name: Re-read and re-classify to confirm the writes landed
      ansible.builtin.include_tasks: tasks/opnsense-unbound-diff.yml
      when:
        - opnsense_write_allowed | bool
        - opnsense_backup_ok | default(false) | bool
        - not ansible_check_mode

    - name: Assert the managed overrides are now converged
      ansible.builtin.assert:
        that:
          - opnsense_unbound_converged | bool
        fail_msg: >-
          The API calls reported success but the managed overrides still do not
          match: create
          {{ opnsense_unbound_to_create | map(attribute='fqdn') | list }},
          update
          {{ opnsense_unbound_to_update | map(attribute='fqdn') | list }}.
          If a duplicate record appeared, match_fields was wrong. Restore from
          {{ opnsense_backup_path | default('/var/backups/opnsense/config-*.xml') }}
          via the GUI if needed.
        quiet: true
      when:
        - opnsense_write_allowed | bool
        - opnsense_backup_ok | default(false) | bool
        - not ansible_check_mode

    # The one check that actually matters. `reconfigure` can return 200 and
    # still leave Unbound dead — only a real query proves DNS is up.
    - name: Prove DNS still resolves through Unbound
      ansible.builtin.command: "dig +short +time=3 +tries=1 @10.0.5.1 {{ item }}"
      loop:
        - pve-router.home.lan
        - pve.home.lan
      register: opnsense_dns_proof
      changed_when: false
      check_mode: false
      failed_when: false
      until: opnsense_dns_proof.stdout | trim | length > 0
      retries: 10
      delay: 3
      when:
        - opnsense_write_allowed | bool
        - opnsense_backup_ok | default(false) | bool
        - not ansible_check_mode

    # Fail loudly and name the restore path. Deliberately NO automatic
    # rollback: restoring a whole config.xml through an appliance whose state
    # is now unknown is under-specified, and a half-applied restore is worse
    # than a clean manual one.
    - name: Assert DNS resolution survived the change
      ansible.builtin.assert:
        that:
          - opnsense_dns_proof.results | rejectattr('stdout', 'truthy') | list | length == 0
        fail_msg: >-
          DNS IS NOT RESOLVING through Unbound at 10.0.5.1 after this change.
          Restore immediately:
          (1) The pre-change backup is
              {{ opnsense_backup_path | default('/var/backups/opnsense/config-*.xml') }}
              on {{ ansible_hostname }}.
          (2) The OPNsense GUI stays reachable at https://10.0.5.1:8443 BY IP
              with DNS down — the LAB anti-lockout firewall rule guarantees
              tcp/8443 from 10.0.5.0/24. Go to System > Configuration >
              Backups > Restore and upload that file. No reboot is needed.
          (3) If the GUI is also unreachable, use the out-of-band path in
              homelab-vault Proxmox/ops/pve-router-recovery.md: patch a cable
              into the office switch and browse to https://10.0.5.2:8006
              directly, then use the VM 106 console.
          Do NOT re-run this play to "fix" it.
        success_msg: "DNS resolution confirmed through Unbound after the change."
        quiet: true
      when:
        - opnsense_write_allowed | bool
        - opnsense_backup_ok | default(false) | bool
        - not ansible_check_mode
