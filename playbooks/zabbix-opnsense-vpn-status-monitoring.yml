---
# Alert on OPNsense VPN status (OpenVPN client + WireGuard servers) by polling
# the OPNsense REST API directly from the Zabbix server — an HTTP agent item,
# same "runs server-side, survives OPNsense's own agent being wedged"
# property as the WAN gateway icmpping item in
# zabbix-opnsense-wan-gateway-monitoring.yml. Chosen over a UserParameter
# script on OPNsense's Zabbix agent (the original plan) because the API
# already returns clean structured JSON instead of ifconfig/configctl/wg-show
# text this repo would otherwise have to parse and keep in sync with
# FreeBSD's own output format across OPNsense versions.
#
# Credential: `zabbix-vpn-status`, a fourth dedicated OPNsense API user
# (group_vars/network_appliances.yml, opnsense_zabbix_api_key/_secret) — NOT
# Claude's read-only key and NOT ansible-writer. Same one-credential-per-
# caller reasoning as those two. Granted exactly: Status: OpenVPN,
# VPN: WireGuard: Status.
#
# OpenVPN response shape confirmed live 2026-09-29 against
# GET /api/openvpn/service/search_sessions:
#   {"total":1,"rowCount":1,"current":1,
#    "rows":[{"status":"reconnecting", ..., "description":"NordVPN_CA1520"}]}
# Single client configured, so this hangs one item off $.rows[0].status
# rather than looping — revisit if a second OpenVPN client is ever added.
#
# WireGuard response shape NOT YET CONFIRMED — the "VPN: WireGuard: Status"
# privilege didn't exist on any key until this playbook's credential was
# created, so GET /api/wireguard/service/status has never been queried
# successfully. The WireGuard section below is deliberately a read-only
# diagnostic task, not an item, until a real response is seen: this repo's
# standing lesson (see the OPNsense goal-1 handoff, 2026-09-28) is not to
# guess FreeBSD/OPNsense-specific output shapes from memory. Run this
# playbook once, read the "WireGuard raw response" debug output, then fill
# in the item/trigger below it before the next run.
#
# item.delete / trigger.delete are refused to this repo's Zabbix API token —
# get-then-create throughout, same as every other *-zabbix-*.yml play here.
#
# Usage:
#   ansible-playbook playbooks/zabbix-opnsense-vpn-status-monitoring.yml --check --diff
#   ansible-playbook playbooks/zabbix-opnsense-vpn-status-monitoring.yml

- name: Alert on OPNsense VPN status
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "{{ hostvars['zabbix.home.lan'].zabbix_api_token }}"

    item_host: "opnsense.home.lan"
    opnsense_api_base: "https://opnsense.home.lan/api"

    openvpn_item_key: "openvpn.status"
    openvpn_item_name: "OpenVPN client (NordVPN_CA1520) status"
    openvpn_trigger_description: "OpenVPN client (NordVPN_CA1520) is not connected"

  tasks:
    - name: "{{ item_host }} — resolve the Zabbix host id"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output: ["hostid", "host"]
            filter: {host: ["{{ item_host }}"]}
          id: 1
      register: host_lookup
      check_mode: false
      no_log: true
      failed_when: >-
        host_lookup.json.error is defined
        or (host_lookup.json.result | default([]) | length) != 1

    - name: "{{ item_host }} — set the host id"
      ansible.builtin.set_fact:
        item_hostid: "{{ host_lookup.json.result[0].hostid }}"

    # ------------------------------------------------------------- OpenVPN

    - name: "{{ item_host }} — look for the existing OpenVPN status item"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ item_hostid }}"]
            search: {key_: "{{ openvpn_item_key }}"}
          id: 1
      register: openvpn_item_lookup
      check_mode: false
      no_log: true
      failed_when: openvpn_item_lookup.json.error is defined

    - name: "{{ item_host }} — create the OpenVPN status item"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            hostid: "{{ item_hostid }}"
            name: "{{ openvpn_item_name }}"
            key_: "{{ openvpn_item_key }}"
            type: 19       # HTTP agent — polled by the Zabbix server itself
            value_type: 1  # character (short text: "connected"/"reconnecting"/etc.)
            delay: "1m"
            url: "{{ opnsense_api_base }}/openvpn/service/search_sessions"
            authtype: 1    # basic auth
            username: "{{ opnsense_zabbix_api_key }}"
            password: "{{ opnsense_zabbix_api_secret }}"
            preprocessing:
              - type: 12   # JSONPath
                params: "$.rows[0].status"
                error_handler: 0
            description: >-
              Polls the OPNsense API directly (no agent involved) for the
              NordVPN OpenVPN client's session status. Expected value when
              healthy: "connected".
          id: 1
      register: openvpn_item_create
      when: (openvpn_item_lookup.json.result | default([]) | length) == 0
      no_log: true
      changed_when: openvpn_item_create.json.result is defined
      failed_when: openvpn_item_create.json.error is defined

    - name: "{{ item_host }} — look for the existing OpenVPN trigger"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.get
          params:
            output: ["triggerid", "description"]
            host: "{{ item_host }}"
          id: 1
      register: trigger_lookup
      check_mode: false
      no_log: true
      failed_when: trigger_lookup.json.error is defined

    - name: "{{ item_host }} — create the OpenVPN trigger"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.create
          params:
            description: "{{ openvpn_trigger_description }}"
            # Three consecutive polls (three minutes at 1m delay) not equal
            # to "connected" — tolerates one transient "reconnecting" blip,
            # same #3 debounce as the WAN gateway and MetalLB VIP triggers.
            expression: 'count(/{{ item_host }}/{{ openvpn_item_key }},#3,"ne","connected")=3'
            priority: 3     # Average
            manual_close: 0
            tags:
              - {tag: "component", value: "opnsense"}
              - {tag: "target", value: "openvpn"}
          id: 1
      register: openvpn_trigger_create
      when: >-
        (trigger_lookup.json.result
         | selectattr('description', 'eq', openvpn_trigger_description)
         | list | length) == 0
      no_log: true
      changed_when: openvpn_trigger_create.json.result is defined
      failed_when: openvpn_trigger_create.json.error is defined

    # ------------------------------------------------------------ WireGuard
    # Diagnostic only — see header. Not gated behind no_log: the response
    # body carries peer/handshake data, not the credential (the credential
    # is only ever in the Authorization header, which IS suppressed below).

    - name: "{{ item_host }} — WireGuard status (diagnostic read, no item created yet)"
      ansible.builtin.uri:
        url: "{{ opnsense_api_base }}/wireguard/service/status"
        method: GET
        url_username: "{{ opnsense_zabbix_api_key }}"
        url_password: "{{ opnsense_zabbix_api_secret }}"
        force_basic_auth: true
        ca_path: "{{ opnsense_api_ca_file }}"
      register: wireguard_probe
      check_mode: false
      no_log: true
      failed_when: false

    - name: "{{ item_host }} — WireGuard raw response (safe to read: no credential in the body)"
      ansible.builtin.debug:
        msg: "HTTP {{ wireguard_probe.status }} — {{ wireguard_probe.json | default(wireguard_probe.content) }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ item_host }}: OpenVPN item {{ openvpn_item_key }}
          {{ 'created' if (openvpn_item_create.changed | default(false)) else 'already present' }},
          trigger "{{ openvpn_trigger_description }}"
          {{ 'created' if (openvpn_trigger_create.changed | default(false)) else 'already present' }}.
          WireGuard: diagnostic only this run — see the raw response above
          and fill in its item/trigger next.
