---
# Alert on OPNsense VPN status (OpenVPN client + WireGuard servers) by polling
# the OPNsense REST API directly from the Zabbix server — an HTTP agent item,
# same "runs server-side, survives OPNsense's own agent being wedged"
# property as the WAN gateway icmpping item in
# zabbix-opnsense-wan-gateway-monitoring.yml. Chosen over a UserParameter
# script on OPNsense's Zabbix agent (the original plan) because the API
# already returns clean structured JSON instead of ifconfig/configctl/wg-show
# text this repo would otherwise have to parse and keep in sync with
# FreeBSD's own output format across OPNsense versions.
#
# Credential: `zabbix-vpn-status`, a fourth dedicated OPNsense API user
# (group_vars/network_appliances.yml, opnsense_zabbix_api_key/_secret) — NOT
# Claude's read-only key and NOT ansible-writer. Same one-credential-per-
# caller reasoning as those two. Granted exactly: Status: OpenVPN,
# VPN: WireGuard: Status.
#
# OpenVPN response shape confirmed live 2026-09-29 against
# GET /api/openvpn/service/search_sessions:
#   {"total":1,"rowCount":1,"current":1,
#    "rows":[{"status":"reconnecting", ..., "description":"NordVPN_CA1520"}]}
# Single client configured, so this hangs one item off $.rows[0].status
# rather than looping — revisit if a second OpenVPN client is ever added.
#
# WireGuard response shape confirmed live 2026-09-29, in two steps (don't
# guess OPNsense-specific output shapes from memory — see the goal-1 handoff,
# 2026-09-28):
#   GET /api/wireguard/service/status  -> {"status":"unknown","widget":{...}}
#     A generic service-running summary, not per-tunnel data. Not used.
#   GET /api/wireguard/service/show    -> flat rows mixing type:"interface"
#     (one per wg0/wg1, own up/down "status") and type:"peer" (one per
#     remote client, "peer-status" of online/offline). Used here.
# The item hangs off each interface row's OWN status, filtered by name
# ("vpn"/"vpn_443") and type=="interface" — NOT peer-status, which reads
# "offline" for every peer whenever no remote client happens to be
# connected. That is the normal idle state for a remote-access VPN, not a
# fault, so alerting on it would be permanent false-positive noise.
#
# item.delete / trigger.delete are refused to this repo's Zabbix API token —
# get-then-create throughout, same as every other *-zabbix-*.yml play here.
#
# Usage:
#   ansible-playbook playbooks/zabbix-opnsense-vpn-status-monitoring.yml --check --diff
#   ansible-playbook playbooks/zabbix-opnsense-vpn-status-monitoring.yml

- name: Alert on OPNsense VPN status
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "{{ hostvars['zabbix.home.lan'].zabbix_api_token }}"

    item_host: "opnsense.home.lan"
    opnsense_api_base: "https://opnsense.home.lan/api"
    # opnsense_zabbix_api_key/_secret and opnsense_api_ca_file live in
    # group_vars/network_appliances.yml, scoped to the network_appliances
    # group (opnsense.home.lan) — this play targets localhost like every
    # other zabbix-*.yml play here, so they need the same hostvars lookup
    # as zabbix_api_token above, not plain group_vars inheritance.
    opnsense_zabbix_api_key: "{{ hostvars['opnsense.home.lan'].opnsense_zabbix_api_key }}"
    opnsense_zabbix_api_secret: "{{ hostvars['opnsense.home.lan'].opnsense_zabbix_api_secret }}"
    opnsense_api_ca_file: "{{ hostvars['opnsense.home.lan'].opnsense_api_ca_file }}"

    openvpn_item_key: "openvpn.status"
    openvpn_item_name: "OpenVPN client (NordVPN_CA1520) status"
    openvpn_trigger_description: "OpenVPN client (NordVPN_CA1520) is not connected"

    # name/ifname match service/show's own "name"/"if" fields exactly —
    # confirmed live, see header.
    wireguard_interfaces:
      - {name: "vpn", ifname: "wg0"}
      - {name: "vpn_443", ifname: "wg1"}

  tasks:
    - name: "{{ item_host }} — resolve the Zabbix host id"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output: ["hostid", "host"]
            filter: {host: ["{{ item_host }}"]}
          id: 1
      register: host_lookup
      check_mode: false
      no_log: true
      failed_when: >-
        host_lookup.json.error is defined
        or (host_lookup.json.result | default([]) | length) != 1

    - name: "{{ item_host }} — set the host id"
      ansible.builtin.set_fact:
        item_hostid: "{{ host_lookup.json.result[0].hostid }}"

    # ------------------------------------------------------------- OpenVPN

    - name: "{{ item_host }} — look for the existing OpenVPN status item"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ item_hostid }}"]
            search: {key_: "{{ openvpn_item_key }}"}
          id: 1
      register: openvpn_item_lookup
      check_mode: false
      no_log: true
      failed_when: openvpn_item_lookup.json.error is defined

    - name: "{{ item_host }} — create the OpenVPN status item"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            hostid: "{{ item_hostid }}"
            name: "{{ openvpn_item_name }}"
            key_: "{{ openvpn_item_key }}"
            type: 19       # HTTP agent — polled by the Zabbix server itself
            value_type: 1  # character (short text: "connected"/"reconnecting"/etc.)
            delay: "1m"
            url: "{{ opnsense_api_base }}/openvpn/service/search_sessions"
            authtype: 1    # basic auth
            username: "{{ opnsense_zabbix_api_key }}"
            password: "{{ opnsense_zabbix_api_secret }}"
            preprocessing:
              - type: 12   # JSONPath
                params: "$.rows[0].status"
                error_handler: 0
            description: >-
              Polls the OPNsense API directly (no agent involved) for the
              NordVPN OpenVPN client's session status. Expected value when
              healthy: "connected".
          id: 1
      register: openvpn_item_create
      when: (openvpn_item_lookup.json.result | default([]) | length) == 0
      no_log: true
      changed_when: openvpn_item_create.json.result is defined
      failed_when: openvpn_item_create.json.error is defined

    - name: "{{ item_host }} — look for the existing OpenVPN trigger"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.get
          params:
            output: ["triggerid", "description"]
            host: "{{ item_host }}"
          id: 1
      register: trigger_lookup
      check_mode: false
      no_log: true
      failed_when: trigger_lookup.json.error is defined

    - name: "{{ item_host }} — create the OpenVPN trigger"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.create
          params:
            description: "{{ openvpn_trigger_description }}"
            # Three consecutive polls (three minutes at 1m delay) not equal
            # to "connected" — tolerates one transient "reconnecting" blip,
            # same #3 debounce as the WAN gateway and MetalLB VIP triggers.
            expression: 'count(/{{ item_host }}/{{ openvpn_item_key }},#3,"ne","connected")=3'
            priority: 3     # Average
            manual_close: 0
            tags:
              - {tag: "component", value: "opnsense"}
              - {tag: "target", value: "openvpn"}
          id: 1
      register: openvpn_trigger_create
      when: >-
        (trigger_lookup.json.result
         | selectattr('description', 'eq', openvpn_trigger_description)
         | list | length) == 0
      no_log: true
      changed_when: openvpn_trigger_create.json.result is defined
      failed_when: openvpn_trigger_create.json.error is defined

    # ------------------------------------------------------------ WireGuard

    - name: "{{ item_host }} — look for existing WireGuard status items"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ item_hostid }}"]
            search: {key_: "wireguard.status["}
          id: 1
      register: wireguard_item_lookup
      check_mode: false
      no_log: true
      failed_when: wireguard_item_lookup.json.error is defined

    - name: "{{ item_host }} — create missing WireGuard status items"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            hostid: "{{ item_hostid }}"
            name: "WireGuard server ({{ item.name }} / {{ item.ifname }}) status"
            key_: "wireguard.status[{{ item.name }}]"
            type: 19       # HTTP agent — polled by the Zabbix server itself
            value_type: 1  # character ("up"/"down")
            delay: "1m"
            url: "{{ opnsense_api_base }}/wireguard/service/show"
            authtype: 1    # basic auth
            username: "{{ opnsense_zabbix_api_key }}"
            password: "{{ opnsense_zabbix_api_secret }}"
            preprocessing:
              - type: 12   # JSONPath
                params: "$.rows[?(@.name == '{{ item.name }}' && @.type == 'interface')].status.first()"
                error_handler: 0
            description: >-
              Polls the OPNsense API directly (no agent involved) for the
              {{ item.ifname }} WireGuard interface's own up/down status —
              not individual peer connection state, which reads "offline"
              whenever no remote client happens to be connected (the normal
              idle state for this VPN, not a fault).
          id: 1
      register: wireguard_item_create
      loop: "{{ wireguard_interfaces }}"
      loop_control: {label: "{{ item.name }}"}
      when: >-
        ('wireguard.status[' ~ item.name ~ ']')
        not in (wireguard_item_lookup.json.result | default([]) | map(attribute='key_') | list)
      no_log: true
      changed_when: wireguard_item_create.json.result is defined
      failed_when: wireguard_item_create.json.error is defined

    - name: "{{ item_host }} — create missing WireGuard triggers"
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.create
          params:
            description: "WireGuard server ({{ item.name }} / {{ item.ifname }}) is down"
            # Three consecutive polls not "up" — same #3 debounce as every
            # other trigger in this play.
            expression: 'count(/{{ item_host }}/wireguard.status[{{ item.name }}],#3,"ne","up")=3'
            priority: 3     # Average
            manual_close: 0
            tags:
              - {tag: "component", value: "opnsense"}
              - {tag: "target", value: "wireguard"}
          id: 1
      register: wireguard_trigger_create
      loop: "{{ wireguard_interfaces }}"
      loop_control: {label: "{{ item.name }}"}
      when: >-
        ("WireGuard server (" ~ item.name ~ " / " ~ item.ifname ~ ") is down")
        not in (trigger_lookup.json.result | default([]) | map(attribute='description') | list)
      no_log: true
      changed_when: wireguard_trigger_create.json.result is defined
      failed_when: wireguard_trigger_create.json.error is defined

    - name: "TEMP DIAGNOSTIC — what actually matched"
      ansible.builtin.debug:
        msg:
          openvpn_items_found: "{{ openvpn_item_lookup.json.result }}"
          wireguard_items_found: "{{ wireguard_item_lookup.json.result }}"
          all_triggers_on_host: "{{ trigger_lookup.json.result }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ item_host }}: OpenVPN item {{ openvpn_item_key }}
          {{ 'created' if (openvpn_item_create.changed | default(false)) else 'already present' }},
          trigger "{{ openvpn_trigger_description }}"
          {{ 'created' if (openvpn_trigger_create.changed | default(false)) else 'already present' }}.
          WireGuard items created: {{ wireguard_item_create.results | default([]) | rejectattr('skipped', 'defined') | list | length }}
          of {{ wireguard_interfaces | length }}.
          WireGuard triggers created: {{ wireguard_trigger_create.results | default([]) | rejectattr('skipped', 'defined') | list | length }}
          of {{ wireguard_interfaces | length }}.
