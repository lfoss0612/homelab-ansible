---
# Deploy kernel OOM-kill monitoring to the hosts most exposed to memory
# overcommit: the hypervisors, plus pbs since it runs the same style of
# always-on workload.
#
# Usage:
#   ansible-playbook playbooks/oom-kill-monitor.yml --check --diff
#   ansible-playbook playbooks/oom-kill-monitor.yml
#
# The script runs every 5 minutes and reports to Zabbix via zabbix_sender. The
# server-side objects it feeds are created separately by
# playbooks/oom-kill-monitor-zabbix-setup.yml — run that one too, or every
# value this pushes is accepted by the server and silently discarded (the
# same two-halves trap docs/smart-monitoring.md already documents).
#
# Targets [oom_monitored], NOT [smart_monitored] — the two currently have
# identical membership (pbs/pve/pve-ai/pve-router) but are different
# questions: one is "does this host have a physical disk", the other is "is
# this host exposed to memory overcommit". They are expected to diverge —
# the VMs most likely to grow into this are k8s-worker and k8s-worker-2,
# neither of which has anything to do with SMART.
#
# Surfaced 2026-08-27: the kernel OOM-killer killed VM 105 (k8s-worker) on
# pve.home.lan on 2026-08-24 20:00:07, and nothing alerted before, during, or
# after. See scripts/oom-kill-monitor.sh for the full incident detail.
#
# zabbix_sender install added 2026-09-27 for the three RKE2 VMs added to
# [oom_monitored] that day: unlike the original four hosts, none of them
# carry a host-level Zabbix agent at all (they're monitored via the
# in-cluster zabbix-agent DaemonSet instead), so zabbix_sender was missing
# outright rather than merely out of date. It's a plain Ubuntu-archive
# package, no Zabbix repo needed (verified live: `apt-cache policy
# zabbix-sender` resolves it from the default `noble` archives on all
# three). The dependency check right after stays as a safety net rather
# than being removed now that install is unconditional — it catches a
# future host where the package name differs or apt itself fails, instead
# of the monitor silently never reporting.
#
# oom_zabbix_server (host_vars-overridable, defaults to the direct server
# 10.0.5.9) exists because of a real, previously-undiagnosed failure found
# 2026-09-27: k8s-master is monitored via a Zabbix PROXY ("rke2-proxy"),
# not directly by the server, while k8s-worker/k8s-worker-2 are not. Zabbix
# refuses trapper data sent directly to the server for a proxy-monitored
# host outright - "cannot process item ... trap: host is monitored by a
# proxy or proxy group" (found in zabbix_server.log; the client-side
# zabbix_sender/API surface gives no hint why, just a generic "discarded").
# host_vars/k8s-master.home.lan.yml sets this to the proxy pod's in-cluster
# ClusterIP (zabbix-proxy-agent-zabbix-helm-chrt-proxy service, port
# 10051) instead - reachable from the host network via kube-proxy, same as
# any other Service. Any FUTURE host added to [oom_monitored] needs the
# same check (`monitored_by`/`proxyid` via the Zabbix API) before assuming
# the plain server address will work.

- name: Deploy OOM-kill monitoring
  hosts: oom_monitored
  become: true

  handlers:
    - name: systemd_daemon_reload
      ansible.builtin.systemd_service:
        daemon_reload: true

  tasks:
    - name: Ensure zabbix_sender is installed
      ansible.builtin.apt:
        name: zabbix-sender
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Same fix as smart-monitor.yml needed: `command -v` is a shell builtin,
    # so it has to run under `shell`, not `command` (which executes the binary
    # directly with no shell and can never find a builtin).
    - name: Check for the tools the monitor depends on
      ansible.builtin.shell: "command -v {{ item }}"
      loop:
        - journalctl
        - zabbix_sender
      register: oom_tooling
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Fail loudly when a dependency is missing
      ansible.builtin.assert:
        that: oom_tooling.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Missing on {{ inventory_hostname }}:
          {{ oom_tooling.results | selectattr('rc', 'ne', 0)
             | map(attribute='item') | join(', ') }}.
          journalctl ships with systemd; zabbix_sender needs the
          zabbix-sender package.

    - name: Install the monitoring script, timer and service
      ansible.builtin.include_tasks: tasks/oom-kill-monitor-setup.yml

    - name: Run an initial OOM-kill check
      ansible.builtin.command: /usr/local/bin/oom-kill-monitor
      register: oom_check_result
      changed_when: false
      # Finding a past OOM-kill is a normal, expected report, not a monitor
      # failure — the script itself only exits non-zero when it could not
      # report at all (see its own exit-status comment).
      failed_when: oom_check_result.rc != 0

    - name: Show the initial result
      ansible.builtin.debug:
        msg: "{{ oom_check_result.stderr_lines | default([]) }}"
