---
# Rotate the MySQL password for the zabbix@localhost DB user on
# zabbix.home.lan, and update zabbix_server.conf's DBPassword to match.
#
# WHY: the current password was accidentally echoed in full into a Claude
# session transcript on 2026-08-29 (a broad `grep -i password` matched the
# whole DBPassword= line instead of just confirming its format) -- see
# homelab-vault TODO.md. This host also has real prior form for a MySQL-
# related outage (homelab-vault Incidents/2026-07-29-zabbix-hung-shutdown-
# mysql-outage.md), so this play is written with the same caution as
# zabbix-server-upgrade.yml: back up what's needed to undo the change
# before touching anything live, and verify the service actually comes
# back healthy rather than trusting the individual steps succeeded.
#
# SEQUENCE (order matters -- doing the file before the DB breaks the
# connection): generate a new password -> back up the OLD password to a
# root-only file (the undo path if anything below goes wrong) -> ALTER
# USER on the MySQL side -> stop zabbix-server -> update DBPassword= in
# zabbix_server.conf -> start zabbix-server -> confirm it reconnected
# (service stays active, no DB-auth-failure marker in the new log lines,
# API responds).
#
# CREDENTIAL HANDLING: the new password is generated on the CONTROL NODE
# via the `password` lookup (chars restricted to ascii_letters,digits --
# deliberately no quotes/backslashes, so it never needs SQL escaping) and
# never written to disk there (lookup path is /dev/null, which the
# lookup plugin treats as "don't persist, just generate"). Every task that
# touches the password value carries no_log: true. The ALTER USER statement
# is piped into `mysql` over stdin rather than passed as a -e argument, so
# it never appears in `ps aux` output on the remote host either. The OLD
# password is still never stored in this repo, matching zabbix_server.conf's
# DBPassword itself, which has never been vaulted here.
#
# The NEW password IS captured for the vault: once rotation is verified
# healthy, this play encrypts it with `ansible-vault encrypt_string`
# (delegated to localhost -- cockpit, which holds the vault password file --
# piped via stdin with --stdin-name, same no-CLI-arg reasoning as the ALTER
# USER step) and prints the resulting ciphertext block in the final report.
# Ciphertext is safe to display/log. This play does NOT write into the git
# checkout itself -- cockpit has no push credentials (see repo CLAUDE.md), so
# host_vars/zabbix.home.lan.yml has to be updated, committed and pushed from
# a checkout that can push, then synced back to cockpit. Paste the printed
# block in as `zabbix_db_password`.
#
# ROLLBACK if this fails partway: the OLD password is saved at
# {{ backup_dir }}/mysql-password-backup-<timestamp>.txt (root:root, 0600)
# on zabbix.home.lan before anything is changed. Restore with:
#   mysql -e "ALTER USER 'zabbix'@'localhost' IDENTIFIED BY '<contents of that file>';"
#   (revert DBPassword= in zabbix_server.conf to match, then start zabbix-server)
#
# Usage:
#   ansible-playbook playbooks/rotate-zabbix-mysql-password.yml --check --diff
#   ansible-playbook playbooks/rotate-zabbix-mysql-password.yml

- name: Rotate the Zabbix MySQL user's password
  hosts: zabbix.home.lan
  become: true
  remote_user: ansible

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_server_conf_path: /etc/zabbix/zabbix_server.conf
    backup_dir: /var/backups/zabbix
    # Matches ansible.cfg's vault_password_file on the control node (cockpit).
    vault_password_file: /etc/ansible-vault-password

  tasks:
    - name: Confirm the server is healthy before touching anything
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: apiinfo.version
          params: {}
          id: 1
      register: pre_check
      delegate_to: localhost
      check_mode: false
      failed_when: pre_check.json.error is defined

    - name: Read the DB user from zabbix_server.conf (not secret, just the username)
      ansible.builtin.command: grep -E '^\s*DBUser=' {{ zabbix_server_conf_path }}
      register: db_user_line
      changed_when: false
      check_mode: false

    - name: Set the DB user fact
      ansible.builtin.set_fact:
        zabbix_db_user: "{{ db_user_line.stdout.split('=')[1] }}"

    - name: Read the CURRENT password, to back it up before changing anything
      ansible.builtin.command: grep -E '^\s*DBPassword=' {{ zabbix_server_conf_path }}
      register: old_password_line
      changed_when: false
      check_mode: false
      no_log: true

    - name: Generate a new password (control-node side, never persisted there)
      ansible.builtin.set_fact:
        zabbix_new_db_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}"
      no_log: true

    - name: Ensure the backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Back up the OLD password to a root-only file (the undo path)
      ansible.builtin.copy:
        content: "{{ old_password_line.stdout.split('=', 1)[1] }}\n"
        dest: "{{ backup_dir }}/mysql-password-backup-{{ ansible_date_time.iso8601_basic_short }}.txt"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: backup_result

    - name: Confirm the backup file was actually written
      ansible.builtin.assert:
        that:
          - backup_result is not failed
        fail_msg: >-
          Failed to write the old-password backup file -- refusing to
          proceed without an undo path in hand.

    - name: Change the password on the MySQL side (piped via stdin, never a -e argument, so it never appears in `ps`)
      ansible.builtin.shell: |
        set -o pipefail
        mysql <<'SQL_EOF'
        ALTER USER '{{ zabbix_db_user }}'@'localhost' IDENTIFIED BY '{{ zabbix_new_db_password }}';
        FLUSH PRIVILEGES;
        SQL_EOF
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Stop zabbix-server before changing the file it reads its DB password from
      ansible.builtin.systemd_service:
        name: zabbix-server
        state: stopped

    - name: Note the server log's current size, to only look at what this run adds
      ansible.builtin.stat:
        path: /var/log/zabbix/zabbix_server.log
      register: log_before

    - name: Update DBPassword= in zabbix_server.conf to match
      ansible.builtin.lineinfile:
        path: "{{ zabbix_server_conf_path }}"
        regexp: "^#?\\s*DBPassword=.*"
        line: "DBPassword={{ zabbix_new_db_password }}"
        state: present
      no_log: true

    - name: Start zabbix-server with the new password
      ansible.builtin.systemd_service:
        name: zabbix-server
        state: started
        enabled: true

    - name: Confirm the service stays active (a bad password fails fast, but give it real room)
      ansible.builtin.systemd_service:
        name: zabbix-server
      register: server_status
      until: server_status.status.ActiveState == 'active'
      retries: 6
      delay: 5

    - name: Read what this run wrote to the server log
      ansible.builtin.shell: >-
        set -o pipefail
        tail -c +{{ log_before.stat.size + 1 }} /var/log/zabbix/zabbix_server.log
      args:
        executable: /bin/bash
      register: new_log
      changed_when: false
      check_mode: false

    - name: Fail loudly if the new log lines show a DB auth failure
      ansible.builtin.assert:
        that:
          - new_log.stdout is not search('(?i)access denied for user')
          - new_log.stdout is not search('(?i)cannot connect to the database')
        fail_msg: >-
          zabbix_server.log shows a DB connection problem on
          {{ inventory_hostname }} after the password rotation:
          {{ new_log.stdout }}
          The OLD password is backed up at {{ backup_result.dest }} -- see
          this playbook's header comment for the manual rollback command.
        success_msg: "No DB-auth-failure markers in the new log output."

    - name: Confirm the API responds post-rotation
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: apiinfo.version
          params: {}
          id: 1
      register: post_check
      delegate_to: localhost
      check_mode: false
      until: post_check.json is defined and post_check.json.result is defined
      retries: 6
      delay: 5
      failed_when: post_check.json is not defined or post_check.json.result is not defined

    - name: Encrypt the new password for the repo's vault (ciphertext only -- alnum-only password needs no escaping)
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' '{{ zabbix_new_db_password }}' | ansible-vault encrypt_string --vault-password-file {{ vault_password_file }} --stdin-name 'zabbix_db_password'
      args:
        executable: /bin/bash
      delegate_to: localhost
      register: vaulted_db_password
      changed_when: false
      check_mode: false

    - name: Report
      ansible.builtin.debug:
        msg: >-
          MySQL password rotated for {{ zabbix_db_user }}@localhost.
          zabbix-server stayed active through the restart, no DB-auth-failure
          markers in the new log lines, API confirmed responding
          (version {{ post_check.json.result }}). Old password backed up at
          {{ backup_result.dest }} (root:root, 0600) -- keep that until
          you're confident this rotation is good, then delete it by hand;
          it is not managed by this repo and won't be cleaned up
          automatically.

    - name: Show the vault-ready block for the new password
      ansible.builtin.debug:
        msg: >-
          {{ '(This was a --check run: the MySQL/conf steps above did not
          actually run, so this ciphertext is only a preview -- do not paste
          it into the vault. Re-run for real first.) ' if ansible_check_mode
          else '' }}Paste this into
          homelab-ansible/host_vars/zabbix.home.lan.yml (replacing any
          existing zabbix_db_password block), then commit and push from a
          checkout with push access, and re-sync cockpit's checkout -- this
          play does not write to the git repo itself:
          {{ vaulted_db_password.stdout }}
