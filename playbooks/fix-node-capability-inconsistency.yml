---
# Fix the node capability approval inconsistency.
# pdm.home.lan has system.execApprovals.get/set approved, but omv/pve/zabbix don't.
# This playbook approves the missing capabilities on those three nodes.
#
# Run with: ansible-playbook playbooks/fix-node-capability-inconsistency.yml -e confirm=true

- name: Approve missing system.execApprovals capabilities on nodes
  hosts: openclaw_gateway
  gather_facts: false
  become: true

  vars:
    confirm: false
    target_nodes:
      - omv.home.lan
      - pve.home.lan
      - zabbix.home.lan
    target_capabilities:
      - system.execApprovals.get
      - system.execApprovals.set

  environment:
    OPENCLAW_GATEWAY_AUTH_TOKEN: "{{ openclaw_gateway_token }}"

  tasks:
    - name: Query node status from the gateway
      ansible.builtin.command: openclaw nodes status --json
      become_user: "{{ openclaw_user }}"
      register: openclaw_nodes_status_raw
      changed_when: false

    - name: Parse node status
      ansible.builtin.set_fact:
        openclaw_nodes_status: "{{ (openclaw_nodes_status_raw.stdout | from_json).nodes }}"

    - name: Build node ID map
      ansible.builtin.set_fact:
        node_ids: "{{ node_ids | default({}) | combine({item.displayName: item.id}) }}"
      loop: "{{ openclaw_nodes_status }}"
      when: item.displayName in target_nodes and item.id is defined

    - name: Display current capability state
      ansible.builtin.debug:
        msg: |
          Node: {{ item.displayName }}
          ID: {{ item.id }}
          Current caps: {{ item.caps | default([]) | join(', ') }}
          Missing: {{ target_capabilities | difference(item.caps | default([])) | join(', ') }}
      loop: "{{ openclaw_nodes_status | selectattr('displayName', 'in', target_nodes) }}"
      loop_control:
        label: "{{ item.displayName }}"

    - name: Fail if not confirmed
      ansible.builtin.fail:
        msg: "Dry-run only. Pass -e confirm=true to actually approve capabilities."
      when: not (confirm | bool)

    - name: Display node IDs for manual approval
      ansible.builtin.debug:
        msg: |
          Node ID mapping:
          {% for name, node_id in node_ids.items() %}
          {{ name }}: {{ node_id }}
          {% endfor %}

          To approve capabilities, run on the gateway:
          {% for name in target_nodes %}
          {% if name in node_ids %}
          openclaw nodes approve-capability {{ node_ids[name] }} system.execApprovals.get
          openclaw nodes approve-capability {{ node_ids[name] }} system.execApprovals.set
          {% endif %}
          {% endfor %}

    - name: Manual approval notice
      ansible.builtin.debug:
        msg: "MANUAL STEP: Execute the commands shown above on the gateway to approve the capabilities. The exact command syntax should be verified with 'openclaw --help'."

    - name: Query final state
      ansible.builtin.command: openclaw nodes status --json
      become_user: "{{ openclaw_user }}"
      register: final_state_raw
      changed_when: false

    - name: Display final capability state
      ansible.builtin.set_fact:
        final_state: "{{ (final_state_raw.stdout | from_json).nodes }}"

    - name: Verify capabilities were approved
      ansible.builtin.debug:
        msg: |
          Node: {{ item.displayName }}
          Final caps: {{ item.caps | default([]) | join(', ') }}
      loop: "{{ final_state | selectattr('displayName', 'in', target_nodes) }}"
      loop_control:
        label: "{{ item.displayName }}"
