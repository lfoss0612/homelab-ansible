---
# Alerting for the MetalLB LoadBalancer VIPs.
#
# WHAT WAS ACTUALLY MISSING: triggers. k8s-master.home.lan has carried one
# icmpping[<ip>] item per VIP since 2026-08-29, named "<namespace>/<service>
# (<ip>)", and all 12 are wired into the Network page of dashboard 403 as item
# widgets. They collect fine. What none of them had was a trigger, so a VIP
# going down produced no Problem and no notification. This play adds exactly
# that, on the items that already exist.
#
# WHY NOT A DISCOVERY ACTION, which the vault TODO originally proposed:
#
#  1. Discovery events can never become Problems. problem.get rejects source 1
#     with 'value must be one of 0, 3, 4' (trigger, internal, service). An
#     action can at best send a notification - never a Problem, a severity or
#     an acknowledgement.
#  2. The discovery pipeline here creates hosts that monitor nothing: the 96
#     hosts "Auto-add Lan Devices" has made on 10.0.2.x carry zero templates and
#     zero items, because its Generic by SNMP link fails.
#  3. action.create is refused to the automation token anyway.
#
# Also drule 7 polls hourly; these items are on 1m.
#
# ---------------------------------------------------------------------------
# REMEDIATION SECTION AT THE BOTTOM - READ BEFORE EDITING
#
# An earlier version of this play created a separate "metallb-vips" host with
# its own 11 icmpping items and 11 triggers, duplicating the k8s-master items
# above. That was a mistake: it was written from the "Not done" sentence part
# way through the vault's MetalLB entry without reading the paragraph directly
# below it, which records those items being added.
#
# The duplicates cannot be removed - host.delete, item.delete and
# trigger.delete are ALL refused to this token. So the play parks them instead:
# it disables the metallb-vips items, triggers and host, and keeps them
# disabled on every run. Disabled is the terminal state here, per the standing
# policy in the vault TODO. They are listed in that TODO's (VERY LOW) deletion
# sweep.
#
# Do not "clean up" by deleting the remediation section - without it a re-run
# would leave the duplicates enabled and double-polling.
# ---------------------------------------------------------------------------
#
# 10.2.6.0 GETS A TRIGGER, CREATED DISABLED. It is the network address of the
# /24 and does not answer ICMP - confirmed from the Zabbix server with ping and
# fping, which is why discovery has always found 11 of 12 VIPs. Note the item
# itself works: an icmpping item returning 0 is a valid value, not an
# unsupported item, so this is "always reads down", not "cannot be monitored".
# An enabled trigger would therefore sit in a permanent PROBLEM state, which is
# exactly the alert noise this whole section is trying to remove. It is created
# disabled so it is one click from useful if comfyui/comfyui is ever moved off
# a .0 address - which is worth doing on its own merits, since plenty of
# clients refuse to talk to a .0 host address.
#
# Usage:
#   ansible-playbook playbooks/zabbix-metallb-vip-monitoring.yml --check --diff
#   ansible-playbook playbooks/zabbix-metallb-vip-monitoring.yml

- name: Alert on MetalLB LoadBalancer VIP reachability
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "c4bceeafe968e48fd74a68fda821867cee967eb19a4cea615b2e47f1215ad939"

    vip_item_host: "k8s-master.home.lan"    # where the icmpping items live
    k8s_control_node: "k8s-master.home.lan"
    parked_host: "metallb-vips"             # the duplicate; see remediation note

    # trigger_enabled: false means the trigger is created but left disabled.
    metallb_vips:
      - {ip: "10.2.6.0",   svc: "comfyui/comfyui",                                trigger_enabled: false}
      - {ip: "10.2.6.1",   svc: "litellm/litellm",                                trigger_enabled: true}
      - {ip: "10.2.6.2",   svc: "open-webui/open-webui",                          trigger_enabled: true}
      - {ip: "10.2.6.3",   svc: "yugabytedb/pgadmin-pgadmin4",                    trigger_enabled: true}
      - {ip: "10.2.6.4",   svc: "yugabytedb/yb-master-ui",                        trigger_enabled: true}
      - {ip: "10.2.6.5",   svc: "yugabytedb/yugabyted-ui-service",                trigger_enabled: true}
      - {ip: "10.2.6.6",   svc: "yugabytedb/yb-tserver-service",                  trigger_enabled: true}
      - {ip: "10.2.6.10",  svc: "cattle-monitoring-system/rancher-monitoring-grafana", trigger_enabled: true}
      - {ip: "10.2.6.100", svc: "postgrest/postgrest",                            trigger_enabled: true}
      - {ip: "10.2.6.102", svc: "argocd/argocd-server",                           trigger_enabled: true}
      - {ip: "10.2.6.103", svc: "open-webui/ollama",                              trigger_enabled: true}
      - {ip: "10.2.6.105", svc: "langflow/langflow-service",                      trigger_enabled: true}

  tasks:
    # ------------------------------------------------------------ drift check
    - name: Read the live LoadBalancer VIPs from the cluster
      ansible.builtin.shell:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl get svc -A
          -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.status.loadBalancer.ingress[0].ip}{" "}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}'
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/rke2/rke2.yaml
      delegate_to: "{{ k8s_control_node }}"
      become: true
      register: live_vips
      changed_when: false
      check_mode: false

    - name: Compare the declared VIPs against the cluster
      vars:
        live: "{{ live_vips.stdout_lines | map('trim') | reject('eq', '') | sort | list }}"
        declared: >-
          {{ metallb_vips | map(attribute='ip') | zip(metallb_vips | map(attribute='svc'))
             | map('join', ' ') | sort | list }}
      ansible.builtin.assert:
        that:
          - live == declared
        fail_msg: |-
          The MetalLB VIPs in this playbook no longer match the cluster.
          Update metallb_vips and re-run - do not bypass this.
            only in cluster: {{ live | difference(declared) }}
            only in file:    {{ declared | difference(live) }}
        success_msg: "{{ declared | length }} VIPs declared and all match the live cluster."

    # ------------------------------------------------- triggers on the items
    - name: Resolve the existing icmpping items
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            output: ["itemid", "key_"]
            host: "{{ vip_item_host }}"
            search: {key_: "icmpping["}
          id: 1
      register: vip_items
      check_mode: false
      failed_when: vip_items.json.error is defined

    - name: Every declared VIP must already have an item
      vars:
        have: "{{ vip_items.json.result | map(attribute='key_') | list }}"
        want: "{{ metallb_vips | map(attribute='ip') | map('regex_replace', '^(.*)$', 'icmpping[\\1]') | list }}"
      ansible.builtin.assert:
        that:
          - want | difference(have) | length == 0
        fail_msg: >-
          Missing icmpping items on {{ vip_item_host }}: {{ want | difference(have) }}.
          This play adds triggers to existing items; it does not create items.
        success_msg: "All {{ want | length }} icmpping items present on {{ vip_item_host }}."

    - name: List existing triggers on the item host
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.get
          params:
            output: ["triggerid", "description"]
            host: "{{ vip_item_host }}"
          id: 1
      register: existing_triggers
      check_mode: false
      failed_when: existing_triggers.json.error is defined

    - name: Create the missing VIP triggers
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.create
          params:
            description: "{{ item.svc }} ({{ item.ip }}): MetalLB VIP unreachable by ICMP"
            # three consecutive failures, so one dropped ping is not an alert
            expression: "max(/{{ vip_item_host }}/icmpping[{{ item.ip }}],#3)=0"
            priority: 3
            status: "{{ 0 if item.trigger_enabled else 1 }}"
            manual_close: 0
            tags:
              - {tag: "component", value: "metallb"}
              - {tag: "service", value: "{{ item.svc }}"}
          id: 1
      register: trig_create
      loop: "{{ metallb_vips }}"
      loop_control:
        label: "{{ item.svc }} ({{ item.ip }}){{ ' [created disabled]' if not item.trigger_enabled else '' }}"
      when: >-
        (existing_triggers.json.result
         | selectattr('description', 'eq',
             item.svc ~ ' (' ~ item.ip ~ '): MetalLB VIP unreachable by ICMP')
         | list | length) == 0
      failed_when: trig_create.json.error is defined
      changed_when: trig_create.json.result is defined

    # -------------------------------------------------------- remediation
    # Park the duplicate host created by an earlier version of this play. See
    # the header. Deletion is refused to this token, so disabled is terminal.
    - name: Find the parked duplicate host
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output: ["hostid", "host", "status"]
            filter: {host: ["{{ parked_host }}"]}
            selectItems: ["itemid", "status"]
            selectTriggers: ["triggerid", "status"]
          id: 1
      register: parked
      check_mode: false
      failed_when: parked.json.error is defined

    - name: Disable the duplicate items
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: item.update
          params: {itemid: "{{ item.itemid }}", status: 1}
          id: 1
      register: park_items
      loop: >-
        {{ (parked.json.result | first)['items'] | default([]) | selectattr('status', 'eq', '0') | list
           if (parked.json.result | length) > 0 else [] }}
      loop_control: {label: "item {{ item.itemid }}"}
      failed_when: park_items.json.error is defined
      changed_when: park_items.json.result is defined

    - name: Disable the duplicate triggers
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: trigger.update
          params: {triggerid: "{{ item.triggerid }}", status: 1}
          id: 1
      register: park_trigs
      loop: >-
        {{ (parked.json.result | first)['triggers'] | default([]) | selectattr('status', 'eq', '0') | list
           if (parked.json.result | length) > 0 else [] }}
      loop_control: {label: "trigger {{ item.triggerid }}"}
      failed_when: park_trigs.json.error is defined
      changed_when: park_trigs.json.result is defined

    - name: Disable the duplicate host
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
        body:
          jsonrpc: "2.0"
          method: host.update
          params: {hostid: "{{ (parked.json.result | first).hostid }}", status: 1}
          id: 1
      register: park_host
      when:
        - (parked.json.result | length) > 0
        - (parked.json.result | first).status == '0'
      failed_when: park_host.json.error is defined
      changed_when: park_host.json.result is defined

    - name: Report
      ansible.builtin.debug:
        msg: >-
          triggers created {{ trig_create.results | default([]) | rejectattr('skipped', 'defined') | list | length }}
          of {{ metallb_vips | length }} on {{ vip_item_host }}
          (10.2.6.0's is created disabled by design).
          Parked duplicates: items {{ park_items.results | default([]) | rejectattr('skipped', 'defined') | list | length }},
          triggers {{ park_trigs.results | default([]) | rejectattr('skipped', 'defined') | list | length }},
          host {{ 'disabled' if park_host.changed | default(false) else 'already disabled or absent' }}.
