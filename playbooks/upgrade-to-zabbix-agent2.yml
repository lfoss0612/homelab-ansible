---
# Upgrade from Zabbix Agent to Zabbix Agent 2
#
# The GPG key task MUST have `gpg --yes --batch` and `creates:`. Without
# them, gpg --dearmor prompts to overwrite when /etc/apt/trusted.gpg.d/
# zabbix.gpg already exists and hangs forever waiting on stdin that a
# non-interactive ansible shell task can never provide. Discovered
# 2026-08-23 after several `timeout N ssh cockpit '...ansible-playbook...'`
# invocations got killed locally on timeout without killing the REMOTE
# process (ssh doesn't propagate that without a pty) - each left behind an
# orphaned ansible-playbook run plus a hung gpg process, and seven of them
# ended up stacked up fighting over the same apt/dpkg locks across the
# fleet before anyone noticed.
#
# Usage:
#   ansible-playbook playbooks/upgrade-to-zabbix-agent2.yml --check --diff
#   ansible-playbook playbooks/upgrade-to-zabbix-agent2.yml

- name: Upgrade to Zabbix Agent 2
  hosts: all:!api_managed
  become: true

  vars:
    zabbix_server: "10.0.5.9"
    zabbix_server_port: "10051"

  handlers:
    - name: restart_zabbix_agent2
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        state: restarted
        enabled: true

  tasks:
    - name: Stop and disable zabbix-agent
      ansible.builtin.systemd_service:
        name: zabbix-agent
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove zabbix-agent package
      ansible.builtin.apt:
        name: zabbix-agent
        state: absent
        purge: true
      failed_when: false

    - name: Setup Zabbix official repository (Ubuntu only, Debian uses default repos)
      block:
        - name: Download and add Zabbix GPG key
          ansible.builtin.shell: curl -fsSL https://repo.zabbix.com/zabbix-official-repo.key | gpg --yes --batch --dearmor -o /etc/apt/trusted.gpg.d/zabbix.gpg
          args:
            creates: /etc/apt/trusted.gpg.d/zabbix.gpg
          changed_when: true

        - name: Add Zabbix official repository (use stable for noble support)
          ansible.builtin.shell: echo "deb https://repo.zabbix.com/zabbix/7.4/stable/ubuntu {{ ansible_distribution_release }} main" > /etc/apt/sources.list.d/zabbix.list
          changed_when: true
      when: ansible_distribution == 'Ubuntu'

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      changed_when: false

    - name: Install zabbix-agent2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present

    - name: Configure Zabbix Agent 2
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - regexp: "^# Server="
          line: "Server={{ zabbix_server_allowed_ips }}"
        - regexp: "^Server="
          line: "Server={{ zabbix_server_allowed_ips }}"
        - regexp: "^# Hostname="
          line: "Hostname={{ inventory_hostname }}"
        - regexp: "^Hostname="
          line: "Hostname={{ inventory_hostname }}"
        - regexp: "^# ServerActive="
          line: "ServerActive={{ zabbix_server }}:{{ zabbix_server_port }}"
        - regexp: "^ServerActive="
          line: "ServerActive={{ zabbix_server }}:{{ zabbix_server_port }}"
      notify: restart_zabbix_agent2
      vars:
        # zabbix.home.lan is monitored via a 127.0.0.1 interface in Zabbix
        # itself (self-monitoring convention), not its real IP like every
        # other host - the server therefore connects to its own agent from
        # 127.0.0.1, not 10.0.5.9, and needs both in the allow-list. Getting
        # this wrong shows as "ZBX_NOTSUPPORTED: ... dropped connection
        # because of access permissions" in zabbix_get, discovered
        # 2026-08-23 when zabbix.home.lan was the only host still red after
        # every other host's Server= fix took effect.
        zabbix_server_allowed_ips: "{{ zabbix_server + ',127.0.0.1' if inventory_hostname == 'zabbix.home.lan' else zabbix_server }}"

    - name: Enable and start Zabbix Agent 2
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        enabled: true
        state: started

    - name: Verify Zabbix Agent 2 is running
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        state: started
      register: zabbix_agent2_status

    - name: Show Zabbix Agent 2 status
      ansible.builtin.debug:
        msg: |
          Zabbix Agent 2 configured on {{ inventory_hostname }}
          Server: {{ zabbix_server }}
          Port: {{ zabbix_server_port }}
          Hostname: {{ inventory_hostname }}
          Status: {{ zabbix_agent2_status.status.ActiveState | default('unknown') }}
