---
# Ask Zabbix to poll items right now ("Execute now"), so a dashboard or an audit can be checked
# the same hour instead of waiting for the next hourly poll.
#
# Usage:
#   scripts/run-working-tree.sh playbooks/zabbix-execute-now.yml \
#       -e '{"zbx_hosts": ["desktop.home.lan", "vscode.home.lan"]}' -e zbx_key_prefix=os.update
#       lists the items it would poll and changes nothing (dry run is the wrapper default).
#   scripts/run-working-tree.sh --apply playbooks/zabbix-execute-now.yml -e '{"zbx_hosts": [...]}' ...
#       queues the polls (API task.create, type 6).
#
# zbx_hosts is a required list of Zabbix host names (the FQDNs). zbx_key_prefix narrows the items
# to those whose key starts with it; leave it out to poll every pollable item on the hosts, which
# can be hundreds on a Kubernetes node, so a prefix is the usual choice. Only item types that
# Zabbix allows for Execute now are polled (agent passive, simple, internal, external, HTTP and so
# on); trapper, active-agent and dependent items are skipped by Zabbix itself.
#
# It only queues the polls. Results arrive within a minute or so; re-run
# playbooks/zabbix-audit.yml afterwards. The token cannot do host.update-style changes here and
# does not need to.

- name: Queue "Execute now" for Zabbix items
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "{{ hostvars['zabbix.home.lan'].zabbix_api_token }}"
    zbx_key_prefix: ""
    # Item types that accept Execute now.
    zbx_pollable_types: [0, 3, 5, 10, 12, 13, 14, 15, 16, 17, 19, 21]
  tasks:
    - name: Check the request
      ansible.builtin.assert:
        that:
          - zbx_hosts is defined
          - zbx_hosts is sequence
          - zbx_hosts is not string
          - zbx_hosts | length > 0
        fail_msg: >-
          Give a list of Zabbix host names as JSON, for example
          -e '{"zbx_hosts": ["host.home.lan"]}'.

    - name: Queue the polls
      ansible.builtin.include_tasks: tasks/zabbix-execute-now.yml
