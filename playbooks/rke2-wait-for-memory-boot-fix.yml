---
# Fix a boot-timing bug found 2026-09-27: kubelet reads a node's memory
# Capacity once, very early in its own startup, and never refreshes it short
# of a restart. On these Proxmox VMs (memory ballooning, no hotplug), that
# early read can race whatever the guest's true available memory settles to
# a few seconds into boot, leaving kubelet permanently reporting a smaller
# Capacity than the node actually has.
#
# Confirmed live on k8s-master (VMID 103, memory: 16384/balloon: 12288):
# kubectl reported Capacity=12896880Ki (~12.3GiB) for over a day after boot,
# while the guest's own /proc/meminfo showed MemTotal=16304752kB (~15.9GiB)
# at the SAME moment. A plain `systemctl restart rke2-server` - no VM
# reboot, no config change - immediately fixed it: Capacity became
# 16304752Ki, exact match. See homelab-vault DONE.md, Kubernetes, for the
# full writeup and the live before/after numbers.
#
# This is NOT specific to k8s-master - any RKE2 node on a ballooned VM could
# hit the same race on any future boot. The fix: before rke2-server/
# rke2-agent starts, wait 90s and let memory settle before letting kubelet
# take its one-time reading.
#
# WHY A PLAIN DELAY, NOT A "WAIT FOR STABILITY" LOOP - tried that first and
# rejected it, tested live on k8s-worker, 2026-09-27:
#   v1 (3 reads/2s = 6s stable window, 60s timeout): ran and caught real
#   early boot-time change, but a fuller ~130s sample afterward showed the
#   real behavior is an overshoot-and-settle cycle (peak ~24.5GiB against a
#   24576MiB ceiling around 60-90s post-boot, settling into a ~200MB band by
#   ~130s) - not a one-time ramp a 6s window can reliably catch. v1's result
#   landed in the right range by luck of timing, not because 6s was enough.
#   v2 (5 reads/3s = 15s stable window, 180s timeout): widened deliberately
#   to ride out that cycle - and hit the full 180s timeout on every boot
#   tested. Real conclusion: `pve` itself is memory-tight overall (a
#   separate, already-known condition - see host_vars/pve.home.lan.yml's
#   ballooning notes), and its balloon management here jitters continuously
#   rather than settling to a fixed value. There is no stability point to
#   wait for, so "wait for N identical reads" would warn-and-fall-back on
#   every single boot forever - functionally a fixed delay already, just
#   dressed up as a failure each time.
#   v2's timeout-fallback capture (24434048Ki) still landed within ~100MB of
#   the true value moments later, i.e. inside the same ~1.5%-of-total jitter
#   band v1 also landed in - a plain, later, single read gets the same
#   practical result as the stability loop did, without the always-fires
#   false-warning behavior. 90s was chosen because the worst early-boot
#   swings observed in testing had passed by 60-90s.
#
# Some residual noise (order of ~1-1.5% of total node memory) is expected to
# remain permanently in whatever kubelet captures, since ballooning here is
# genuinely ongoing on this host, not a one-time settle. This narrows
# kubelet's one-time snapshot into that small noise band - vastly better
# than the original bug's fixed, arbitrary, ~23%-of-total permanent gap on
# k8s-master - but does not and cannot eliminate the gap altogether short of
# Kubernetes supporting a live-refreshed node Capacity, which it doesn't.
#
# Usage:
#   ansible-playbook playbooks/rke2-wait-for-memory-boot-fix.yml --check --diff
#   ansible-playbook playbooks/rke2-wait-for-memory-boot-fix.yml
#
# Verification requires an actual reboot per host (the bug only manifests at
# boot) - not done by this playbook. After applying, reboot one node at a
# time and confirm `kubectl describe node <name>`'s Capacity is close to
# `free -h`'s Total on that host, without needing a follow-up service
# restart.

- name: Install a fixed boot delay before rke2 starts, to let memory settle
  hosts: k8s
  become: true

  vars:
    rke2_service: "{{ 'rke2-server' if 'k8s_master' in group_names else 'rke2-agent' }}"
    wait_script_path: /usr/local/sbin/rke2-wait-for-memory.sh
    boot_delay_seconds: 90

  tasks:
    - name: Install the boot-delay script
      ansible.builtin.copy:
        dest: "{{ wait_script_path }}"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/sh
          # Fixed delay before rke2 starts, letting this host's ongoing
          # memory ballooning pass its worst early-boot swings before
          # kubelet takes its one-time Capacity reading. See
          # homelab-ansible playbooks/rke2-wait-for-memory-boot-fix.yml for
          # why this is a plain delay and not a "wait for stability" loop
          # (tried and rejected - this host's memory jitters continuously,
          # there is no stability point to detect).
          echo "rke2-wait-for-memory: sleeping {{ boot_delay_seconds }}s before rke2 starts (MemTotal now: $(awk '/^MemTotal:/{print $2}' /proc/meminfo)kB)"
          sleep {{ boot_delay_seconds }}
          echo "rke2-wait-for-memory: done sleeping (MemTotal now: $(awk '/^MemTotal:/{print $2}' /proc/meminfo)kB), proceeding"
      register: wait_script

    - name: Create the systemd drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ rke2_service }}.service.d"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Install the ExecStartPre drop-in
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ rke2_service }}.service.d/wait-for-memory.conf"
        mode: "0644"
        owner: root
        group: root
        content: |
          # Installed by playbooks/rke2-wait-for-memory-boot-fix.yml.
          # Fixed delay before rke2 starts, so kubelet's one-time node
          # Capacity read doesn't land in the middle of this host's
          # early-boot memory settling. See that playbook's header for the
          # full story, including why this is a plain delay rather than a
          # "wait for stability" check.
          [Service]
          ExecStartPre={{ wait_script_path }}
      register: dropin

    - name: Reload systemd if the drop-in or script changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: dropin.changed or wait_script.changed

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ rke2_service }} on {{ inventory_hostname }} now waits
          {{ boot_delay_seconds }}s before starting. Takes effect on the
          NEXT boot of this host - not applied by a service restart, since
          the bug is a boot-time race, not an ongoing condition. Verify
          after an actual reboot: `kubectl describe node {{ inventory_hostname }}`'s
          Capacity should be close to `free -h`'s Total on that host.
