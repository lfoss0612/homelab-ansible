---
# Post-migration validation for the OpenClaw fleet.
#
# The old "gateway is not a node" assertion is gone by decision, not by
# accident — the gateway is deliberately a node now (it manages its own VM),
# so this file instead asserts it runs BOTH services.
#
# pve-router is report-only: it is deliberately unmanaged, so it is never a
# member of openclaw/openclaw_nodes and this playbook never asserts against
# it or targets it for change — the last play below only reads and prints
# its state, for visibility that it hasn't silently dropped off.
#
# [openclaw_optional] hosts are managed, but are legitimately powered off part
# of the time. They are asserted against exactly like any other node WHEN they
# are up, and skipped when they are not: unreachable is tolerated, and they are
# subtracted from the connected+paired assertion (an off host is not a fault).
# This play is a health gate for the weekly timer, so "a desktop is switched
# off" must never make it red.
#
# `nodes status --json` schema, captured from a real 2026.7.1-2 gateway on
# 2026-08-01 (it was previously inferred from prose, which is what made the
# connected+paired check fail with "object of type 'str' has no attribute
# 'status'"):
#
#   {"ts": <epoch_ms>, "nodes": [ {...}, ... ]}
#
# The top level is an OBJECT, not a list — iterating it yields key strings.
# Each node has "displayName", "version", "connected" (bool), "paired" (bool)
# and "approvalState" (e.g. "approved", "pending-reapproval", "unapproved").
# There is no "status" field.
#
# The gateway reports every node it knows about, not just inventory hosts —
# pve-router and personal devices show up here too. So the assertion below
# checks that each *inventory* host is present and connected+paired, rather
# than comparing raw counts, which would never match.

- name: Validate OpenClaw version pin fleet-wide
  hosts: openclaw:!openclaw_optional
  gather_facts: false
  become: true

  tasks:
    - name: Check installed openclaw CLI version
      ansible.builtin.command: openclaw --version
      register: openclaw_validate_version
      changed_when: false

    - name: Assert installed version matches the pin
      ansible.builtin.assert:
        that:
          - openclaw_version in openclaw_validate_version.stdout
        fail_msg: >-
          {{ inventory_hostname }} is at '{{ openclaw_validate_version.stdout }}',
          expected '{{ openclaw_version }}'.
        success_msg: "{{ inventory_hostname }} is at the pinned version."

    # Reported, not remediated here — see docs/execution-model.md "DNS
    # resolver assertion". The fix (common role, --tags dns) is not part of
    # the weekly convergence, so this is what catches drift or a rebuilt host
    # in between manual runs.
    - name: Resolve the gateway hostname from this host
      ansible.builtin.command: getent hosts openclaw.home.lan
      register: openclaw_gateway_resolution
      changed_when: false
      failed_when: false

    - name: Assert this host resolves the gateway to its real address
      ansible.builtin.assert:
        that:
          - openclaw_gateway_resolution.rc == 0
          - openclaw_gateway_resolution.stdout.split()[0] == hostvars[groups['openclaw_gateway'][0]].ansible_host
        fail_msg: >-
          {{ inventory_hostname }} resolves openclaw.home.lan to
          '{{ openclaw_gateway_resolution.stdout.split()[0] | default("nothing") }}',
          expected '{{ hostvars[groups['openclaw_gateway'][0]].ansible_host }}' —
          check for a local /etc/hosts override or resolver misconfiguration
          (run deploy-openclaw.yml --tags dns).
        success_msg: "{{ inventory_hostname }} resolves openclaw.home.lan correctly."

- name: Validate OpenClaw version pin on intermittently-powered hosts
  # Same assertion, but reaching the host is not itself required. If it answers
  # it must be at the pin; if it is switched off the play moves on.
  #
  # `ignore_unreachable` on its own is NOT enough: it keeps the host out of the
  # failed list, but the host still runs every later task in the play, and the
  # first one that reads a registered result from the task that never ran dies
  # with "object of type 'dict' has no attribute 'stdout'". Hence the explicit
  # probe below, whose result gates the real work.
  hosts: openclaw_optional
  gather_facts: false
  become: true
  ignore_unreachable: true

  tasks:
    - name: Probe reachability — this host is allowed to be powered off
      ansible.builtin.ping:
      register: openclaw_optional_probe
      changed_when: false

    - name: Report a powered-off optional host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is unreachable — expected for an
          [openclaw_optional] host; skipping its checks, not failing.
      when: openclaw_optional_probe.unreachable | default(false)

    - name: Check installed openclaw CLI version
      ansible.builtin.command: openclaw --version
      register: openclaw_validate_version
      changed_when: false
      when: not (openclaw_optional_probe.unreachable | default(false))

    - name: Assert installed version matches the pin
      ansible.builtin.assert:
        that:
          - openclaw_version in openclaw_validate_version.stdout
        fail_msg: >-
          {{ inventory_hostname }} is at '{{ openclaw_validate_version.stdout }}',
          expected '{{ openclaw_version }}'.
        success_msg: "{{ inventory_hostname }} is at the pinned version."
      when: not (openclaw_optional_probe.unreachable | default(false))

    - name: Resolve the gateway hostname from this host
      ansible.builtin.command: getent hosts openclaw.home.lan
      register: openclaw_gateway_resolution
      changed_when: false
      failed_when: false
      when: not (openclaw_optional_probe.unreachable | default(false))

    - name: Assert this host resolves the gateway to its real address
      ansible.builtin.assert:
        that:
          - openclaw_gateway_resolution.rc == 0
          - openclaw_gateway_resolution.stdout.split()[0] == hostvars[groups['openclaw_gateway'][0]].ansible_host
        fail_msg: >-
          {{ inventory_hostname }} resolves openclaw.home.lan to
          '{{ openclaw_gateway_resolution.stdout.split()[0] | default("nothing") }}',
          expected '{{ hostvars[groups['openclaw_gateway'][0]].ansible_host }}' —
          check for a local /etc/hosts override or resolver misconfiguration
          (run deploy-openclaw.yml --tags dns).
        success_msg: "{{ inventory_hostname }} resolves openclaw.home.lan correctly."
      when: not (openclaw_optional_probe.unreachable | default(false))

- name: Validate the gateway service, its own node, and fleet-wide pairing
  hosts: openclaw_gateway
  gather_facts: false
  become: true

  vars:
    # Every openclaw CLI call below is wrapped in this. `openclaw doctor` was
    # observed hanging indefinitely on the gateway after the 2026.7.1-2 upgrade
    # (>22 min, no output, unaffected by a plain SIGTERM), which stalls the whole
    # play. A validation play must always terminate — it is a health gate, and
    # Phase 8 intends to run it unattended on a timer.
    #
    # -s KILL because SIGTERM did not stop it. A killed command surfaces as
    # rc 137 and fails the assertion loudly, which is the correct outcome.
    openclaw_validate_timeout: 60

  tasks:
    - name: Check gateway health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openclaw_gateway_port }}/health"
        return_content: true
      register: openclaw_health

    - name: Assert gateway reports healthy
      ansible.builtin.assert:
        that:
          - openclaw_health.status == 200
          - openclaw_health.json.ok | default(false)
        fail_msg: "Gateway /health did not report {ok: true}: {{ openclaw_health.content | default('') }}"

    - name: Check gateway-host service states
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - openclaw-gateway
        - openclaw-node
      register: openclaw_gateway_services
      changed_when: false
      failed_when: false

    - name: Assert the gateway host runs BOTH services
      ansible.builtin.assert:
        that:
          - item.stdout == "active"
        fail_msg: "{{ item.item }} is not active on the gateway host (state: {{ item.stdout }})"
        success_msg: "{{ item.item }} is active on the gateway host."
      loop: "{{ openclaw_gateway_services.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Query node status from the gateway
      ansible.builtin.command: timeout -s KILL {{ openclaw_validate_timeout }} openclaw nodes status --json
      become_user: "{{ openclaw_user }}"
      register: openclaw_nodes_status_raw
      changed_when: false

    - name: Parse node status
      ansible.builtin.set_fact:
        openclaw_nodes_status: "{{ openclaw_nodes_status_raw.stdout | from_json }}"

    # openclaw_optional hosts are subtracted from the *required* set: a
    # switched-off desktop is absent from the gateway's connected list by
    # design, and gating the whole fleet's health on it would make this play
    # permanently red. They are reported below instead.
    - name: Identify connected+paired nodes and any managed host missing from them
      ansible.builtin.set_fact:
        openclaw_nodes_required: >-
          {{ groups['openclaw_nodes'] | difference(groups['openclaw_optional'] | default([])) }}
        openclaw_nodes_connected_paired: >-
          {{ openclaw_nodes_status.nodes
             | selectattr('connected', 'equalto', true)
             | selectattr('paired', 'equalto', true)
             | map(attribute='displayName') | list }}

    - name: Identify required nodes that are not connected+paired
      ansible.builtin.set_fact:
        openclaw_nodes_missing: >-
          {{ openclaw_nodes_required | difference(openclaw_nodes_connected_paired) }}
        openclaw_optional_offline: >-
          {{ (groups['openclaw_optional'] | default([])) | difference(openclaw_nodes_connected_paired) }}

    - name: Assert every required node is connected and paired
      ansible.builtin.assert:
        that:
          - openclaw_nodes_missing | length == 0
        fail_msg: >-
          Not connected+paired: {{ openclaw_nodes_missing | join(', ') }}.
          Gateway reported {{ openclaw_nodes_status.nodes | length }} nodes total
          ({{ openclaw_nodes_connected_paired | length }} connected+paired, including
          any non-inventory device).
        success_msg: >-
          All {{ openclaw_nodes_required | length }} required nodes are connected and paired.

    - name: Report intermittently-powered nodes that are currently offline
      ansible.builtin.debug:
        msg: >-
          Offline optional node(s): {{ openclaw_optional_offline | join(', ') }}
          — expected if powered down; they converge on the next run while up.
          Not asserted against.
      when: openclaw_optional_offline | length > 0

    # Reported, not asserted: re-approval is a human decision (it grants newly
    # declared capabilities), so a node awaiting it is not a failure this play
    # should gate on. Clear it with approve-openclaw-nodes.yml. Promote to an
    # assert if you would rather the fleet never sit in this state unnoticed.
    - name: Identify managed nodes not in the approved state
      ansible.builtin.set_fact:
        openclaw_nodes_unapproved: >-
          {{ openclaw_nodes_status.nodes
             | selectattr('displayName', 'in', groups['openclaw_nodes'])
             | rejectattr('approvalState', 'equalto', 'approved')
             | map(attribute='displayName') | list }}

    - name: Report managed nodes awaiting approval
      ansible.builtin.debug:
        msg: >-
          Awaiting approval ({{ openclaw_nodes_unapproved | length }}):
          {{ openclaw_nodes_unapproved | join(', ') }}
          — run approve-openclaw-nodes.yml -e openclaw_approve_confirm=true
      when: openclaw_nodes_unapproved | length > 0

    # Bare `openclaw doctor` renders an interactive TUI and blocks on a prompt
    # it opens directly rather than reading stdin, so closing stdin does not
    # help — it hangs until killed. `--lint --json --non-interactive` is the
    # scriptable form: read-only checks, machine-readable, no prompts.
    #
    # Output schema, captured live from 2026.7.1-2 on 2026-08-01:
    #
    #   {"ok": <bool>, "checksRun": <int>, "checksSkipped": <int>,
    #    "findings": [{"checkId": "...", "severity": "info|warning|error",
    #                  "message": "..."}]}
    #
    # Exit is 1 whenever findings exist, so rc is not a useful assertion.
    - name: Run openclaw doctor (read-only lint)
      ansible.builtin.command:
        cmd: >-
          timeout -s KILL {{ openclaw_validate_timeout }}
          openclaw doctor --lint --json --non-interactive
      become_user: "{{ openclaw_user }}"
      register: openclaw_doctor
      changed_when: false
      failed_when: false

    - name: Assert doctor completed rather than being killed
      ansible.builtin.assert:
        that:
          - openclaw_doctor.rc not in [137, -9]
        fail_msg: >-
          openclaw doctor did not finish within {{ openclaw_validate_timeout }}s
          and was killed (rc {{ openclaw_doctor.rc }}).

    - name: Parse doctor findings
      ansible.builtin.set_fact:
        openclaw_doctor_report: "{{ openclaw_doctor.stdout | from_json }}"

    - name: Split doctor findings by severity
      ansible.builtin.set_fact:
        openclaw_doctor_errors: >-
          {{ openclaw_doctor_report.findings
             | selectattr('severity', 'equalto', 'error') | list }}
        openclaw_doctor_warnings: >-
          {{ openclaw_doctor_report.findings
             | selectattr('severity', 'equalto', 'warning') | list }}

    # Reported, not asserted. `ok` is false whenever any finding exists, and the
    # current warnings are accepted configuration (plaintext gateway.auth.token,
    # gateway bound to 0.0.0.0). Gating on `ok` would leave this play permanently
    # red and therefore useless. Errors do gate.
    - name: Report doctor warnings
      ansible.builtin.debug:
        msg: >-
          doctor warnings ({{ openclaw_doctor_warnings | length }} of
          {{ openclaw_doctor_report.checksRun }} checks):
          {{ openclaw_doctor_warnings | map(attribute='message') | join(' | ') }}
      when: openclaw_doctor_warnings | length > 0

    - name: Assert doctor reports no errors
      ansible.builtin.assert:
        that:
          - openclaw_doctor_errors | length == 0
        fail_msg: >-
          doctor reported {{ openclaw_doctor_errors | length }} error-severity
          finding(s): {{ openclaw_doctor_errors | map(attribute='message') | join(' | ') }}
        success_msg: >-
          openclaw doctor: no errors across {{ openclaw_doctor_report.checksRun }} checks
          ({{ openclaw_doctor_warnings | length }} warning(s) reported above).

- name: Report pve-router state (report-only — deliberately unmanaged, never asserted, never targeted for change)
  hosts: pve-router.home.lan
  gather_facts: false
  become: true

  tasks:
    - name: Check openclaw-node service state
      ansible.builtin.command: systemctl is-active openclaw-node
      register: openclaw_pve_router_service
      changed_when: false
      failed_when: false

    - name: Check installed openclaw version
      ansible.builtin.command: openclaw --version
      register: openclaw_pve_router_version
      changed_when: false
      failed_when: false

    - name: Report pve-router state
      ansible.builtin.debug:
        msg: >-
          pve-router openclaw-node service: {{ openclaw_pve_router_service.stdout | default('unknown') }};
          version: {{ openclaw_pve_router_version.stdout | default('unknown') }}
          — report-only, not managed by this migration, not asserted against.
