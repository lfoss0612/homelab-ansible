---
# Delete the orphaned pod TRIGGER prototypes left on k8s-master.home.lan by
# unlinking "Kubernetes nodes by HTTP" without "clear".
#
# Corrects an earlier misdiagnosis. The duplicate pod triggers were blamed on
# the "Kubernetes cluster state by HTTP" template being a merged hybrid. It is
# not - inspected directly once prototype permissions were granted, that
# template is clean: 17 item prototypes all keyed on {#NAME}, and exactly 2
# trigger prototypes, both correct.
#
# The orphans live on the HOST's copy of the discovery rule. Unlinking a
# template WITHOUT "clear" leaves its inherited objects in place and merely
# strips their templateid, turning them into host-local orphans that no
# template owns and no template update will ever correct. On k8s-master's
# kube.pod.discovery that left:
#
#   8 item prototypes    keyed on {#POD}          (templateid=0)
#   2 trigger prototypes named "Node [{#NODE}]"   (templateid=0)
#
# {#POD} and {#NODE} are macros the CURRENT rule never declares, which is why
# both carried unresolved literals. That is the same root cause behind the
# {#POD} item bug fixed in zabbix-fix-pod-discovery.yml - not two defects but
# one, seen from two directions.
#
# Scope here is the TRIGGER prototypes only, because that deletion is
# loss-free: both duplicate a "Kubernetes cluster state:" trigger that already
# covers the same condition, so removing them stops a crash-looping pod raising
# two problems instead of one. Deleting them at the prototype level - rather
# than disabling the 240 discovered triggers as
# zabbix-disable-duplicate-pod-triggers.yml had to before permissions were
# granted - also covers every pod discovered from now on, which that
# workaround could not.
#
# The 8 orphaned ITEM prototypes are handled too, on an explicit decision taken
# 2026-08-25. Six duplicate template items under different key names; two do
# not - kube.pod.conditions.initialized and kube.pod.uptime have no equivalent
# in the cluster-state template, so this DOES give up two metrics. Pod age
# remains visible via kubectl, and pod-initialized is covered in practice by
# the template's ready/scheduled conditions, which is why the trade was
# accepted rather than keeping a permanently orphaned prototype set alive.
#
# With the orphan items gone, the {#POD} macro path is no longer needed by
# anything and is removed from the template, returning it to stock. Order
# matters: the prototypes must be neutralised BEFORE the macro path goes, or
# they revert to emitting literal-{#POD} keys in between.
#
# DISABLE, not delete - and not by preference. Deleting is the better end
# state, since an orphan prototype belongs to nothing and no template update
# will ever correct it, so a disabled one lingers forever with no owner. But
# triggerprototype.delete is refused to the automation token even though .get
# and .update are granted, so disable is what is actually reachable. It is
# durable in the way that matters: a disabled prototype creates no enabled
# triggers for pods discovered from now on, which the earlier
# discovered-trigger sweep could not achieve.
#
# To finish the job properly, delete these two prototypes in the UI:
#   Data collection -> Hosts -> k8s-master.home.lan -> Discovery rules
#     -> "Pod discovery" -> Trigger prototypes
#     -> the two named "Kubernetes nodes: Node [{#NODE}] ..."
#
# Usage:
#   ansible-playbook playbooks/zabbix-remove-orphan-pod-prototypes.yml --check --diff
#   ansible-playbook playbooks/zabbix-remove-orphan-pod-prototypes.yml

- name: Remove orphaned pod trigger prototypes
  hosts: localhost
  gather_facts: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "c4bceeafe968e48fd74a68fda821867cee967eb19a4cea615b2e47f1215ad939"

    target_host: "k8s-master.home.lan"
    lld_key: "kube.pod.discovery"
    cluster_state_templateid: "10510"

    # !unsafe throughout: "{#" opens a Jinja comment, so a bare literal here
    # fails to template with "Missing end of comment tag".
    pod_macro: !unsafe "{#POD}"
    pod_macro_marker: !unsafe "\\{#POD\\}"

  tasks:
    # hostids, not host. discoveryrule.get's `host` parameter does NOT filter -
    # it returns the rule from every template that defines the same key as well
    # as the host's own copy, so selecting on it silently picks a template's
    # rule and edits the wrong object.
    - name: Resolve the host id
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output: ["hostid", "host"]
            filter:
              host: ["{{ target_host }}"]
          id: 1
      register: host_lookup
      check_mode: false
      failed_when: >-
        host_lookup.json.error is defined
        or (host_lookup.json.result | default([]) | length) != 1

    - name: Find the host's pod discovery rule
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ host_lookup.json.result[0].hostid }}"]
            filter:
              key_: ["{{ lld_key }}"]
          id: 1
      register: lld_lookup
      check_mode: false
      failed_when: >-
        lld_lookup.json.error is defined
        or (lld_lookup.json.result | default([]) | length) != 1

    - name: List the trigger prototypes on that rule
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.get
          params:
            discoveryids: ["{{ lld_lookup.json.result[0].itemid }}"]
            output: ["triggerid", "description", "templateid"]
          id: 1
      register: tp_lookup
      check_mode: false
      failed_when: tp_lookup.json.error is defined

    # templateid == "0" is the orphan marker: a prototype no template owns.
    # Both conditions are required - an inherited prototype must never be
    # deleted here, and a host-local one that resolves its macros correctly
    # would be a deliberate local addition rather than unlink debris.
    - name: Select the orphans
      ansible.builtin.set_fact:
        orphan_triggers: >-
          {{ tp_lookup.json.result
             | selectattr('templateid', 'equalto', '0')
             | selectattr('description', 'search', 'NODE')
             | list }}

    - name: Report what will be deleted
      ansible.builtin.debug:
        msg: >-
          {{ tp_lookup.json.result | length }} trigger prototype(s) on
          {{ target_host }}/{{ lld_key }};
          {{ orphan_triggers | length }} orphaned (templateid=0, unresolved macro) →
          {{ orphan_triggers | map(attribute='description') | map('truncate', 60) | list }}

    - name: Disable the orphaned trigger prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.update
          params: >-
            {{ orphan_triggers
               | map(attribute='triggerid')
               | map('community.general.dict_kv', 'triggerid')
               | map('combine', {'status': 1})
               | list }}
          id: 1
      register: tp_delete
      when: orphan_triggers | length > 0
      failed_when: tp_delete.json.error is defined
      changed_when: tp_delete.json.result is defined

    - name: List the item prototypes on that rule
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: itemprototype.get
          params:
            discoveryids: ["{{ lld_lookup.json.result[0].itemid }}"]
            output: ["itemid", "key_", "templateid", "status"]
          id: 1
      register: ip_lookup
      check_mode: false
      failed_when: ip_lookup.json.error is defined

    - name: Select the orphaned item prototypes
      ansible.builtin.set_fact:
        orphan_items: >-
          {{ ip_lookup.json.result
             | selectattr('templateid', 'equalto', '0')
             | selectattr('key_', 'search', pod_macro_marker)
             | list }}

    - name: Report the item prototypes that will be disabled
      ansible.builtin.debug:
        msg: >-
          {{ ip_lookup.json.result | length }} item prototype(s);
          {{ orphan_items | length }} orphaned →
          {{ orphan_items | map(attribute='key_') | list }}

    - name: Disable the orphaned item prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: itemprototype.update
          params: >-
            {{ orphan_items
               | selectattr('status', 'equalto', '0')
               | map(attribute='itemid')
               | map('community.general.dict_kv', 'itemid')
               | map('combine', {'status': 1})
               | list }}
          id: 1
      register: ip_disable
      when: (orphan_items | selectattr('status', 'equalto', '0') | list | length) > 0
      failed_when: ip_disable.json.error is defined
      changed_when: ip_disable.json.result is defined

    # Only once nothing references {#POD} any more. Reverting this while an
    # enabled orphan prototype still used it would put the literal-key
    # collision straight back.
    - name: Re-read the template's pod discovery macro paths
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            output: ["itemid"]
            selectLLDMacroPaths: "extend"
            templateids: ["{{ cluster_state_templateid }}"]
            filter:
              key_: ["{{ lld_key }}"]
          id: 1
      register: tpl_lld
      check_mode: false
      failed_when: >-
        tpl_lld.json.error is defined
        or (tpl_lld.json.result | default([]) | length) != 1

    - name: Remove the now-unneeded macro path from the template
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.update
          params:
            itemid: "{{ tpl_lld.json.result[0].itemid }}"
            lld_macro_paths: >-
              {{ tpl_lld.json.result[0].lld_macro_paths
                 | rejectattr('lld_macro', 'equalto', pod_macro) | list }}
          id: 1
      register: shim_revert
      when: >-
        pod_macro in (tpl_lld.json.result[0].lld_macro_paths | map(attribute='lld_macro') | list)
      failed_when: shim_revert.json.error is defined
      changed_when: shim_revert.json.result is defined

    - name: Confirm the end state
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.get
          params:
            discoveryids: ["{{ lld_lookup.json.result[0].itemid }}"]
            output: ["triggerid", "description", "templateid", "status"]
          id: 1
      register: tp_verify
      check_mode: false
      failed_when: tp_verify.json.error is defined

    - name: Report the end state
      ansible.builtin.debug:
        msg: >-
          {{ tp_verify.json.result | length }} trigger prototype(s);
          orphaned still ENABLED:
          {{ tp_verify.json.result | selectattr('templateid', 'equalto', '0')
             | selectattr('status', 'equalto', '0') | list | length }}
          (expected 0). Pods discovered from now on get no enabled duplicate.
