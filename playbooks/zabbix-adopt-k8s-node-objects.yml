---
# Recreate k8s-master's orphaned "Kubernetes nodes by HTTP" objects from git.
#
# THE PROBLEM: 44 objects on k8s-master.home.lan exist in Zabbix but nowhere
# else - one script master item (kube.nodes), 28 dependent item prototypes and
# 15 trigger prototypes, all at templateid: 0. They are the entire Nodes page of
# dashboard 403 and all node-level alerting (conditions, capacity/allocatable,
# requests, limits, node info, uptime, addresses, the pressure/not-Ready
# triggers). Nothing recreates them: "Kubernetes nodes by HTTP" is not linked to
# the host, and the "Kubernetes cluster state by HTTP" template that owns their
# discovery rule defines only 8 of the 36 prototypes on it. If this Zabbix host
# were ever rebuilt, those 44 would simply not come back.
#
# Most likely how they got that way (inferred from the object shapes, not read
# anywhere): "Kubernetes nodes by HTTP" was linked once and later unlinked
# WITHOUT clearing, which leaves objects behind at templateid: 0 still working.
# When cluster-state was linked, Zabbix adopted the same-key kube.node.discovery
# rule into it and the nodes-template prototypes underneath stayed orphaned.
#
# WHAT THIS DOES NOT DO: it does not de-orphan anything. templateid is not
# writable through the API - only template linkage sets it - so no
# itemprototype.update re-parents these. Re-linking "Kubernetes nodes by HTTP"
# is blocked too, because both templates define a rule keyed
# kube.node.discovery and the host's rule already belongs to cluster-state.
# This play makes the objects REPRODUCIBLE, not template-managed. That is the
# achievable half.
#
# Definitions live in vars/zabbix-k8s-node-objects.json, captured from the live
# server on 2026-08-29 (configuration.export is refused to the automation
# token, so they were read back with item.get / itemprototype.get /
# triggerprototype.get). The kube.nodes script body is a separate file,
# playbooks/files/zabbix/kube-nodes-script.js, so it stays diffable.
#
# IDEMPOTENT: creates only what is missing, keyed on item key and on
# (description, priority) for triggers. Against the current server every object
# already exists, so a run reports 0 created and changes nothing.
#
# CREATE PATH TESTED 2026-09-20 against a disposable throwaway host, since
# item.delete / itemprototype.delete / host.delete are all refused to this
# token - nothing created during a test can be cleaned up through the API on
# ANY host, not just k8s-master. Gave the throwaway host a minimal
# kube.node.discovery LLD rule (type 5, no master-item dependency needed) and
# ran this play against it with -e k8s_host=<throwaway host>: created the
# master item, all 28 item prototypes and all 15 trigger prototypes correctly
# in one pass, 0 of each on a second run. It still fails loudly on the first
# API error rather than continuing.
#
# The kube.nodes script's 7 macros ({$KUBE.API.URL}/{$KUBE.API.TOKEN},
# {$KUBE.NODES.ENDPOINT.NAME}, {$KUBE.POD.FILTER.*}, {$KUBE.NODE.FILTER.*})
# are host macros, not discovery-rule objects, so they are not in zbx.* - but
# a rebuild needs them too. Set additively near the end of this play; see the
# comment there for what each is set to and why.
#
# Usage:
#   ansible-playbook playbooks/zabbix-adopt-k8s-node-objects.yml --check --diff
#   ansible-playbook playbooks/zabbix-adopt-k8s-node-objects.yml

- name: Adopt k8s-master's orphaned Kubernetes node objects into git
  hosts: localhost
  gather_facts: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    # Vaulted in host_vars/zabbix.home.lan.yml, read via hostvars (see
    # that file for why this isn't a plain group_vars/vars_files include).
    zabbix_api_token: "{{ hostvars['zabbix.home.lan'].zabbix_api_token }}"
    k8s_host: "k8s-master.home.lan"
    lld_key: "kube.node.discovery"
    # The zabbix-agent DaemonSet's Endpoints object (homelab-gitops's
    # zabbix-proxy-agent.yaml, one pod per node) - confirmed live 2026-09-20
    # via the cluster API (ready=3, one per node), not guessed. Distinct from
    # zabbix-proxy-agent-zabbix-helm-chrt-proxy, the single centralized proxy
    # pod, which is not what {#NAME}-per-node status.agent should track.
    kube_nodes_endpoint_name: "zabbix-proxy-agent-zabbix-helm-chrt-agent"
    api_headers:
      Authorization: "Bearer {{ zabbix_api_token }}"

  tasks:
    # lookup()+from_json, NOT include_vars. Every key, description and
    # expression in this data contains an LLD macro like {#NAME}, and "{#" opens
    # a Jinja comment - include_vars' values get templated on use and die with
    # "Missing end of comment tag". Lookup results come back marked unsafe, so
    # they are never re-templated. Same reason zabbix-remove-orphan-pod-
    # prototypes.yml uses !unsafe for its {#POD} literals. Verified both ways
    # against the live server before choosing this one.
    - name: Load the captured object definitions
      ansible.builtin.set_fact:
        zbx: "{{ lookup('file', playbook_dir ~ '/vars/zabbix-k8s-node-objects.json') | from_json }}"

    - name: Load the kube.nodes script body
      ansible.builtin.set_fact:
        kube_nodes_script: "{{ lookup('file', playbook_dir ~ '/files/zabbix/kube-nodes-script.js') }}"

    - name: Resolve the host
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output: ["hostid", "host"]
            filter: {host: ["{{ k8s_host }}"]}
          id: 1
      register: host_lookup
      check_mode: false
      failed_when: >-
        host_lookup.json.error is defined
        or (host_lookup.json.result | default([]) | length) != 1

    - name: Resolve the node discovery rule
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ host_lookup.json.result[0].hostid }}"]
            filter: {key_: ["{{ lld_key }}"]}
          id: 1
      register: rule_lookup
      check_mode: false
      failed_when: >-
        rule_lookup.json.error is defined
        or (rule_lookup.json.result | default([]) | length) != 1

    - name: Set the resolved ids
      ansible.builtin.set_fact:
        hostid: "{{ host_lookup.json.result[0].hostid }}"
        ruleid: "{{ rule_lookup.json.result[0].itemid }}"

    # ---------------------------------------------------------------- master
    - name: Look up the kube.nodes master item
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ hostid }}"]
            filter: {key_: ["{{ zbx.master_item.key_ }}"]}
          id: 1
      register: master_lookup
      check_mode: false
      failed_when: master_lookup.json.error is defined

    - name: Create the kube.nodes master item when missing
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: item.create
          params: >-
            {{ zbx.master_item
               | combine({'hostid': hostid, 'params': kube_nodes_script}) }}
          id: 1
      register: master_create
      when: (master_lookup.json.result | length) == 0
      failed_when: master_create.json.error is defined
      changed_when: master_create.json.result is defined

    - name: Re-resolve the master item id
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            output: ["itemid", "key_"]
            hostids: ["{{ hostid }}"]
            filter: {key_: ["{{ zbx.master_item.key_ }}"]}
          id: 1
      register: master_final
      check_mode: false
      failed_when: master_final.json.error is defined

    # ------------------------------------------------------------ prototypes
    # Two tiers: 5 prototypes hang off kube.nodes, 23 off kube.node.get[{#NAME}]
    # which is itself one of the 5. Tier 1 must exist before tier 2 can name it
    # as a master, so the id map is rebuilt between the two passes.
    - name: Create the item prototypes, tier by tier
      ansible.builtin.include_tasks: tasks/zabbix-node-prototype-tier.yml
      # !unsafe for the same reason as above: a bare literal here is parsed as
      # an unterminated Jinja comment.
      loop:
        - "{{ zbx.master_item.key_ }}"
        - !unsafe "kube.node.get[{#NAME}]"
      loop_control:
        loop_var: tier_master_key

    # -------------------------------------------------------------- triggers
    - name: List existing trigger prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.get
          params:
            output: ["triggerid", "description", "priority"]
            discoveryids: ["{{ ruleid }}"]
          id: 1
      register: trig_existing
      check_mode: false
      failed_when: trig_existing.json.error is defined

    - name: Create the missing trigger prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.create
          params: >-
            {{ item
               | dict2items | rejectattr('key', 'in', ['dependencies'])
               | rejectattr('value', 'eq', '') | items2dict
               | combine({'expression': item.expression | replace('@@ZBX_HOST@@', k8s_host)})
               | combine({'recovery_expression':
                          item.recovery_expression | replace('@@ZBX_HOST@@', k8s_host)}
                         if item.recovery_expression else {}) }}
          id: 1
      register: trig_create
      loop: "{{ zbx.trigger_prototypes }}"
      loop_control:
        label: "{{ item.description }} (prio {{ item.priority }})"
      when: >-
        (trig_existing.json.result
         | selectattr('description', 'eq', item.description)
         | selectattr('priority', 'eq', item.priority) | list | length) == 0
      failed_when: trig_create.json.error is defined
      changed_when: trig_create.json.result is defined

    # -------------------------------------------------------- kube.nodes macros
    # All 7 macros the kube.nodes script reads. The play that originally set
    # the first two (configure-kubernetes-monitoring.yml) is no longer safe to
    # rerun: it uses host.update's `macros` array, which REPLACES every macro
    # on the host (wiping other secrets - see configure-mac-inventory.yml),
    # and it re-links "Kubernetes nodes by HTTP", which now conflicts with
    # cluster-state owning the same kube.node.discovery rule. This sets all 7
    # the safe, additive way (usermacro.create, only when missing) instead.
    # Skipped entirely when the target host has no zbx_kube_api_token
    # host_vars (e.g. the disposable host this play was tested against on
    # 2026-09-20) - such a host has no real Kubernetes API behind it, so none
    # of these 7 would mean anything there either.
    #
    # {$KUBE.API.URL} / {$KUBE.API.TOKEN}: sourced from host_vars
    # (zbx_kube_api_url / zbx_kube_api_token, host_vars/k8s-master.home.lan.yml,
    # itself ansible-vault encrypted) so a rebuild does not depend on
    # remembering where that value came from.
    #
    # {$KUBE.NODE.FILTER.*} / {$KUBE.POD.FILTER.*}: left "" - confirmed
    # 2026-09-20 (no filtering was ever wanted) and proven a true no-op by
    # reading kube-nodes-script.js: parseFilters('') returns [], and
    # Kube.filter() against an empty filter list passes everything, which is
    # exactly what an *undefined* macro already does today (Zabbix resolves
    # an undefined user macro to '' in script item parameters). So setting
    # these explicitly changes nothing live - it only makes the current
    # "everything passes" state explicit and reproducible in git.
    #
    # {$KUBE.NODES.ENDPOINT.NAME}: unlike the filters, this ONE is a real
    # behaviour change, not a no-op - status.agent and {#ENDPOINT} go from
    # always-empty to actually reporting per-node zabbix-agent health. Value
    # is kube_nodes_endpoint_name (see vars above).
    - name: Check for the existing kube.nodes script macros
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: usermacro.get
          params:
            hostids: ["{{ hostid }}"]
            filter:
              macro:
                - "{$KUBE.API.URL}"
                - "{$KUBE.API.TOKEN}"
                - "{$KUBE.NODES.ENDPOINT.NAME}"
                - "{$KUBE.NODE.FILTER.LABELS}"
                - "{$KUBE.NODE.FILTER.ANNOTATIONS}"
                - "{$KUBE.POD.FILTER.LABELS}"
                - "{$KUBE.POD.FILTER.ANNOTATIONS}"
          id: 1
      register: kube_macros_existing
      check_mode: false
      failed_when: kube_macros_existing.json.error is defined
      when: hostvars[k8s_host].zbx_kube_api_token is defined

    - name: Set the kube.nodes script macros when missing
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers: "{{ api_headers }}"
        body:
          jsonrpc: "2.0"
          method: usermacro.create
          params:
            hostid: "{{ hostid }}"
            macro: "{{ item.macro }}"
            value: "{{ item.value }}"
            type: "{{ item.type }}"
          id: 1
      register: kube_macro_create
      loop:
        - macro: "{$KUBE.API.URL}"
          value: "{{ hostvars[k8s_host].zbx_kube_api_url | default('') }}"
          type: "0"
        - macro: "{$KUBE.API.TOKEN}"
          value: "{{ hostvars[k8s_host].zbx_kube_api_token | default('') }}"
          type: "1"
        - macro: "{$KUBE.NODES.ENDPOINT.NAME}"
          value: "{{ kube_nodes_endpoint_name }}"
          type: "0"
        - macro: "{$KUBE.NODE.FILTER.LABELS}"
          value: ""
          type: "0"
        - macro: "{$KUBE.NODE.FILTER.ANNOTATIONS}"
          value: ""
          type: "0"
        - macro: "{$KUBE.POD.FILTER.LABELS}"
          value: ""
          type: "0"
        - macro: "{$KUBE.POD.FILTER.ANNOTATIONS}"
          value: ""
          type: "0"
      loop_control:
        label: "{{ item.macro }}"
      when:
        - hostvars[k8s_host].zbx_kube_api_token is defined
        - (kube_macros_existing.json.result | selectattr('macro', 'eq', item.macro) | list | length) == 0
      failed_when: kube_macro_create.json.error is defined
      changed_when: kube_macro_create.json.result is defined
      no_log: true

    - name: Report what was missing
      ansible.builtin.debug:
        msg: >-
          host={{ k8s_host }} rule={{ ruleid }}.
          master item {{ 'CREATED' if (master_lookup.json.result | length) == 0 else 'present' }};
          trigger prototypes created:
          {{ trig_create.results | default([]) | rejectattr('skipped', 'defined') | list | length }}
          of {{ zbx.trigger_prototypes | length }}.
          Item prototype counts are reported by the per-tier tasks above.
          kube.nodes script macros: {{ 'not applicable, no host_vars for ' + k8s_host
          if hostvars[k8s_host].zbx_kube_api_token is not defined
          else (kube_macro_create.results | default([]) | rejectattr('skipped', 'defined') | list | length | string) + ' of 7 created' }}.
          A run against a healthy server should create nothing.
