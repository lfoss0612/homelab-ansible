---
# Single-run: completed - unused AMD ROCm stack removed from k8s-master on 2026-11-19
#
# Remove the AMD ROCm/HIP stack from a host that has no AMD GPU. Found on k8s-master 2026-11-19: 18 GB
# under /opt/rocm-6.4.3, installed from repos the Ubuntu release upgrade then disabled, so it would
# never update again. Verified unused there: no process maps it, no /dev/kfd, no pod asks for an AMD
# resource or mounts it, no config references it.
#
#   scripts/run-working-tree.sh playbooks/once-remove-rocm.yml -e rocm_host=k8s-master.home.lan          dry run
#   scripts/run-working-tree.sh --apply playbooks/once-remove-rocm.yml -e rocm_host=k8s-master.home.lan  removes
#
# Safety: it refuses when /dev/kfd exists (an AMD compute GPU is present), simulates the purge first
# and refuses if the simulation would remove anything outside the ROCm family or the apt-installed
# autoremovable libraries, and it only purges the packages that belong to the stack. Reversible by
# re-adding the AMD repo and installing again; nothing else on the host is touched.
- name: Remove the ROCm stack
  hosts: "{{ rocm_host | default('localhost') }}"
  become: true
  gather_facts: false
  vars:
    rocm_family: '^(rocm|hip|hsa|amdgpu|amd-smi|comgr|miopen|migraphx|mivisionx|rccl|rocblas|rocfft|rocsolver|rocsparse|rocrand|rocprim|rocthrust|rocalution|rocwmma|rocdecode|rocjpeg|rocal|rpp|roctracer|rocprofiler|rocminfo|rocm-|composablekernel|half$|llvm-amdgpu|openmp-extras|hipify|hipcc|hiptensor|hipfort|hipcub|hipfft|hipsparse|hipsolver|hipblas|hiprand|hipsparselt|hipblaslt)'
    # AMD's own libdrm builds (not the distro libdrm2) that apt removes along with the stack.
    rocm_allowed_extra: '^(libdrm2-amdgpu|libdrm-amdgpu)'
  tasks:
    - name: Nothing to do without a host
      ansible.builtin.meta: end_play
      when: rocm_host is not defined

    - name: Refuse if an AMD compute device exists
      ansible.builtin.stat:
        path: /dev/kfd
      register: rocm_kfd
      failed_when: rocm_kfd.stat.exists

    - name: List the installed ROCm-family packages
      ansible.builtin.shell: >-
        dpkg-query -W -f='${Package}\n' | grep -E '{{ rocm_family }}' | sort
      register: rocm_pkgs
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Say what was found
      ansible.builtin.debug:
        msg: "{{ rocm_pkgs.stdout_lines | length }} package(s): {{ rocm_pkgs.stdout_lines | join(' ') | truncate(600) }}"

    - name: Simulate the purge
      ansible.builtin.shell: >-
        apt-get -s purge {{ rocm_pkgs.stdout_lines | join(' ') }} | grep '^Purg ' | awk '{print $2}' | sort
      register: rocm_sim
      changed_when: false
      check_mode: false
      when: rocm_pkgs.stdout_lines | length > 0

    - name: Refuse if the purge would take anything that is not ROCm
      ansible.builtin.assert:
        that: (rocm_sim.stdout_lines | reject('match', rocm_family) | reject('match', rocm_allowed_extra) | list | length) == 0
        fail_msg: >-
          The purge would also remove: {{ rocm_sim.stdout_lines | reject('match', rocm_family) | reject('match', rocm_allowed_extra) | join(' ') }}.
          Look at why before going on.
      when: rocm_pkgs.stdout_lines | length > 0

    - name: Purge the stack
      ansible.builtin.apt:
        name: "{{ rocm_pkgs.stdout_lines }}"
        state: absent
        purge: true
        autoremove: false
      when: rocm_pkgs.stdout_lines | length > 0

    - name: Remove the empty ROCm directories and the leftover linker entry
      ansible.builtin.shell: >-
        rm -rf /opt/rocm-6.4.3 /opt/rocm /etc/ld.so.conf.d/10-rocm-opencl.conf /etc/ld.so.conf.d/rocm.conf && ldconfig
      changed_when: true
      # lint-check-mode: ignore (clean-up of leftovers after the package purge; skipped in a dry run by the shell module)

    - name: Show disk free afterwards
      ansible.builtin.command: df -h /
      register: rocm_df
      changed_when: false
      check_mode: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ rocm_df.stdout_lines }}"
