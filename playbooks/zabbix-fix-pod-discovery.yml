---
# Repair Kubernetes pod discovery on the "Kubernetes cluster state by HTTP"
# template, which has produced zero working pod items since it was linked.
#
# The defect is a mismatch inside the template itself. Its "Pod discovery" LLD
# rule declares these macro paths:
#
#     {#NAMESPACE} -> $.labels.namespace
#     {#NAME}      -> $.labels.pod
#
# ...while its item prototypes use a key of:
#
#     kube.pod.get[{#NAMESPACE}/{#POD}]
#
# {#POD} is never declared, so it is not substituted - it stays LITERAL. Every
# pod in a namespace therefore resolves to the same key, the first one wins,
# and every subsequent pod fails with "item with the same key already exists".
# The LLD rule itself ends up in an error state, and the host is left with one
# permanently-unsupported item per namespace (19 of them, 152 items) instead of
# one working item per pod.
#
# kube-state-metrics is NOT at fault: it emits the pod label correctly, checked
# against the live endpoint -
#     kube_pod_start_time{namespace="...",pod="...",uid="..."}
#
# This is fallout from the nodes-by-HTTP -> cluster-state swap (d12cfc2). The
# OLD template declared {#POD} -> $.name, so prototypes written against it
# resolved; the replacement declares {#NAME} instead and the prototypes were
# never updated to match.
#
# Fix chosen: ADD {#POD} -> $.labels.pod alongside the existing paths, rather
# than rewriting every prototype from {#POD} to {#NAME}. Both make the same
# data resolve, but this one is a single additive change to one object, needs
# no permissions on item prototypes, and leaves the template's own prototypes
# byte-identical to what Zabbix ships - so a future template update merges
# cleanly instead of conflicting with a local rewrite. The cost is one
# redundant macro: {#NAME} and {#POD} both resolve to the pod name.
#
# THIS EDITS A VENDOR TEMPLATE. A re-import of "Kubernetes cluster state by
# HTTP" will revert it and pod discovery will break again in exactly the same
# silent way. This play is idempotent - re-run it after any template import.
#
# The 152 stale literal-{#POD} items do not need cleaning up by hand: Pod
# discovery has lifetime=0 ("delete lost resources immediately"), so the first
# successful LLD pass after this change removes them as it creates the real
# ones.
#
# Usage:
#   ansible-playbook playbooks/zabbix-fix-pod-discovery.yml --check --diff
#   ansible-playbook playbooks/zabbix-fix-pod-discovery.yml

- name: Repair Kubernetes pod discovery macro paths
  hosts: localhost
  gather_facts: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "c4bceeafe968e48fd74a68fda821867cee967eb19a4cea615b2e47f1215ad939"

    template_name: "Kubernetes cluster state by HTTP"
    lld_key: "kube.pod.discovery"
    # !unsafe is required, not stylistic: "{#" opens a Jinja COMMENT, so a bare
    # "{#POD}" fails to template at all with "Missing end of comment tag" - the
    # variable never even resolves. Every LLD macro hits this.
    missing_macro: !unsafe "{#POD}"
    missing_macro_path: "$.labels.pod"

  tasks:
    - name: Find the Pod discovery rule on the template
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            output: ["itemid", "key_", "templateid"]
            selectLLDMacroPaths: "extend"
            selectHosts: ["host"]
            filter:
              key_: ["{{ lld_key }}"]
          id: 1
      register: lld_lookup
      check_mode: false
      failed_when: lld_lookup.json.error is defined

    - name: Select the template's own rule, not an inherited copy
      ansible.builtin.set_fact:
        # templateid == "0" means this is the definition rather than an
        # inherited instance. Updating an inherited copy on a host is rejected
        # by the API; the change has to be made on the template so it
        # propagates to every linked host.
        template_lld: >-
          {{ (lld_lookup.json.result
              | selectattr('hosts', 'defined')
              | selectattr('templateid', 'equalto', '0')
              | selectattr('hosts.0.host', 'equalto', template_name)
              | list | first) | default({}, true) }}

    - name: Assert the template rule was found
      ansible.builtin.assert:
        that:
          - template_lld.itemid is defined
        fail_msg: >-
          No LLD rule '{{ lld_key }}' found on template '{{ template_name }}'.
          Has the template been renamed or unlinked?
        success_msg: "Found {{ lld_key }} on {{ template_name }} (itemid {{ template_lld.itemid | default('?') }})."

    - name: Report the current macro paths
      ansible.builtin.debug:
        msg: >-
          {{ template_lld.lld_macro_paths | map(attribute='lld_macro') | list }}
          — {{ missing_macro }}
          {{ 'already present, nothing to do' if missing_macro in (template_lld.lld_macro_paths | map(attribute='lld_macro') | list) else 'MISSING, will be added' }}

    # lld_macro_paths REPLACES the whole list, so the existing entries have to
    # be sent back alongside the new one or they are silently dropped.
    - name: Add the missing macro path
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.update
          params:
            itemid: "{{ template_lld.itemid }}"
            lld_macro_paths: >-
              {{ template_lld.lld_macro_paths
                 + [{'lld_macro': missing_macro, 'path': missing_macro_path}] }}
          id: 1
      register: lld_update
      when: missing_macro not in (template_lld.lld_macro_paths | map(attribute='lld_macro') | list)
      failed_when: lld_update.json.error is defined
      changed_when: lld_update.json.result is defined

    - name: Re-read the rule to confirm
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            itemids: ["{{ template_lld.itemid }}"]
            output: ["itemid"]
            selectLLDMacroPaths: "extend"
          id: 1
      register: lld_verify
      check_mode: false
      failed_when: lld_verify.json.error is defined

    - name: Report the end state
      ansible.builtin.debug:
        msg: >-
          {{ template_name }} / {{ lld_key }} macros now:
          {{ lld_verify.json.result[0].lld_macro_paths
             | map(attribute='lld_macro') | list }}.
          Pod items rebuild on the next LLD pass; force it with
          "Execute now" on the rule if you do not want to wait.
