---
# Bump k8s-worker-2 to the latest available NVIDIA driver branch (610) and
# CUDA toolkit (13.3).
#
# Usage:
#   ansible-playbook playbooks/k8s-worker-2-nvidia-latest.yml --check --diff
#   ansible-playbook playbooks/k8s-worker-2-nvidia-latest.yml
#
# Background (2026-08-29): playbooks/fix-k8s-worker-2-nvidia.yml got this
# host from a driver-less kernel back to a working 580.178.04. This playbook
# goes further, to the newest driver branch (610) and CUDA toolkit (13.3)
# actually installable today.
#
# Two things worth understanding before running this:
#
# 1. NVIDIA's `cuda-drivers` tracking meta-package is currently BROKEN for
#    the 610 branch. It demands `nvidia-driver >= 610.57.04`, but no repo --
#    not even NVIDIA's own CUDA repo -- actually publishes concrete 610.57.04
#    packages yet (apt: "some required packages have not yet been created or
#    been moved out of Incoming"). The only place 610-branch packages exist
#    at all right now is Ubuntu's OWN archive (noble-updates/noble-security,
#    multiverse), at 610.43.02 -- a different version, from a different repo,
#    with different package versioning ("-0ubuntu0.24.04.1" vs the CUDA
#    repo's "-1ubuntu1" scheme). `cuda-drivers` can't be satisfied by either
#    version, so it (and `cuda-drivers-580`, `cuda-13-0`, `cuda-runtime-13-0`)
#    get REMOVED as an unavoidable side effect of moving branches. This is
#    the same cross-repo version-scheme clash documented in
#    fix-k8s-worker-2-nvidia.yml, resurfacing one branch further up.
#    Functionally nothing is lost -- the driver, dkms module, and utilities
#    all install fine under their explicit `*-610` names -- only the generic
#    bookkeeping meta-package goes away.
# 2. CUDA toolkit 13.3 (`cuda-toolkit-13-3`) is fully decoupled from the
#    driver at the apt level (Depends only on other cuda-toolkit-13-3-*
#    packages) and installs standalone with zero removals regardless of
#    driver branch.
#
# Simulated 2026-08-29: driver 610.43.02 (pinned explicitly, bypassing the
# broken `cuda-drivers`/`nvidia-open` meta packages) + cuda-toolkit-13-3
# together resolve with exactly 17 removals, all superseded 580-branch
# packages -- see pve_ai_610_expected_removals below. Nothing outside that
# list.
#
# This playbook DOES reload the kernel module live, deliberately, and does
# NOT reboot. The original design deferred module activation to "the next
# reboot," reasoning the old 580 module would keep serving traffic
# undisturbed in the meantime. That reasoning was wrong: installing new
# userspace libraries (libnvidia-compute-610 etc.) replaces the .so files
# ldconfig serves IMMEDIATELY, while the OLD kernel module stays loaded --
# so nvidia-smi/NVML (and anything linking libnvidia-ml.so: gpu-operator's
# device-plugin, dcgm-exporter) break with a "Driver/library version
# mismatch" the moment the packages are unpacked, reboot or not. There is no
# version of this upgrade that avoids a brief GPU interruption; the only
# choice is whether it's a controlled reload (confirmed no process holds
# /dev/nvidia* open first) or an unverified gap until whenever someone next
# reboots the host. This playbook does the former.
#
# Discovered the hard way, 2026-08-29: the first real run hit a genuine
# Ubuntu packaging gap -- libnvidia-gl-610 ships a file already owned by
# libnvidia-egl-xcb1 (orphaned once the old 580 stack is removed) without
# declaring Replaces against it, so dpkg aborted mid-unpack, leaving
# nvidia-driver-610-open/nvidia-dkms-610-open "unpacked" but never
# configured (no dkms build triggered) -- while the userspace libs that HAD
# unpacked already broke nvidia-smi. Both orphaned EGL packages have zero
# reverse dependencies (verified via `apt-cache rdepends --installed`), so
# this playbook removes them before installing, and runs
# `dpkg --configure -a` first to repair that exact half-unpacked state if
# it's already been hit.

- name: Bump k8s-worker-2 to the latest NVIDIA driver and CUDA toolkit
  hosts: "{{ nvidia_latest_hosts | default('k8s-worker-2.home.lan') }}"
  become: true
  vars:
    nvidia_latest_driver_pkg: nvidia-driver-610-open
    nvidia_latest_driver_version: 610.43.02-0ubuntu0.24.04.1
    nvidia_latest_toolkit_pkg: cuda-toolkit-13-3
    # Packages this branch bump is known to remove -- confirmed by
    # simulation before writing this playbook. Anything removed OUTSIDE this
    # list means the dependency resolution shifted since, and the playbook
    # should stop rather than proceed blind.
    nvidia_latest_expected_removals:
      - cuda-13-0
      - cuda-drivers
      - cuda-drivers-580
      - cuda-runtime-13-0
      - nvidia-driver-580-open
      - xserver-xorg-video-nvidia-580
      - libnvidia-encode-580
      - libnvidia-gl-580
      - libnvidia-compute-580
      - libnvidia-decode-580
      - nvidia-persistenced
      - libnvidia-cfg1-580
      - libnvidia-egl-gbm1
      - libnvidia-fbc1-580
      - nvidia-dkms-580-open
      - nvidia-kernel-common-580
      - nvidia-kernel-source-580-open

  tasks:
    - name: Record the running kernel
      ansible.builtin.command: uname -r
      register: nvidia_latest_kernel
      changed_when: false
      check_mode: false

    - name: Record what currently uses the GPU
      # Informational only. This host actively serves LiteLLM/Ollama; a
      # busy GPU right now is a reason to pick a quieter moment, not a
      # reason for this playbook to behave differently.
      ansible.builtin.command:
        cmd: nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader
      register: nvidia_latest_gpu_users
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refresh apt metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Remove orphaned EGL platform packages that conflict with libnvidia-gl-610
      # Found the hard way, mid-incident, 2026-08-29: libnvidia-gl-610 ships
      # /usr/share/egl/egl_external_platform.d/20_nvidia_xcb.json, the same
      # path libnvidia-egl-xcb1 already owns, and does not declare Replaces
      # against it -- an Ubuntu packaging gap, not something on this host.
      # dpkg refuses to overwrite a file it doesn't own, aborting the WHOLE
      # unpack batch (leaving nvidia-driver-610-open/nvidia-dkms-610-open
      # stuck at "unpacked", never configured, no dkms build triggered) --
      # while cuda-toolkit-13-3's userspace libs (already unpacked earlier in
      # the same batch) left nvidia-smi reporting "Driver/library version
      # mismatch" against the still-loaded 580 kernel module. Confirmed via
      # `apt-cache rdepends --installed` that nothing else depends on either
      # package, so removing them is safe on any branch, not just 610.
      #
      # Runs BEFORE the simulate/assert step below, not after: the first
      # real run of this playbook failed mid-transaction and left the host
      # with nvidia-driver-610-open "already the newest version" yet
      # dependency-broken (libnvidia-gl-610 unconfigured). Simulating against
      # that broken baseline just reports "already newest" + unmet
      # dependencies, not a useful preview -- the repair has to happen first
      # so the simulate step (and the real install after it) run against a
      # clean baseline, exactly like a first-ever run would see.
      #
      # Uses `dpkg --remove` directly, NOT the `apt` module (`apt-get
      # remove`): once the host is in this broken state, `apt-get remove`
      # itself refuses to run at all -- "E: Unmet dependencies" blocks any
      # apt-level transaction system-wide, even one unrelated to the broken
      # packages, unless you pass --fix-broken. dpkg has no such whole-system
      # check; it only verifies nothing installed depends on the package
      # being removed, which is exactly the property already confirmed via
      # `apt-cache rdepends --installed` for both packages.
      ansible.builtin.command: "dpkg --remove {{ item }}"
      loop:
        - libnvidia-egl-xcb1
        - libnvidia-egl-xlib1
      register: nvidia_latest_egl_removal
      changed_when: "'Removing' in nvidia_latest_egl_removal.stdout"
      failed_when: >-
        nvidia_latest_egl_removal.rc != 0
        and 'not installed' not in nvidia_latest_egl_removal.stderr

    - name: Resolve the broken dependency state left by the earlier failed unpack
      # Removing the two orphans above clears the FILE conflict, but
      # libnvidia-gl-610 itself is still "not-installed" (its unpack failed
      # outright, it never even got to half-installed) and
      # nvidia-driver-610-open/nvidia-dkms-610-open are stuck "unpacked" but
      # unconfigured. `apt --fix-broken install` is apt's explicit repair
      # entrypoint for exactly this -- it re-attempts the failed unpack (now
      # unobstructed) and configures everything left pending, including
      # triggering the dkms build via nvidia-driver-610-open's postinst.
      ansible.builtin.command: apt-get install -f -y
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: nvidia_latest_fix_broken
      changed_when: "'Setting up' in nvidia_latest_fix_broken.stdout"

    - name: Finish configuring anything still left half-unpacked
      # Safety net; should be a no-op after the fix-broken install above.
      ansible.builtin.command: dpkg --configure -a
      register: nvidia_latest_dpkg_configure
      changed_when: "'Setting up' in nvidia_latest_dpkg_configure.stdout"
      failed_when: false

    - name: Simulate the combined driver + toolkit install
      ansible.builtin.command:
        cmd: >-
          apt-get -s -o Debug::NoLocking=1 install
          {{ nvidia_latest_driver_pkg }}={{ nvidia_latest_driver_version }}
          {{ nvidia_latest_toolkit_pkg }}
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: nvidia_latest_sim
      changed_when: false
      check_mode: false

    - name: Compute which removals (if any) fall outside the expected list
      # Precomputed once into a fact rather than repeated inline in the
      # assert's `that` and `fail_msg` -- an earlier version duplicated this
      # filter chain in both places and the two somehow evaluated
      # differently (assert saw a non-empty list, fail_msg rendered empty),
      # which pointed at a YAML folded-scalar/Jinja quirk rather than a real
      # dependency shift. A single fact removes the chance of the two
      # diverging again.
      ansible.builtin.set_fact:
        nvidia_latest_unexpected_removals: >-
          {{ nvidia_latest_sim.stdout_lines
             | select('match', '^Remv ')
             | map('regex_replace', '^Remv (\S+).*', '\1')
             | reject('in', nvidia_latest_expected_removals)
             | list }}

    - name: Refuse to proceed if anything outside the expected list would be removed
      ansible.builtin.assert:
        that: nvidia_latest_unexpected_removals | length == 0
        fail_msg: >-
          Simulation would remove packages NOT on the expected list:
          {{ nvidia_latest_unexpected_removals | join(', ') }}.
          Refusing -- dependency resolution has shifted since this playbook
          was written; re-verify before proceeding.

    - name: Install the driver and CUDA toolkit
      ansible.builtin.apt:
        name:
          - "{{ nvidia_latest_driver_pkg }}={{ nvidia_latest_driver_version }}"
          - "{{ nvidia_latest_toolkit_pkg }}"
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: nvidia_latest_install

    - name: Verify dpkg is clean
      ansible.builtin.command: dpkg --audit
      register: nvidia_latest_audit
      changed_when: false
      check_mode: false
      failed_when: nvidia_latest_audit.stdout | trim != ''

    - name: Read dkms state
      ansible.builtin.command: dkms status
      register: nvidia_latest_dkms
      changed_when: false
      check_mode: false

    - name: Require a 610 dkms build for the RUNNING kernel
      when: not ansible_check_mode
      ansible.builtin.assert:
        that: >-
          nvidia_latest_dkms.stdout_lines
          | select('search', nvidia_latest_kernel.stdout | trim)
          | select('search', 'installed')
          | select('search', '610')
          | list | length > 0
        fail_msg: >-
          No 610-branch dkms build for {{ nvidia_latest_kernel.stdout | trim }}
          after install. dkms status: {{ nvidia_latest_dkms.stdout | trim }}.

    - name: Check which module is actually loaded right now
      ansible.builtin.command:
        cmd: modinfo -F version nvidia
      register: nvidia_latest_loaded_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Confirm nothing currently holds the GPU device open
      # Installing new userspace libs (libnvidia-compute-610 etc.) already
      # breaks nvidia-smi/NVML immediately -- ldconfig picks up the new .so
      # files right away, while the OLD kernel module stays resident until
      # reloaded. There is no "defer to next reboot" option that avoids this:
      # nvidia-smi and anything linking libnvidia-ml.so (gpu-operator's
      # device-plugin, dcgm-exporter) are already mismatched the moment this
      # install finishes. Reload the module now, but only once confirmed
      # nothing has an open handle on it.
      ansible.builtin.command: fuser /dev/nvidia0 /dev/nvidiactl /dev/nvidia-uvm
      register: nvidia_latest_fuser
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to reload the kernel module while something holds the GPU open
      when: not ansible_check_mode
      ansible.builtin.assert:
        that: nvidia_latest_fuser.stdout | trim == ''
        fail_msg: >-
          GPU device still has open handles: {{ nvidia_latest_fuser.stdout | trim }}.
          Not unloading the kernel module while it's in use. nvidia-smi is
          ALREADY mismatched at this point (new userspace libs installed,
          old module still loaded) -- stop whatever holds the device open,
          then re-run this playbook to complete the reload.

    - name: Unload the old nvidia kernel modules
      # Leaf-first: nvidia_drm depends on nvidia_modeset; nvidia_uvm and
      # nvidia_modeset both depend on nvidia itself. Confirmed this exact
      # order via `lsmod` before writing this task.
      ansible.builtin.command: "modprobe -r {{ item }}"
      loop:
        - nvidia_drm
        - nvidia_modeset
        - nvidia_uvm
        - nvidia
      when: not ansible_check_mode
      register: nvidia_latest_unload
      changed_when: nvidia_latest_unload.rc == 0
      failed_when: false

    - name: Load the new nvidia kernel module
      ansible.builtin.command: modprobe nvidia
      when: not ansible_check_mode
      register: nvidia_latest_load
      changed_when: nvidia_latest_load.rc == 0

    - name: Query the GPU after the reload
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      when: not ansible_check_mode
      register: nvidia_latest_smi
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require nvidia-smi to succeed and report the new branch
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - nvidia_latest_smi.rc == 0
          - "'610.43.02' in nvidia_latest_smi.stdout"
        fail_msg: >-
          nvidia-smi after reload: rc={{ nvidia_latest_smi.rc }}
          stdout={{ nvidia_latest_smi.stdout | trim }}
          stderr={{ nvidia_latest_smi.stderr | trim }}.
          The GPU is NOT confirmed working -- do not assume success.

    - name: Report
      ansible.builtin.debug:
        msg:
          - "kernel:        {{ nvidia_latest_kernel.stdout | trim }}"
          - "GPU users before install: {{ nvidia_latest_gpu_users.stdout | trim | default('(none)', true) }}"
          - "dkms 610 build: {{ nvidia_latest_dkms.stdout_lines | select('search', nvidia_latest_kernel.stdout | trim) | select('search', '610') | join('; ') | default('none', true) }}"
          - "nvidia-smi after reload: {{ nvidia_latest_smi.stdout | trim | default('(check mode -- not attempted)', true) }}"
