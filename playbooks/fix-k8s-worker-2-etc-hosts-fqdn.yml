---
# Fix k8s-worker-2's `hostname -f` returning the short name instead of the FQDN.
#
# WHY, and it's worse than just ordering: /etc/hosts on this host has
# `10.0.5.4 k8s-worker-2 k8s-worker-2.home.lan` - and 10.0.5.4 is not this
# host at all, it's pve.home.lan's actual IP (confirmed against inventory.ini
# ansible_host). This host's real address is 10.2.5.4 (matches its own
# ansible_host, and the convention k8s-master/k8s-worker both use - each
# lists its OWN k8s-network IP, FQDN first, short name second). So this
# is a stale/wrong hostname-to-IP mapping, not merely a canonical-name
# ordering quirk - the wrong-IP line has to be removed outright, not just
# reordered, or two conflicting lines for "k8s-worker-2" would coexist.
# Separately, glibc's canonical-name resolution (getaddrinfo with
# AI_CANONNAME, which `hostname -f`/`--fqdn` uses) returns whichever name
# appears FIRST on the matching line as canonical regardless of which one is
# actually the FQDN - so even setting the IP right, name order still matters
# and must follow the same FQDN-first convention as the other two nodes.
#
# Surfaced 2026-09-27 setting up OOM-kill monitoring
# (playbooks/oom-kill-monitor.yml): none of the three RKE2 nodes carry a
# host-level Zabbix agent, so the monitoring script's Zabbix-hostname
# resolution falls through to `hostname -f`. On k8s-worker-2 that means
# every value would be pushed under the wrong host name ("k8s-worker-2"
# instead of "k8s-worker-2.home.lan", the actual registered Zabbix host) and
# silently discarded forever - the exact failure mode this whole section's
# scripts already warn about repeatedly.
#
# THIS IS NOT fix-k8s-master-hostname.yml's situation - much smaller in
# scope. That playbook changed the actual OS hostname (`hostname` itself)
# to match the Kubernetes node name, which required restarting rke2-server
# because RKE2's cloud provider stamps status.addresses[Hostname] from the
# OS hostname. Here, `hostname` alone is ALREADY correct
# ("k8s-worker-2.home.lan", verified live) - only the /etc/hosts canonical-
# name ORDER is wrong. No RKE2 restart, no node identity change, no cluster
# impact: `metadata.name`/the Kubernetes node name come from RKE2's own
# node-name / the OS hostname via gethostname(), never from /etc/hosts
# canonicalization.
#
# Usage:
#   ansible-playbook playbooks/fix-k8s-worker-2-etc-hosts-fqdn.yml --check --diff
#   ansible-playbook playbooks/fix-k8s-worker-2-etc-hosts-fqdn.yml

- name: Fix k8s-worker-2's /etc/hosts FQDN ordering
  hosts: k8s-worker-2.home.lan
  become: true

  vars:
    target_fqdn: k8s-worker-2.home.lan
    target_short: k8s-worker-2

  tasks:
    - name: Confirm the OS hostname is already correct (not this playbook's job to fix)
      ansible.builtin.command: hostname
      register: os_hostname
      changed_when: false
      check_mode: false

    - name: Refuse to run if the OS hostname itself is wrong
      ansible.builtin.assert:
        that:
          - os_hostname.stdout | trim == target_fqdn
        fail_msg: >-
          `hostname` returned "{{ os_hostname.stdout | trim }}", not
          "{{ target_fqdn }}". This playbook only reorders /etc/hosts - a
          wrong OS hostname is a different, bigger problem (see
          fix-k8s-master-hostname.yml for that class of fix). Refusing.
        success_msg: "OS hostname confirmed correct ({{ target_fqdn }})."

    - name: Remove the stale line mapping this host's names to a different host's IP
      ansible.builtin.lineinfile:
        path: /etc/hosts
        # Matches by NAME, not IP - the whole point is this line's IP is
        # wrong, so anchoring on ansible_host would never find it (that's
        # exactly what happened on the first --check run of this playbook:
        # the wrong-IP line was left untouched and a second, correct line
        # got appended instead, leaving both present).
        regexp: '^\S+\s+{{ target_short }}\s+{{ target_fqdn }}\s*$'
        state: absent
        backup: true

    - name: Ensure the correct line exists, FQDN first
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ ansible_host }}\s'
        line: "{{ ansible_host }} {{ target_fqdn }} {{ target_short }}"
        state: present

    - name: Confirm hostname -f now returns the FQDN
      ansible.builtin.command: hostname -f
      register: fqdn_check
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Assert the fix landed
      ansible.builtin.assert:
        that:
          - fqdn_check.stdout | trim == target_fqdn
        fail_msg: >-
          `hostname -f` still returns "{{ fqdn_check.stdout | trim }}" after
          the /etc/hosts edit, not "{{ target_fqdn }}". Something else (DNS,
          NSS ordering) may be overriding /etc/hosts here.
        success_msg: "hostname -f now correctly returns {{ target_fqdn }}."
      when: not ansible_check_mode

    - name: Read back every /etc/hosts line mentioning this host's names
      ansible.builtin.command: "grep -E '\\b({{ target_fqdn }}|{{ target_short }})\\b' /etc/hosts"
      register: all_matching_lines
      changed_when: false
      check_mode: false

    - name: Confirm exactly one line remains, with the correct IP
      ansible.builtin.assert:
        that:
          - all_matching_lines.stdout_lines | length == 1
          - all_matching_lines.stdout_lines[0].startswith(ansible_host)
        fail_msg: >-
          Expected exactly one /etc/hosts line for this host, starting with
          {{ ansible_host }}. Found: {{ all_matching_lines.stdout_lines }}.
          A leftover stale entry (or a second one this playbook doesn't
          know about) may still be present.
        success_msg: "Exactly one, correct /etc/hosts entry remains: {{ all_matching_lines.stdout_lines[0] }}"
