---
# Configure Zabbix items and triggers for SMART monitoring
#
# Usage:
#   ansible-playbook playbooks/smart-monitor-zabbix-setup.yml

- name: Configure Zabbix for SMART monitoring
  hosts: localhost
  gather_facts: false

  vars:
    zabbix_url: "https://zabbix.home.lan:8443"
    zabbix_api_token: "c4bceeafe968e48fd74a68fda821867cee967eb19a4cea615b2e47f1215ad939"
    zabbix_validate_certs: false

    pve_hosts:
      - name: pve.home.lan
        visible_name: PVE
        ip_address: 10.0.5.4
        drives: [sda, sdb, sdc, sdd, sde, sdf, sdg]
      - name: pve-ai.home.lan
        visible_name: PVE-AI
        ip_address: 10.0.5.3
        drives: [nvme0]

  tasks:
    - name: Get/create Proxmox host group
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            filter:
              name: Proxmox
          auth: "{{ zabbix_api_token }}"
          id: 1
      register: hostgroup_result

    - name: Debug hostgroup_result
      ansible.builtin.debug:
        var: hostgroup_result
        verbosity: 1

    - name: Create Proxmox host group if not exists
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: hostgroup.create
          params:
            name: Proxmox
          auth: "{{ zabbix_api_token }}"
          id: 1
      when: "hostgroup_result.get('json', {}).get('result', []) | length == 0"

    - name: Get Proxmox host group ID
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            filter:
              name: Proxmox
          auth: "{{ zabbix_api_token }}"
          id: 1
      register: hostgroup_get
      until: (hostgroup_get.content | from_json).result | length > 0
      retries: 3
      delay: 1

    - name: Create/update PVE hosts in Zabbix
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: host.create
          params:
            host: "{{ pve_host.name }}"
            visible_name: "{{ pve_host.visible_name }}"
            groups:
              - groupid: "{{ (hostgroup_get.content | from_json).result[0].groupid }}"
            interfaces:
              - type: 1
                main: 1
                useip: 1
                ip: "{{ pve_host.ip_address }}"
                dns: "{{ pve_host.name }}"
                port: 10050
          auth: "{{ zabbix_api_token }}"
          id: 1
        status_code: [200]
      loop: "{{ pve_hosts }}"
      loop_control:
        loop_var: pve_host
      register: host_create_result
      failed_when: false

    - name: Extract host IDs
      set_fact:
        host_ids: "{{ host_ids | default({}) | combine({item.pve_host.name: (item.content | from_json).result.hostids[0]}) }}"
      loop: "{{ host_create_result.results }}"
      when: "item.content and ('result' in (item.content | from_json)) and ('hostids' in (item.content | from_json).result)"

    - name: Get existing host IDs if create failed
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            filter:
              host: "{{ pve_host.name }}"
          auth: "{{ zabbix_api_token }}"
          id: 1
      loop: "{{ pve_hosts }}"
      loop_control:
        loop_var: pve_host
      register: existing_hosts_result
      when: pve_host.name not in (host_ids | default({}))

    - name: Update host_ids with existing hosts
      set_fact:
        host_ids: "{{ host_ids | default({}) | combine({item.pve_host.name: (item.content | from_json).result[0].hostid}) }}"
      loop: "{{ existing_hosts_result.results }}"
      when: "item.content and ((item.content | from_json).result | length > 0)"

    - name: Create SMART status items
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            name: "SMART status"
            key_: "smart.status"
            hostid: "{{ host_ids[pve_host.name] }}"
            type: 2
            value_type: 3
          auth: "{{ zabbix_api_token }}"
          id: 1
      loop: "{{ pve_hosts }}"
      loop_control:
        loop_var: pve_host
      failed_when: false

    - name: Create per-drive SMART items for PVE
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            name: "{{ item.name }}"
            key_: "{{ item.key }}"
            hostid: "{{ host_ids['pve.home.lan'] }}"
            type: 2
            value_type: 3
            units: "{{ item.units | default('') }}"
          auth: "{{ zabbix_api_token }}"
          id: 1
      vars:
        items:
          - name: "SMART status - sda"
            key: "smart.drive.sda.status"
          - name: "SMART temperature - sda"
            key: "smart.drive.sda.temperature"
            units: "°C"
          - name: "SMART failed attributes - sda"
            key: "smart.drive.sda.failed_attrs"
          - name: "SMART status - sdb"
            key: "smart.drive.sdb.status"
          - name: "SMART temperature - sdb"
            key: "smart.drive.sdb.temperature"
            units: "°C"
          - name: "SMART failed attributes - sdb"
            key: "smart.drive.sdb.failed_attrs"
          - name: "SMART status - sdc"
            key: "smart.drive.sdc.status"
          - name: "SMART temperature - sdc"
            key: "smart.drive.sdc.temperature"
            units: "°C"
          - name: "SMART failed attributes - sdc"
            key: "smart.drive.sdc.failed_attrs"
          - name: "SMART status - sdd"
            key: "smart.drive.sdd.status"
          - name: "SMART temperature - sdd"
            key: "smart.drive.sdd.temperature"
            units: "°C"
          - name: "SMART failed attributes - sdd"
            key: "smart.drive.sdd.failed_attrs"
          - name: "SMART status - sde"
            key: "smart.drive.sde.status"
          - name: "SMART temperature - sde"
            key: "smart.drive.sde.temperature"
            units: "°C"
          - name: "SMART failed attributes - sde"
            key: "smart.drive.sde.failed_attrs"
          - name: "SMART status - sdf"
            key: "smart.drive.sdf.status"
          - name: "SMART temperature - sdf"
            key: "smart.drive.sdf.temperature"
            units: "°C"
          - name: "SMART failed attributes - sdf"
            key: "smart.drive.sdf.failed_attrs"
          - name: "SMART status - sdg"
            key: "smart.drive.sdg.status"
          - name: "SMART temperature - sdg"
            key: "smart.drive.sdg.temperature"
            units: "°C"
          - name: "SMART failed attributes - sdg"
            key: "smart.drive.sdg.failed_attrs"
      loop: "{{ items }}"
      failed_when: false

    - name: Create per-drive SMART items for PVE-AI
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            name: "{{ item.name }}"
            key_: "{{ item.key }}"
            hostid: "{{ host_ids['pve-ai.home.lan'] }}"
            type: 2
            value_type: 3
            units: "{{ item.units | default('') }}"
          auth: "{{ zabbix_api_token }}"
          id: 1
      vars:
        items:
          - name: "SMART status - nvme0"
            key: "smart.drive.nvme0.status"
          - name: "SMART temperature - nvme0"
            key: "smart.drive.nvme0.temperature"
            units: "°C"
          - name: "SMART failed attributes - nvme0"
            key: "smart.drive.nvme0.failed_attrs"
      loop: "{{ items }}"
      failed_when: false

    - name: Create SMART failure triggers
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: trigger.create
          params:
            description: "SMART drive failure on {{ pve_host.name }}"
            expression: "last(/{{ pve_host.name }}/smart.status)=1"
            severity: 4
          auth: "{{ zabbix_api_token }}"
          id: 1
      loop: "{{ pve_hosts }}"
      loop_control:
        loop_var: pve_host
      failed_when: false

    - name: Create SMART error triggers
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        validate_certs: "{{ zabbix_validate_certs }}"
        body:
          jsonrpc: "2.0"
          method: trigger.create
          params:
            description: "SMART monitoring error on {{ pve_host.name }}"
            expression: "last(/{{ pve_host.name }}/smart.status)=2"
            severity: 3
          auth: "{{ zabbix_api_token }}"
          id: 1
      loop: "{{ pve_hosts }}"
      loop_control:
        loop_var: pve_host
      failed_when: false

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: |
          ✓ Zabbix SMART monitoring setup complete!

          Created/Updated hosts:
          - pve.home.lan (7 drives: sda-sdg)
          - pve-ai.home.lan (1 drive: nvme0)

          Items created per host:
          - smart.status (overall health)
          - smart.drive.{device}.status (per-drive)
          - smart.drive.{device}.temperature (per-drive, in °C)
          - smart.drive.{device}.failed_attrs (per-drive)

          Triggers created per host:
          - SMART drive failure (High severity)
          - SMART monitoring error (Medium severity)

          Verify in Zabbix frontend:
          1. Configuration > Hosts > select host
          2. Items tab: should see all SMART items
          3. Monitoring > Problems: view active triggers
