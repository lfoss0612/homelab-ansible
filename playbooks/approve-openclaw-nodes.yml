---
# Approves pending OpenClaw pairing requests. Explicit invocation only — never
# included from deploy-openclaw.yml or update-openclaw.yml. Auto-approves only
# entries whose displayName matches an openclaw_nodes inventory hostname (nodes
# are started with --display-name {{ inventory_hostname }}, so the two should
# always agree); anything else — non-infrastructure devices like phone clients,
# for example — is reported but left untouched for a human to look at.
#
# pve-router joined openclaw_nodes 2026-08-04, so its already-registered node
# (previously reported-unmatched here since it predates this repo managing it)
# will now auto-match and auto-approve like any other host.
#
# There are TWO pending queues, and a node onboarding hits the second one:
#
#   1. `openclaw nodes status --json` → nodes[] with approvalState
#      "pending-approval"/"pending-reapproval" → `openclaw nodes approve <id>`.
#      This is an ALREADY-KNOWN node re-declaring capabilities.
#   2. `openclaw devices list --json` → pending[] → `openclaw devices approve <id>`.
#      This is a FIRST-TIME pairing. A brand-new node does not appear in
#      `nodes status` at all until it is approved, so a playbook that reads only
#      queue 1 silently reports "nothing to approve" while the new node sits in
#      a crash loop logging "device pairing required (requestId: ...)".
#
# Verified live on 2026-08-02 while onboarding desktop.home.lan, which was
# invisible to queue 1 and sitting in queue 2. Both are handled below.
#
# Verified against real output from `openclaw nodes status --json` on
# 2026-08-01 (gateway 2026.7.1-2): re-approval requests live here, not in
# `devices list --json` (which only shows already-paired devices with empty
# "pending": []). The field names are approvalState ("pending-approval" /
# "pending-reapproval" / "unapproved" / "approved"), displayName, and
# pendingRequestId — approved via `openclaw nodes approve <pendingRequestId>`
# (a different subcommand from `openclaw devices approve`, which the CLI
# itself rejects for this kind of request with "No pending device request
# matches ... Run openclaw nodes approve <id>"). An earlier version of this
# playbook guessed a different, wrong schema (devices list --json's
# role/status/id) that was never exercised for real; this one replaces it.
#
# Also observed live: most already-paired devices auto-resolve a
# "pending-reapproval" state (new capability declaration on an existing
# device) within a couple of minutes with no action needed — likely the
# gateway's own channel-connect-grace window. A "pending-approval" state
# (this device's first pairing-like request since the upgrade) did not
# auto-resolve and expired back to "unapproved"; restarting openclaw-node on
# that host generated a fresh pendingRequestId for this playbook to approve.
#
# Dry-run by default — prints what it would approve. Pass
# -e openclaw_approve_confirm=true to actually approve.
#
# Usage:
#   ansible-playbook playbooks/approve-openclaw-nodes.yml
#   ansible-playbook playbooks/approve-openclaw-nodes.yml -e openclaw_approve_confirm=true

- name: Approve pending OpenClaw node capability-reapproval requests
  hosts: openclaw_gateway
  gather_facts: false
  become: true

  vars:
    openclaw_approve_confirm: false

  # gateway.auth.token resolves as {"source": "env", "id":
  # "OPENCLAW_GATEWAY_AUTH_TOKEN"} (openclaw config get gateway.auth). That
  # var only exists inside openclaw-gateway.service's own process (injected
  # by an out-of-band systemd drop-in, /etc/systemd/system/openclaw-gateway.
  # service.d/override.conf -- not templated by this repo, same as any other
  # secret). A command run outside that unit -- which is exactly what every
  # task below does via become_user -- doesn't inherit it, so any CLI command
  # that needs gateway auth (approve/devices, not the read-only status query)
  # fails with "gateway.auth.token is configured as a secret reference but is
  # unavailable in this command path." openclaw_gateway_token (group_vars/
  # openclaw.yml, vault-encrypted) is the same value already confirmed live
  # 2026-08-04 -- reuse it here instead of touching the out-of-band drop-in.
  environment:
    OPENCLAW_GATEWAY_AUTH_TOKEN: "{{ openclaw_gateway_token }}"

  tasks:
    - name: Query node status from the gateway
      ansible.builtin.command: openclaw nodes status --json
      become_user: "{{ openclaw_user }}"
      register: openclaw_nodes_status_raw
      changed_when: false

    - name: Parse node status
      ansible.builtin.set_fact:
        openclaw_nodes_status: "{{ (openclaw_nodes_status_raw.stdout | from_json).nodes }}"

    - name: Collect all pending re-approval requests
      ansible.builtin.set_fact:
        openclaw_pending_all: >-
          {{ openclaw_nodes_status
             | selectattr('approvalState', 'defined')
             | selectattr('approvalState', 'in', ['pending-approval', 'pending-reapproval'])
             | list }}

    - name: Identify pending re-approval requests that match an inventory host
      ansible.builtin.set_fact:
        openclaw_pending_matched: >-
          {{ openclaw_pending_all
             | selectattr('displayName', 'defined')
             | selectattr('displayName', 'in', groups['openclaw_nodes'])
             | list }}
        openclaw_pending_unmatched: >-
          {{ (openclaw_pending_all | rejectattr('displayName', 'defined') | list)
             +
             (openclaw_pending_all | selectattr('displayName', 'defined')
              | rejectattr('displayName', 'in', groups['openclaw_nodes']) | list) }}

    - name: Report pending requests with no inventory match — left pending
      ansible.builtin.debug:
        msg: >-
          '{{ item.displayName | default('(no displayName)') }}' (requestId={{ item.pendingRequestId }})
          has no matching host in openclaw_nodes — not auto-approved; approve manually via
          `openclaw nodes approve {{ item.pendingRequestId }}` if expected.
      loop: "{{ openclaw_pending_unmatched }}"
      loop_control:
        label: "{{ item.displayName | default(item.pendingRequestId) }}"

    - name: Report matched pending requests
      ansible.builtin.debug:
        msg: >-
          {{ 'Approving' if openclaw_approve_confirm | bool else 'Would approve (dry-run)' }}
          '{{ item.displayName }}' (requestId={{ item.pendingRequestId }})
      loop: "{{ openclaw_pending_matched }}"
      loop_control:
        label: "{{ item.displayName }}"

    - name: Approve matched pending node requests
      ansible.builtin.command: "openclaw nodes approve {{ item.pendingRequestId }}"
      become_user: "{{ openclaw_user }}"
      loop: "{{ openclaw_pending_matched }}"
      loop_control:
        label: "{{ item.displayName }}"
      when: openclaw_approve_confirm | bool

    # --- Queue 2: first-time device pairings ---------------------------------
    # `devices list --json` returns {"pending": [...], "paired": [...]}. Entries
    # in pending[] use `requestId` (not `pendingRequestId`) and are approved with
    # `devices approve`, not `nodes approve` — the CLI rejects the wrong pairing
    # of subcommand and queue.
    - name: Query the device pairing queue from the gateway
      ansible.builtin.command: openclaw devices list --json
      become_user: "{{ openclaw_user }}"
      register: openclaw_devices_raw
      changed_when: false

    - name: Parse the device pairing queue
      ansible.builtin.set_fact:
        openclaw_devices_pending: "{{ (openclaw_devices_raw.stdout | from_json).pending | default([]) }}"

    - name: Split pending device pairings by inventory match
      ansible.builtin.set_fact:
        openclaw_devices_matched: >-
          {{ openclaw_devices_pending
             | selectattr('displayName', 'defined')
             | selectattr('displayName', 'in', groups['openclaw_nodes'])
             | list }}
        openclaw_devices_unmatched: >-
          {{ (openclaw_devices_pending | rejectattr('displayName', 'defined') | list)
             +
             (openclaw_devices_pending | selectattr('displayName', 'defined')
              | rejectattr('displayName', 'in', groups['openclaw_nodes']) | list) }}

    - name: Report pending device pairings with no inventory match — left pending
      ansible.builtin.debug:
        msg: >-
          '{{ item.displayName | default('(no displayName)') }}' from {{ item.remoteIp | default('?') }}
          (requestId={{ item.requestId }}) has no matching host in openclaw_nodes —
          not auto-approved. This is the queue a personal device lands in; approve
          by hand with `openclaw devices approve {{ item.requestId }}` only if you
          recognise it.
      loop: "{{ openclaw_devices_unmatched }}"
      loop_control:
        label: "{{ item.displayName | default(item.requestId) }}"

    - name: Report matched pending device pairings
      ansible.builtin.debug:
        msg: >-
          {{ 'Approving' if openclaw_approve_confirm | bool else 'Would approve (dry-run)' }}
          first-time pairing for '{{ item.displayName }}'
          ({{ item.remoteIp | default('?') }}, requestId={{ item.requestId }})
      loop: "{{ openclaw_devices_matched }}"
      loop_control:
        label: "{{ item.displayName }}"

    - name: Approve matched first-time device pairings
      ansible.builtin.command: "openclaw devices approve {{ item.requestId }}"
      become_user: "{{ openclaw_user }}"
      loop: "{{ openclaw_devices_matched }}"
      loop_control:
        label: "{{ item.displayName }}"
      when: openclaw_approve_confirm | bool
