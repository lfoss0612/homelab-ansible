---
- name: Ensure ACL support exists on all nodes
  # Excludes [api_managed] (OPNsense): those hosts use
  # ansible_connection: local, so tasks aimed at them would silently
  # succeed against the CONTROL NODE instead of failing. See inventory.ini.
  hosts: all:!api_managed
  become: yes

  tasks:

    - name: Confirm pve-router before installing/mutating packages
      ansible.builtin.include_tasks: ../tasks/confirm-pve-router.yml

    - name: Repair broken apt packages if needed
      # lint-check-mode: ignore (repairs packages (apt-get -f install); a real change)
      ansible.builtin.command:
        cmd: apt-get -f install -y
      changed_when: false
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install ACL package
      ansible.builtin.apt:
        name: acl
        state: present

    - name: Ensure ansible tmp directory exists
      ansible.builtin.file:
        path: /home/ansible/.ansible/tmp
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Verify setfacl exists
      # lint-check-mode: ignore (verifies the package this play installs; absent in a dry run)
      ansible.builtin.command: which setfacl
      register: setfacl_check
      changed_when: false

    - name: Verify getfacl exists
      # lint-check-mode: ignore (verifies the package this play installs; absent in a dry run)
      ansible.builtin.command: which getfacl
      register: getfacl_check
      changed_when: false

    - name: Show ACL tool paths
      ansible.builtin.debug:
        msg:
          - "setfacl: {{ setfacl_check.stdout }}"
          - "getfacl: {{ getfacl_check.stdout }}"
