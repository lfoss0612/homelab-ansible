---
# Bootstrap a `claude` diagnostic identity on zabbix.home.lan itself.
#
# Scope: zabbix.home.lan only, and deliberately separate from claude-user.yml's
# "cockpit only" policy (see docs/claude-access.md). That policy holds because
# cockpit is the Ansible control node - every other host is already reachable
# from there through reviewed playbooks, so a second account elsewhere would be
# redundant. This is an exception, not a reversal of that reasoning: the actual
# need here is real-time server-side Zabbix diagnostics - tailing
# zabbix_server.log while investigating - which an ansible-playbook run
# mediated through cockpit cannot do as well (a playbook task can run a
# command once and capture its output, but that is not the same as being able
# to read the live log directly while investigating).
#
# No sudo/root escalation at all: claude only ever escalates to the ansible
# user (on cockpit, for reviewed playbooks) - see docs/claude-access.md and
# docs/claude-access-enforcement.md. A previous version of this playbook also
# granted claude root escalation for two fixed, read-only `zabbix_server -R`
# commands (needed because zabbix_server.conf is 0600 root:root) - removed
# 2026-09-23 per policy: claude gets no root path anywhere, full stop, even a
# narrowly-scoped one. Re-running this playbook actively removes that grant
# from any host it was previously applied to.
#
# Runbook: docs/claude-access.md. Revoke with:
#   sudo userdel -r claude && sudo rm -f /etc/sudoers.d/claude

- name: Bootstrap claude user on the Zabbix server (diagnostic access only)
  hosts: "{{ claude_zabbix_hosts | default('zabbix.home.lan') }}"
  become: true
  remote_user: ansible
  gather_facts: true

  vars:
    claude_user: claude
    claude_pubkey_path: "{{ playbook_dir }}/../../keys/claude_ed25519.pub"
    # Same key, same source restriction as cockpit's claude-user.yml - one
    # identity, reused across the two hosts it is actually granted on.
    claude_key_from: "10.10.5.0/24"
    # zabbix_server.log is 0640 zabbix:zabbix (verified live) - group
    # membership alone gives read access, no sudo needed for that half.
    claude_extra_groups:
      - zabbix

  tasks:

    - name: Assert the public key exists on the control machine
      ansible.builtin.assert:
        that:
          - claude_pubkey_path is exists
        fail_msg: >-
          {{ claude_pubkey_path }} not found. This reuses the same keypair as
          claude-user.yml - generate it there first if it does not exist yet.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Ensure claude user exists (no sudo/wheel membership)
      ansible.builtin.user:
        name: "{{ claude_user }}"
        shell: /bin/bash
        create_home: true
        groups: "{{ claude_extra_groups }}"
        append: true
        comment: "Claude Code diagnostic identity (zabbix_server.log read-only; no sudo)"

    - name: Lock the password (key-only login)
      ansible.builtin.user:
        name: "{{ claude_user }}"
        password_lock: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ claude_user }}/.ssh"
        state: directory
        owner: "{{ claude_user }}"
        group: "{{ claude_user }}"
        mode: "0700"

    - name: Install authorized key for claude
      ansible.posix.authorized_key:
        user: "{{ claude_user }}"
        state: present
        key: "{{ lookup('file', claude_pubkey_path) }}"
        key_options: "{{ ('from=\"' ~ claude_key_from ~ '\"') if claude_key_from else '' }},no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-user-rc"
        exclusive: true

    # No sudoers rule for claude here at all -- see the header comment. This
    # actively removes any grant a previous run of this playbook left behind,
    # rather than just not creating a new one.
    - name: Remove any sudoers rule previously granted to claude
      ansible.builtin.file:
        path: /etc/sudoers.d/claude
        state: absent

    - name: Verify claude can read the server log via group membership
      ansible.builtin.command: >-
        runuser -u {{ claude_user }} -- tail -n1 /var/log/zabbix/zabbix_server.log
      changed_when: false
      register: claude_log_check
      failed_when: claude_log_check.rc != 0

    - name: Report log read check
      ansible.builtin.debug:
        msg: "claude can read zabbix_server.log: {{ claude_log_check.stdout }}"

    # Positive proof of the policy this playbook exists to enforce: claude has
    # no sudo path on this host at all, not even the narrow one this playbook
    # used to grant. `sudo -n` never prompts, so a nonzero exit here means
    # denied outright rather than "would have asked for a password" -- exact
    # wording of sudo's denial message varies by version/distro, so this only
    # asserts on exit status, not stderr text.
    - name: Verify claude cannot escalate to root (or anyone else) at all
      ansible.builtin.command: >-
        runuser -u {{ claude_user }} -- sudo -n -l
      changed_when: false
      register: claude_sudo_denied_check
      failed_when: claude_sudo_denied_check.rc == 0

    - name: Report no-sudo verification
      ansible.builtin.debug:
        msg: "Confirmed: claude has no sudo path on this host."
