- name: Bootstrap lfoss user across cluster
  # Excludes [api_managed] (OPNsense): those hosts use
  # ansible_connection: local, so tasks aimed at them would silently
  # succeed against the CONTROL NODE instead of failing. See inventory.ini.
  hosts: all:!api_managed
  become: yes
  remote_user: ansible

  vars:
    ssh_public_key: "{{ lookup('file', 'keys/lfoss_ed25519.pub') }}"

  tasks:

    - name: Confirm pve-router before provisioning users
      ansible.builtin.include_tasks: ../tasks/confirm-pve-router.yml

    - name: Ensure lfoss user exists
      ansible.builtin.user:
        name: lfoss
        shell: /bin/bash
        groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
        append: yes
        create_home: yes

    - name: Install authorized SSH key for lfoss
      ansible.posix.authorized_key:
        user: lfoss
        key: "{{ ssh_public_key }}"
        state: present

    - name: Ensure sudoers file for lfoss
      ansible.builtin.copy:
        dest: /etc/sudoers.d/lfoss
        owner: root
        group: root
        mode: "0440"
        content: |
          lfoss ALL=(ALL) NOPASSWD:ALL
          Defaults:lfoss !requiretty
        validate: "visudo -cf %s"

    # runuser rather than `become_user: lfoss`: the ansible user's sudoers runas
    # spec excludes lfoss (see ansible-user.yml). The play is already become:yes,
    # so this runs from root, which is still permitted. Asserting on stdout makes
    # it a real check — the old form only proved escalation itself worked.
    # Absolute path: runuser resets PATH to login.defs ENV_SUPATH.
    - name: Validate the lfoss account is usable
      ansible.builtin.command: runuser -u lfoss -- /usr/bin/whoami
      changed_when: false
      register: lfoss_whoami
      failed_when: (lfoss_whoami.stdout | trim) != 'lfoss'
