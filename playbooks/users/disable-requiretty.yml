---
- name: Disable requiretty for ansible compatibility
  hosts: all
  become: yes

  tasks:
    - name: Confirm pve-router before editing sudoers
      ansible.builtin.include_tasks: ../tasks/confirm-pve-router.yml

    - name: Remove requiretty restriction if present
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^Defaults\s+requiretty'
        line: '# Defaults requiretty'
        state: present
        validate: /usr/sbin/visudo -cf %s
