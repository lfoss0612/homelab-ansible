---
- name: Disable requiretty for ansible compatibility
  # Excludes [api_managed] (OPNsense): those hosts use
  # ansible_connection: local, so tasks aimed at them would silently
  # succeed against the CONTROL NODE instead of failing. See inventory.ini.
  hosts: all:!api_managed
  become: yes

  tasks:
    - name: Confirm pve-router before editing sudoers
      ansible.builtin.include_tasks: ../tasks/confirm-pve-router.yml

    - name: Remove requiretty restriction if present
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^Defaults\s+requiretty'
        line: '# Defaults requiretty'
        state: present
        validate: /usr/sbin/visudo -cf %s
