- name: Bootstrap ansible user on all nodes
  # Excludes [api_managed] (OPNsense): those hosts use
  # ansible_connection: local, so tasks aimed at them would silently
  # succeed against the CONTROL NODE instead of failing. See inventory.ini.
  hosts: all:!api_managed
  become: yes
  remote_user: lfoss

  vars:
    ansible_user_name: ansible
    ansible_pubkey: "{{ lookup('file', '/opt/ansible/keys/ansible.pub') }}"
    # Restricts the key to connections that actually originate from the
    # control node, so a copy of the private key stolen from anywhere else
    # is useless even though the sudo grant below is NOPASSWD:ALL.
    ansible_control_node_ip: "{{ hostvars['cockpit.home.lan']['ansible_host'] }}"

  tasks:

    - name: Confirm pve-router before provisioning users
      ansible.builtin.include_tasks: ../tasks/confirm-pve-router.yml

    - name: Ensure ansible user exists
      ansible.builtin.user:
        name: "{{ ansible_user_name }}"
        shell: /bin/bash
        create_home: yes
        password_lock: yes

    - name: Ensure ansible home exists
      ansible.builtin.file:
        path: "/home/{{ ansible_user_name }}"
        state: directory
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: "0755"

    - name: Ensure ansible .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ ansible_user_name }}/.ssh"
        state: directory
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: "0700"

    - name: Install authorized key for ansible user
      ansible.posix.authorized_key:
        user: "{{ ansible_user_name }}"
        state: present
        key: "{{ ansible_pubkey }}"
        key_options: 'from="{{ ansible_control_node_ip }}"'

    - name: Ensure ansible temp directory exists
      ansible.builtin.file:
        path: "/home/{{ ansible_user_name }}/.ansible/tmp"
        state: directory
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: "0700"

    # The runas spec excludes openclaw and lfoss so a playbook cannot quietly
    # acquire either account with `become_user:`. This is a guardrail, not a
    # security boundary: the grant is still NOPASSWD:ALL for root, and root can
    # reach any account by other means. What it buys is that every such access
    # has to be written down explicitly (as `runuser -u <user>`, the pattern in
    # claude-user.yml) instead of being ambient — which makes it greppable, and
    # makes an accidental `become_user: openclaw` fail loudly rather than work.
    # Backs up the "never grant the openclaw user sudo" corollary in CLAUDE.md
    # from the other direction: nothing routes *into* openclaw either.
    - name: Allow passwordless sudo for ansible user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: |
          ansible ALL=(ALL,!openclaw,!lfoss) NOPASSWD:ALL
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Lock password
      ansible.builtin.user:
        name: "{{ ansible_user_name }}"
        password_lock: yes
