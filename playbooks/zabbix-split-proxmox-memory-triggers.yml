---
# Disable two of the three Proxmox memory trigger prototypes: the VM-level one
# because it measures something that is *supposed* to sit near 100%, and the
# node-level one because the Zabbix agent already alerts on the same condition
# more accurately.
#
# WHY THE VM ONE IS NOISE. Proxmox reports a guest's allocated/RSS memory
# including balloon and overhead, not in-guest usage. Cross-checking each guest
# against its own agent makes the split unambiguous - and two VMs report OVER
# 100% of configured RAM, which is the giveaway that this is not a usage figure
# at all. Measured 2026-08-25:
#
#     alert                     Proxmox    guest agent    verdict
#     Node [pve-ai]              94.9%        94.9%       REAL, sources agree
#     VM  k8s-worker-2          100.4%        28.5%       artifact
#     VM  OPNsense              101.1%          -         artifact
#
# WHY THE NODE ONE GOES TOO, despite being accurate. It duplicates
# "Linux: High memory utilization", which every Proxmox node already runs via
# the agent - all three carry "Linux by Zabbix agent". Both fired for pve-ai
# simultaneously, from the same number. One condition should have one alert, and
# the agent is the fleet-wide standard: it covers all 14 hosts identically,
# survives the Proxmox API token expiring (which it did, for a day), and is not
# subject to the accounting quirk above.
#
# WHY THE LXC ONE STAYS. Checked rather than assumed: containers use cgroup
# accounting and do not balloon, so their figures are truthful -
# cockpit 4.77% vs agent 4.6%, pdm 14.3% vs agent 14.3%. It duplicates the agent
# in the same way the node trigger does and could arguably follow it, but it is
# not currently firing, is not wrong, and was outside the scope of this item.
# Left deliberately, not overlooked.
#
# Disabled rather than deleted: these are prototypes on a vendor template, and
# unlike the orphaned host-local ones cleaned up elsewhere they ARE owned by a
# template, so a future template update can legitimately revise them. Disable
# expresses "we do not want this alert" without discarding the definition.
# (triggerprototype.delete is refused to the automation token in any case.)
#
# Vendor template edit - a re-import re-enables them. Idempotent, so re-run.
#
# Usage:
#   ansible-playbook playbooks/zabbix-split-proxmox-memory-triggers.yml --check --diff
#   ansible-playbook playbooks/zabbix-split-proxmox-memory-triggers.yml

- name: Disable the noisy and duplicated Proxmox memory triggers
  hosts: localhost
  gather_facts: false

  vars:
    zabbix_url: "http://10.0.5.9/zabbix"
    zabbix_api_token: "c4bceeafe968e48fd74a68fda821867cee967eb19a4cea615b2e47f1215ad939"

    proxmox_template: "Proxmox VE by HTTP"

    # Matched on the LLD rule that owns the prototype plus "high memory usage"
    # in its description, rather than on hardcoded trigger ids, so a template
    # update that renumbers them is still handled. LXC discovery is
    # deliberately absent - see the header.
    disable_from_rules:
      - "QEMU discovery"
      - "Node discovery"

  tasks:
    - name: Resolve the Proxmox template
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            output: ["templateid", "name"]
            filter:
              name: ["{{ proxmox_template }}"]
          id: 1
      register: tpl_lookup
      check_mode: false
      failed_when: >-
        tpl_lookup.json.error is defined
        or (tpl_lookup.json.result | default([]) | length) != 1

    - name: List the template's trigger prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.get
          params:
            templateids: ["{{ tpl_lookup.json.result[0].templateid }}"]
            output: ["triggerid", "description", "status"]
            selectDiscoveryRule: ["name"]
          id: 1
      register: tp_lookup
      check_mode: false
      failed_when: tp_lookup.json.error is defined

    - name: Select the memory prototypes to disable
      ansible.builtin.set_fact:
        to_disable: >-
          {{ tp_lookup.json.result
             | selectattr('description', 'search', 'high memory usage')
             | selectattr('discoveryRule.name', 'in', disable_from_rules)
             | list }}

    - name: Assert the selection is what we expect
      ansible.builtin.assert:
        that:
          - to_disable | length == 2
        fail_msg: >-
          Expected exactly 2 memory prototypes (QEMU + Node), found
          {{ to_disable | length }}:
          {{ to_disable | map(attribute='description') | list }}.
          Has the template changed? Do not disable blind.
        success_msg: >-
          {{ to_disable | map(attribute='description') | map('truncate', 54) | list }}

    - name: Disable them
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.update
          params: >-
            {{ to_disable
               | selectattr('status', 'equalto', '0')
               | map(attribute='triggerid')
               | map('community.general.dict_kv', 'triggerid')
               | map('combine', {'status': 1})
               | list }}
          id: 1
      register: disable_result
      when: (to_disable | selectattr('status', 'equalto', '0') | list | length) > 0
      failed_when: disable_result.json.error is defined
      changed_when: disable_result.json.result is defined

    # Disabling a PROTOTYPE governs entities discovered from now on; it does NOT
    # propagate to ones already discovered. Verified 2026-08-25: after disabling
    # both prototypes and forcing QEMU/Node discovery with task.create, all 14
    # existing triggers were still enabled. So the already-discovered triggers
    # have to be disabled directly as well - the prototype handles the future,
    # this handles the present.
    #
    # A manual disable on a discovered trigger DOES survive later LLD runs
    # (verified separately on the pod triggers), so this is not undone by
    # discovery.
    - name: Find the already-discovered memory triggers
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: trigger.get
          params:
            output: ["triggerid", "description", "status"]
            search:
              description: "high memory usage"
            limit: 500
          id: 1
      register: disc_lookup
      check_mode: false
      failed_when: disc_lookup.json.error is defined

    - name: Select the discovered ones to disable
      ansible.builtin.set_fact:
        # Same split as the prototypes: LXC is truthful and stays enabled.
        # Matching on "Proxmox VE:" keeps this off the agent-side
        # "Linux: High memory utilization" triggers, which are the ones being
        # kept as the single source for this condition.
        disc_to_disable: >-
          {{ disc_lookup.json.result
             | selectattr('description', 'search', '^Proxmox VE:')
             | rejectattr('description', 'search', 'LXC')
             | selectattr('status', 'equalto', '0')
             | list }}

    - name: Disable the already-discovered memory triggers
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: trigger.update
          params: >-
            {{ disc_to_disable
               | map(attribute='triggerid')
               | map('community.general.dict_kv', 'triggerid')
               | map('combine', {'status': 1})
               | list }}
          id: 1
      register: disc_disable
      when: disc_to_disable | length > 0
      failed_when: disc_disable.json.error is defined
      changed_when: disc_disable.json.result is defined

    - name: Report the discovered-trigger change
      ansible.builtin.debug:
        msg: >-
          {{ disc_to_disable | length }} already-discovered Proxmox memory
          trigger(s) disabled (LXC ones left enabled).

    - name: Confirm
      ansible.builtin.uri:
        url: "{{ zabbix_url }}/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_api_token }}"
        body:
          jsonrpc: "2.0"
          method: triggerprototype.get
          params:
            templateids: ["{{ tpl_lookup.json.result[0].templateid }}"]
            output: ["triggerid", "description", "status"]
            search:
              description: "high memory usage"
          id: 1
      register: tp_verify
      check_mode: false
      failed_when: tp_verify.json.error is defined

    - name: Report the end state
      ansible.builtin.debug:
        msg: >-
          {% for t in tp_verify.json.result %}
          {{ 'DISABLED' if t.status == '1' else 'enabled ' }} {{ t.description | truncate(50) }}{{ '\n' }}
          {% endfor %}
          Agent-side "Linux: High memory utilization" still covers every host.
