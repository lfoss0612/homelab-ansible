---
# Provision a read-only kubeconfig for the existing `claude` OS account on
# k8s-master.home.lan, so Claude can run kubectl directly instead of guessing
# at cluster state from host-level dmesg/journalctl during diagnostics.
#
# Usage:
#   ansible-playbook playbooks/claude-readonly-kubeconfig.yml --check --diff
#   ansible-playbook playbooks/claude-readonly-kubeconfig.yml
#
# What this creates: a `claude-readonly` ServiceAccount in kube-system, bound
# to the built-in `view` ClusterRole (read-only, cluster-wide -- pods, nodes,
# Longhorn CRs, everything -- no create/update/delete/exec on anything), plus
# a long-lived token Secret for it (K8s 1.24+ no longer auto-generates SA
# tokens, so this has to be explicit). The resulting kubeconfig is written to
# /home/claude/.kube/config, owned claude:claude mode 0600.
#
# `claude` gets NO new sudo and NO change to its existing account -- this
# only adds a credential file an already-unprivileged account can read. The
# actual RBAC objects are created via this host's own admin kubeconfig
# (/etc/rancher/rke2/rke2.yaml, root-only), reached the same way every other
# playbook in this repo reaches root: Ansible's own become, not any new
# escalation path for claude.
#
# This playbook does NOT touch sudoers, does NOT reboot, and is idempotent
# (kubectl apply + a token re-read on every run).

- name: Provision read-only kubectl access for claude on k8s-master
  hosts: k8s-master.home.lan
  become: true
  vars:
    claude_kube_sa: claude-readonly
    claude_kube_namespace: kube-system
    claude_kube_secret: claude-readonly-token
    claude_kubeconfig_path: /home/claude/.kube/config
    admin_kubeconfig: /etc/rancher/rke2/rke2.yaml

  tasks:
    - name: Create the claude-readonly ServiceAccount
      ansible.builtin.command:
        cmd: kubectl --kubeconfig={{ admin_kubeconfig }} apply -f -
        stdin: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: {{ claude_kube_sa }}
            namespace: {{ claude_kube_namespace }}
      register: claude_sa_apply
      changed_when: "'unchanged' not in claude_sa_apply.stdout"

    - name: Bind it to the built-in view ClusterRole (read-only, cluster-wide)
      ansible.builtin.command:
        cmd: kubectl --kubeconfig={{ admin_kubeconfig }} apply -f -
        stdin: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: claude-readonly-view
          subjects:
            - kind: ServiceAccount
              name: {{ claude_kube_sa }}
              namespace: {{ claude_kube_namespace }}
          roleRef:
            kind: ClusterRole
            name: view
            apiGroup: rbac.authorization.k8s.io
      register: claude_crb_apply
      changed_when: "'unchanged' not in claude_crb_apply.stdout"

    - name: Create a long-lived token Secret for the ServiceAccount
      ansible.builtin.command:
        cmd: kubectl --kubeconfig={{ admin_kubeconfig }} apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/service-account-token
          metadata:
            name: {{ claude_kube_secret }}
            namespace: {{ claude_kube_namespace }}
            annotations:
              kubernetes.io/service-account.name: {{ claude_kube_sa }}
      register: claude_secret_apply
      changed_when: "'unchanged' not in claude_secret_apply.stdout"

    - name: Wait for the controller to populate the token
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ admin_kubeconfig }} -n {{ claude_kube_namespace }}
          get secret {{ claude_kube_secret }} -o jsonpath={.data.token}
      register: claude_token_wait
      until: claude_token_wait.stdout | length > 0
      retries: 10
      delay: 2
      changed_when: false
      check_mode: false
      no_log: true

    - name: Read the token and cluster CA cert
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ admin_kubeconfig }} -n {{ claude_kube_namespace }}
          get secret {{ claude_kube_secret }} -o jsonpath={{ '{' }}{{ item }}{{ '}' }}
      loop:
        - .data.token
        - .data['ca\.crt']
      register: claude_secret_fields
      changed_when: false
      check_mode: false
      no_log: true

    - name: Build the kubeconfig content
      ansible.builtin.set_fact:
        claude_kubeconfig_content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: default
              cluster:
                server: https://127.0.0.1:6443
                certificate-authority-data: {{ claude_secret_fields.results[1].stdout }}
          contexts:
            - name: claude-readonly
              context:
                cluster: default
                user: claude-readonly
          current-context: claude-readonly
          users:
            - name: claude-readonly
              user:
                token: {{ claude_secret_fields.results[0].stdout | b64decode }}
      no_log: true

    - name: Ensure ~claude/.kube exists
      ansible.builtin.file:
        path: /home/claude/.kube
        state: directory
        owner: claude
        group: claude
        mode: "0700"

    - name: Write the read-only kubeconfig
      ansible.builtin.copy:
        dest: "{{ claude_kubeconfig_path }}"
        content: "{{ claude_kubeconfig_content }}"
        owner: claude
        group: claude
        mode: "0600"
      no_log: true

    - name: Verify claude can read cluster state with it
      ansible.builtin.command:
        cmd: kubectl --kubeconfig={{ claude_kubeconfig_path }} get nodes
      become: true
      become_user: claude
      register: claude_kubectl_verify
      changed_when: false

    - name: Verify claude CANNOT write with it (confirms read-only scope)
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ claude_kubeconfig_path }}
          auth can-i delete pods --all-namespaces
      become: true
      become_user: claude
      register: claude_kubectl_writecheck
      changed_when: false
      failed_when: claude_kubectl_writecheck.stdout | trim != 'no'

    - name: Report
      ansible.builtin.debug:
        msg:
          - "kubeconfig written to {{ claude_kubeconfig_path }} (claude:claude, 0600)"
          - "claude can read cluster state: {{ 'yes' if claude_kubectl_verify.rc == 0 else 'NO -- check above' }}"
          - "claude confirmed read-only (cannot delete pods): {{ claude_kubectl_writecheck.stdout | trim == 'no' }}"
