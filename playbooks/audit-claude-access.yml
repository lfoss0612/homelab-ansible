---
# Audit Claude Code Access Controls and Report to Zabbix
#
# Validates across the fleet:
# - Claude user existence and configuration
# - SSH key restrictions are in place
# - Sudoers rules match policy
# - No unauthorized escalation paths
#
# Sends results to Zabbix for monitoring and alerting
#
# Usage:
#   ansible-playbook playbooks/audit-claude-access.yml
#   ansible-playbook playbooks/audit-claude-access.yml --tags zabbix  (send to zabbix only)
#   ansible-playbook playbooks/audit-claude-access.yml -l pbs.home.lan (audit single host)

- name: Audit Claude Code Access Controls
  hosts: "{{ audit_hosts | default('openclaw') }}"
  become: true
  gather_facts: true
  tags: [audit, claude]

  vars:
    # Zabbix server and trapper key for audit results
    zabbix_server: zabbix.home.lan
    zabbix_port: 10051
    zabbix_key: "homelab.claude.access.audit"

    # Expected configuration (source of truth)
    expected_config:
      cockpit.home.lan:
        claude_user: claude
        ssh_restrictions:
          - from="10.10.5.0/24"
          - no-port-forwarding
          - no-X11-forwarding
          - no-agent-forwarding
          - no-user-rc
        sudoers:
          - "{{ claude_user | default('claude') }} ALL=(ansible) NOPASSWD: /usr/bin/ansible"
          - "{{ claude_user | default('claude') }} ALL=(ansible) NOPASSWD: /usr/bin/ansible-playbook"
          - "{{ claude_user | default('claude') }} ALL=(ansible) NOPASSWD: /usr/bin/ansible-inventory"

      zabbix.home.lan:
        claude_user: claude
        ssh_restrictions:
          - from="10.10.5.0/24"
          - no-port-forwarding
          - no-X11-forwarding
          - no-agent-forwarding
          - no-user-rc
        groups:
          - systemd-journal
          - adm
          - zabbix
        # No escalation allowed. Was previously two fixed, read-only
        # `zabbix_server -R` commands via root -- removed 2026-09-23 per
        # policy: claude gets no root path anywhere, no exceptions.
        sudoers: []

      pbs.home.lan:
        claude_user: claude
        ssh_restrictions:
          - from="10.10.5.0/24"
          - no-port-forwarding
          - no-X11-forwarding
          - no-agent-forwarding
          - no-user-rc
        groups:
          - systemd-journal
          - adm
        sudoers: []  # No escalation allowed

  pre_tasks:
    - name: Initialize audit results
      set_fact:
        audit_results:
          host: "{{ inventory_hostname }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          checks:
            claude_user_exists: false
            ssh_restrictions_ok: false
            sudoers_ok: false
            no_unauthorized_escalation: false
          violations: []
          status: "PASSED"  # Will change to FAILED if any violations
      tags: [audit, claude]

  tasks:
    - name: Check if claude user exists
      getent:
        database: passwd
        key: claude
      register: claude_user_result
      failed_when: false
      tags: [audit, claude, user]

    - name: Report claude user status
      set_fact:
        audit_results: "{{ audit_results | combine(
          {'checks': audit_results.checks | combine({'claude_user_exists': claude_user_result.ansible_facts.getent_passwd.claude is defined})},
          recursive=True
        ) }}"
      when: claude_user_result is defined
      tags: [audit, claude, user]

    - name: Get claude SSH authorized keys
      shell: |
        if [ -f /home/claude/.ssh/authorized_keys ]; then
          cat /home/claude/.ssh/authorized_keys
        else
          echo "FILE_NOT_FOUND"
        fi
      register: claude_ssh_keys
      changed_when: false
      tags: [audit, claude, ssh]

    - name: Validate SSH key restrictions
      set_fact:
        ssh_check: "{{ {
            'has_from_restriction': 'from=' in claude_ssh_keys.stdout,
            'no_port_forwarding': 'no-port-forwarding' in claude_ssh_keys.stdout,
            'no_x11_forwarding': 'no-X11-forwarding' in claude_ssh_keys.stdout,
            'no_agent_forwarding': 'no-agent-forwarding' in claude_ssh_keys.stdout,
            'no_user_rc': 'no-user-rc' in claude_ssh_keys.stdout
          } }}"
      when: claude_ssh_keys.stdout != "FILE_NOT_FOUND"
      tags: [audit, claude, ssh]

    - name: Report SSH restriction status
      set_fact:
        audit_results: "{{ audit_results | combine(
          {'checks': audit_results.checks | combine({'ssh_restrictions_ok': ssh_check.no_port_forwarding and ssh_check.no_x11_forwarding and ssh_check.no_agent_forwarding and ssh_check.no_user_rc})},
          recursive=True
        ) }}"
      when: ssh_check is defined
      tags: [audit, claude, ssh]

    - name: Check sudoers configuration
      shell: |
        if [ -f /etc/sudoers.d/claude ]; then
          cat /etc/sudoers.d/claude
        else
          echo "FILE_NOT_FOUND"
        fi
      register: claude_sudoers
      changed_when: false
      tags: [audit, claude, sudoers]

    - name: Validate sudoers rules (detect blanket/unrestricted escalation)
      set_fact:
        sudoers_violations: "{{ {
            'blanket_escalation': 'ALL=(ALL)' in claude_sudoers.stdout,
            'unrestricted_shell': ('/bin/bash' in claude_sudoers.stdout or '/bin/sh' in claude_sudoers.stdout) and 'NOPASSWD' in claude_sudoers.stdout,
            'unauthorized_escalation': 'ALL=(root) NOPASSWD' in claude_sudoers.stdout
          } }}"
      when: claude_sudoers.stdout != "FILE_NOT_FOUND"
      tags: [audit, claude, sudoers]

    - name: Default sudoers_violations when no sudoers file exists (nothing to violate)
      set_fact:
        sudoers_violations: "{{ {'blanket_escalation': false, 'unrestricted_shell': false, 'unauthorized_escalation': false} }}"
      when: claude_sudoers.stdout == "FILE_NOT_FOUND"
      tags: [audit, claude, sudoers]

    - name: Report sudoers violations
      set_fact:
        audit_results: "{{ audit_results | combine(
          {
            'checks': audit_results.checks | combine({
              'sudoers_ok': not (sudoers_violations.blanket_escalation or sudoers_violations.unrestricted_shell or sudoers_violations.unauthorized_escalation),
              'no_unauthorized_escalation': not sudoers_violations.unauthorized_escalation
            }),
            'violations': audit_results.violations + (
              (['Blanket NOPASSWD rule found'] if sudoers_violations.blanket_escalation else []) +
              (['Unrestricted shell escalation found'] if sudoers_violations.unrestricted_shell else []) +
              (['Unauthorized root escalation'] if sudoers_violations.unauthorized_escalation else [])
            )
          },
          recursive=True
        ) }}"
      when: sudoers_violations is defined
      tags: [audit, claude, sudoers]

    - name: Update final status if violations found
      set_fact:
        audit_results: "{{ audit_results | combine({'status': 'FAILED'}, recursive=True) }}"
      when: audit_results.violations | length > 0
      tags: [audit, claude]

    - name: Display audit results
      debug:
        msg: "{{ audit_results | to_nice_json }}"
      tags: [audit, claude]

  post_tasks:
    - name: Send results to Zabbix (via zabbix_sender)
      shell: |
        zabbix_sender -z "{{ zabbix_server }}" -p {{ zabbix_port }} \
          -s "{{ inventory_hostname }}" \
          -k "{{ zabbix_key }}" \
          -v "{{ audit_results.status }}"
      when:
        - "'zabbix' in groups"
        - audit_results is defined
      ignore_errors: true  # Don't fail playbook if Zabbix is down
      tags: [zabbix, audit]

    - name: Send violation count to Zabbix
      shell: |
        zabbix_sender -z "{{ zabbix_server }}" -p {{ zabbix_port }} \
          -s "{{ inventory_hostname }}" \
          -k "{{ zabbix_key }}.violations" \
          -v "{{ audit_results.violations | length }}"
      when:
        - "'zabbix' in groups"
        - audit_results is defined
      ignore_errors: true
      tags: [zabbix, audit]

    - name: Send SSH restriction status to Zabbix
      shell: |
        zabbix_sender -z "{{ zabbix_server }}" -p {{ zabbix_port }} \
          -s "{{ inventory_hostname }}" \
          -k "{{ zabbix_key }}.ssh_restrictions" \
          -v "{{ (audit_results.checks.ssh_restrictions_ok | int) }}"
      when:
        - "'zabbix' in groups"
        - audit_results is defined
      ignore_errors: true
      tags: [zabbix, audit]

    - name: Send sudoers status to Zabbix
      shell: |
        zabbix_sender -z "{{ zabbix_server }}" -p {{ zabbix_port }} \
          -s "{{ inventory_hostname }}" \
          -k "{{ zabbix_key }}.sudoers" \
          -v "{{ (audit_results.checks.sudoers_ok | int) }}"
      when:
        - "'zabbix' in groups"
        - audit_results is defined
      ignore_errors: true
      tags: [zabbix, audit]

    - name: Alert on violations (fail if any found)
      fail:
        msg: |
          Access control audit FAILED on {{ inventory_hostname }}
          Violations found:
          {% for violation in audit_results.violations %}
            - {{ violation }}
          {% endfor %}
      when: audit_results.status == "FAILED"
      tags: [audit, claude, alert]
