---
# Queue "Execute now" for the Zabbix items whose key starts with zbx_key_prefix on zbx_hosts.
# Included by zabbix-execute-now.yml and, as a last step that never fails the run, by os-update.yml and
# fleet-reboot.yml so the patch dashboard is fresh right after a change.
# Needs: zbx_hosts (list of Zabbix host names), zbx_key_prefix; runs where the API is reachable
# (localhost, connection local). Uses zabbix_url, zabbix_api_token, zbx_pollable_types from the caller.
- name: Look up the hosts
  ansible.builtin.uri:
    url: "{{ zabbix_url }}/api_jsonrpc.php"
    method: POST
    body_format: json
    headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
    body:
      jsonrpc: "2.0"
      method: host.get
      params:
        output: [hostid, host]
        filter: {host: "{{ zbx_hosts }}"}
      id: 1
  register: zbx_host_lookup
  check_mode: false
  failed_when: zbx_host_lookup.json.error is defined or zbx_host_lookup.json.result | length != zbx_hosts | length

- name: Find the items
  ansible.builtin.uri:
    url: "{{ zabbix_url }}/api_jsonrpc.php"
    method: POST
    body_format: json
    headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
    body:
      jsonrpc: "2.0"
      method: item.get
      params:
        output: [itemid, key_, hostid, type]
        hostids: "{{ zbx_host_lookup.json.result | map(attribute='hostid') | list }}"
        monitored: true
        filter: {type: "{{ zbx_pollable_types }}"}
      id: 1
  register: zbx_items
  check_mode: false
  failed_when: zbx_items.json.error is defined

- name: Keep the items that match the prefix
  ansible.builtin.set_fact:
    zbx_selected: "{{ zbx_items.json.result | selectattr('key_', 'match', '^' ~ (zbx_key_prefix | regex_escape)) | list }}"

- name: Build the task list
  ansible.builtin.set_fact:
    zbx_tasks: >-
      {%- set ns = namespace(l=[]) -%}
      {%- for i in zbx_selected -%}
      {%- set ns.l = ns.l + [{'type': 6, 'request': {'itemid': i.itemid}}] -%}
      {%- endfor -%}
      {{ ns.l }}

- name: Say what will be polled
  ansible.builtin.debug:
    msg: >-
      {{ 'DRY RUN, would queue' if ansible_check_mode else 'Queueing' }}
      {{ zbx_selected | length }} item(s) on {{ zbx_hosts | join(', ') }}
      (prefix '{{ zbx_key_prefix }}'): {{ zbx_selected | map(attribute='key_') | unique | sort | list | truncate(300) }}

- name: Stop if there is nothing to poll
  ansible.builtin.assert:
    that: zbx_selected | length > 0
    fail_msg: "No pollable monitored items matched on {{ zbx_hosts }} with prefix '{{ zbx_key_prefix }}'."

- name: Queue the polls
  ansible.builtin.uri:
    url: "{{ zabbix_url }}/api_jsonrpc.php"
    method: POST
    body_format: json
    headers: {Authorization: "Bearer {{ zabbix_api_token }}"}
    body:
      jsonrpc: "2.0"
      method: task.create
      params: "{{ zbx_tasks }}"
      id: 2
  register: zbx_task
  when: not ansible_check_mode
  failed_when: zbx_task.json.error is defined
  changed_when: true
