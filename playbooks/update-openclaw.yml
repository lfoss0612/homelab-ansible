---
# Fleet convergence: bring every OpenClaw host to the version pinned in group_vars/openclaw.yml.
# Verify before mutating, gateway first, nodes serialized with a per-host health gate, and end_host
# early wherever a host is already at the target. The work is in openclaw-converge-stage.yml; this
# file runs it once per intermediate release in openclaw_upgrade_path (up to 3), then for the pin.
#
# openclaw_upgrade_path (group_vars/openclaw.yml, default []) lists releases to pass through on
# the way up, oldest first, for example ["2026.9.7"]. It exists because a state migration can
# refuse to jump (2026.7.1-2 state needs 2026.9.7 before 2026.11.5). Each hop is a full gateway +
# nodes convergence with doctor run by the role, so a hop that fails stops the run before the next
# one. A host already at or past a hop is skipped for it. Once the fleet is at the pin the path is
# inert, but delete the entry in the next bump so the weekly timer never walks it. Discarding a
# legacy agent database stays a separate opt-in (-e openclaw_migrate_discard_legacy_agent_db=true).
#
# Dry run, shows each stage:
#   scripts/run-working-tree.sh playbooks/update-openclaw.yml
# One-off path without a commit:
#   ... -e '{"openclaw_upgrade_path": ["2026.9.7"]}'

- name: Record the pin
  hosts: openclaw:!openclaw_deferred
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Check the path
      ansible.builtin.assert:
        that:
          - openclaw_upgrade_path | default([]) | length <= 3
          - openclaw_upgrade_path | default([]) | map('string') | reject('match', '^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9]+)?$') | list | length == 0
        fail_msg: "openclaw_upgrade_path must hold at most 3 versions like 2026.9.7."
        quiet: true
      run_once: true

    - name: Remember the pin before stages override openclaw_version
      ansible.builtin.set_fact:
        openclaw_pin: "{{ openclaw_version }}"

- name: Hop 1
  ansible.builtin.import_playbook: openclaw-converge-stage.yml
  vars: {openclaw_stage: 0}
  when: openclaw_upgrade_path | length > 0

- name: Hop 2
  ansible.builtin.import_playbook: openclaw-converge-stage.yml
  vars: {openclaw_stage: 1}
  when: openclaw_upgrade_path | length > 1

- name: Hop 3
  ansible.builtin.import_playbook: openclaw-converge-stage.yml
  vars: {openclaw_stage: 2}
  when: openclaw_upgrade_path | length > 2

- name: Pin
  ansible.builtin.import_playbook: openclaw-converge-stage.yml
  vars: {openclaw_stage: -1}

# After a run that changed something, nodes reconnect and ask to be paired again, and a node can
# come back under the wrong name. Approve the inventory hosts' requests and put names right
# (the same play as approve-openclaw-nodes.yml, with its report of exactly what it approves).
- name: Did anything change
  hosts: openclaw_gateway
  gather_facts: false
  tasks:
    - name: Work out whether any host was updated in this run
      ansible.builtin.set_fact:
        openclaw_fleet_updated: >-
          {%- set ns = namespace(n=0) -%}
          {%- for h in groups['openclaw'] -%}
          {%- if hostvars[h].openclaw_was_updated | default(false) | bool -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.n > 0 }}

    - name: Give the nodes a moment to reconnect and file their requests
      ansible.builtin.pause:
        seconds: 45
      when:
        - openclaw_fleet_updated | bool
        - openclaw_approve_after_update | default(true) | bool
        - not ansible_check_mode

- name: Approve pairings and fix names after the update
  ansible.builtin.import_playbook: approve-openclaw-nodes.yml
  vars:
    openclaw_approve_confirm: true
  when:
    - openclaw_fleet_updated | default(false) | bool
    - openclaw_approve_after_update | default(true) | bool
