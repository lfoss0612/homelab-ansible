---
# Fleet convergence: bring every OpenClaw host to the version pinned in
# group_vars/openclaw.yml. Verify before mutating, gateway first, nodes
# serialized with a per-host health gate, and end_host early wherever a host
# is already at the pin. There is no build any more — the gate compares
# `openclaw --version` against openclaw_version, not a build hash.
#
# The gateway is a member of openclaw_nodes (it manages its own VM), so it
# is converged by the gateway play below, then converged again by the node
# play for its own openclaw-node.service — same as deploy-openclaw.yml.

# ============================================================
# PHASE 1 — Verify: compare installed version against the pin
# ============================================================
- name: Detect installed OpenClaw versions
  hosts: openclaw
  gather_facts: false
  become: true

  tasks:
    - name: Check installed openclaw CLI version
      ansible.builtin.command: openclaw --version
      register: openclaw_installed_version
      changed_when: false
      failed_when: false

    - name: Determine whether this host needs updating
      ansible.builtin.set_fact:
        openclaw_update_required: >-
          {{ openclaw_installed_version.rc != 0 or
             openclaw_version not in openclaw_installed_version.stdout }}

    - name: Report current state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ openclaw_installed_version.stdout | default('not installed') }}
          -> update {{ 'required' if openclaw_update_required else 'not required' }}

# ============================================================
# PHASE 2 — Gateway first
# ============================================================
- name: Update gateway
  hosts: openclaw_gateway
  serial: 1
  become: true
  gather_facts: true

  tasks:
    - name: Skip — gateway already at the pinned version
      ansible.builtin.meta: end_host
      when: not openclaw_update_required

    - name: Converge gateway to the pinned version
      ansible.builtin.include_role:
        name: openclaw.node.gateway

# ============================================================
# PHASE 3 — Nodes, serialized, gateway already verified healthy
# ============================================================
- name: Update nodes
  hosts: openclaw_nodes
  serial: 1
  become: true
  gather_facts: false

  tasks:
    - name: Skip — node already at the pinned version
      ansible.builtin.meta: end_host
      when: not openclaw_update_required

    - name: Converge node to the pinned version
      ansible.builtin.include_role:
        name: openclaw.node.node

    - name: Flush handlers so the health check reflects the current unit
      ansible.builtin.meta: flush_handlers

    - name: Health-gate — openclaw-node must be active before moving to the next host
      ansible.builtin.command: systemctl is-active openclaw-node
      register: openclaw_node_active
      changed_when: false
      until: openclaw_node_active.stdout == "active"
      retries: 6
      delay: 5

    - name: Health-gate — installed version must match the pin
      ansible.builtin.command: openclaw --version
      register: openclaw_node_version_check
      changed_when: false
      failed_when: openclaw_version not in openclaw_node_version_check.stdout
