- name: Deploy OpenClaw Gateway
  hosts: openclaw_gateway
  serial: 1
  become: true
  roles:
    - role: openclaw.node.gateway
      tags: gateway

- name: Deploy OpenClaw Nodes
  # No gateway subtraction: the gateway host is deliberately a node too, and
  # the gateway play above already converged its gateway service first.
  hosts: openclaw_nodes
  serial: 1
  become: true
  roles:
    - role: openclaw.node.node
      tags: node
