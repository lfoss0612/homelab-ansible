[proxmox_hosts]
pve.home.lan           ansible_host=10.0.5.4
pve-ai.home.lan        ansible_host=10.0.5.3
pve-router.home.lan    ansible_host=10.0.5.2

[qemu_vms]
omv.home.lan           ansible_host=10.1.5.2
zabbix.home.lan        ansible_host=10.0.5.9
# Moved to the VM LAN; 10.2.5.10 is dead. /etc/hosts on cockpit and the
# gateway still carries the old address — there is no internal DNS for .home.lan.
vscode.home.lan        ansible_host=10.10.5.2
openclaw.home.lan      ansible_host=10.0.5.7
# Desktop VM (VMID 104 on pve), VLAN 100. Also in [openclaw_optional] — see below.
# No DHCP reservation -- the lease moved to .199 (from .198) after the
# 2026-08-03 NetworkManager->networkd cutover picked up a new client
# identifier. Confirmed live 2026-08-04; re-check if this host ever goes
# unreachable again before assuming it's actually down.
desktop.home.lan       ansible_host=10.10.5.199

# LXC containers (both VMID 107/108 on pve-router, confirmed via `pct list` —
# not `qm list`). Split out of the old flat [vms] group 2026-08-03: Proxmox's
# pct tooling writes /etc/resolv.conf directly into the container rootfs on
# every start, from the container's own `nameserver:` config line (pdm) or,
# if unset, copied from the pve-router host's own resolv.conf (cockpit) —
# not from anything inside the guest OS. This overwrites systemd-resolved's
# stub-resolv.conf symlink every boot regardless of in-guest config, which is
# why the "vms" grouping hid this as a per-host DNS bug instead of a platform
# one. See homelab-vault TODO.md, "Standardize the fleet on systemd-resolved".
[lxc]
cockpit.home.lan       ansible_host=10.0.5.10
pdm.home.lan           ansible_host=10.0.5.8

# Bare metal — was previously miscategorized under [vms] too (systemd-detect-virt
# reports "none"). ifupdown-managed static interface, NetworkManager present but
# not managing it (`managed=false` for ifupdown-defined devices).
[bare_metal]
pbs.home.lan           ansible_host=10.0.5.5

# NOT in this inventory, deliberately: haos (VMID 112 on pve, 10.10.5.3) runs
# Home Assistant OS 18.0, an immutable appliance — no apt, read-only /usr, no
# persistent useradd, nowhere to install a systemd unit, and no sshd. It cannot
# be an Ansible-managed OpenClaw node. Listing it here would only break every
# `hosts: all` play with an unreachable host. See README "Hosts Ansible does
# not manage".


# -----------------------
# OpenClaw topology
# -----------------------

[openclaw_gateway]
openclaw.home.lan      ansible_host=10.0.5.7

# Hypervisors that run an OpenClaw node. pve-router added 2026-08-04 — it
# already ran an independently-managed openclaw-node.service (registered with
# the gateway but never touched by this repo); it now converges through the
# normal deploy-openclaw.yml/update-openclaw.yml/validate-openclaw.yml path
# like pve and pve-ai. It hosts the OPNsense VM the whole house network runs
# on, so treat any non-trivial change here (not just OpenClaw updates) with
# extra care — see homelab-vault TODO.md "Bring pve-router and OPNsense under
# Ansible management" for the fuller risk writeup (that item is about the
# hypervisor host/OPNsense itself, not the openclaw-node agent).
[openclaw_proxmox]
pve.home.lan           ansible_host=10.0.5.4
pve-ai.home.lan        ansible_host=10.0.5.3
pve-router.home.lan    ansible_host=10.0.5.2

# Full OpenClaw nodes that are legitimately powered off part of the time. They
# are converged exactly like any other node when they are up, but no play may
# treat "unreachable" as a failure for them — the weekly convergence timer must
# not go red because a desktop is shut down. Strict plays therefore target
# `openclaw_nodes:!openclaw_optional` and a second play picks these up with
# `ignore_unreachable: true`. Membership here is behavioural; [qemu_vms]/[lxc]/
# [bare_metal] above are still the topology groups.
[openclaw_optional]
desktop.home.lan

[openclaw_nodes:children]
openclaw_proxmox
qemu_vms
lxc
bare_metal
k8s

[openclaw:children]
openclaw_gateway
openclaw_nodes

# The Ansible control node itself — where /opt/ansible lives and where the
# weekly openclaw-fleet-update timer runs. Its own OpenClaw node membership
# comes from [lxc]; this group is about the write plane, not the read plane.
[openclaw_control]
cockpit.home.lan       ansible_host=10.0.5.10


# -----------------------
# Network appliances (API-managed)
# -----------------------

# OPNsense (VM 106 on pve-router) — the router, firewall, DHCP server, DNS
# resolver, HAProxy frontend and internal CA for the whole house.
#
# Managed exclusively over its REST API. There is no usable SSH transport: the
# login lands in a locked-down console menu, and it is a FreeBSD appliance with
# no Python — `pkg install python` to force the standard modules to work fights
# the appliance model and gets wiped by firmware upgrades. That is the same
# objection that keeps `haos` out of this file entirely.
#
# Unlike haos, this host IS listed. The API is a real, already-proven write
# plane (the traffic shaper was reconfigured through it on 2026-07-13), so it
# needs host_vars, and a named inventory host is the only way to get
# host_vars auto-loading — see host_vars/opnsense.home.lan.yml.
#
# ansible_host is informational only: `ansible_connection: local` (set in
# group_vars/network_appliances.yml) means no connection is ever made to it.
# The API endpoint is a separate variable, opnsense_api_base.
[network_appliances]
opnsense.home.lan      ansible_host=10.0.5.1

# Behavioural overlay: hosts with no SSH/Python transport at all.
#
# EVERY `hosts: all` play must subtract this group (`all:!api_managed`).
# Because these hosts use ansible_connection: local, an apt/useradd task
# aimed at them does not fail — it SUCCEEDS, silently, against the control
# node instead. Membership here is behavioural; [network_appliances] above is
# the topology group.
[api_managed]
opnsense.home.lan


# -----------------------
# K8s topology
# -----------------------

[k8s_master]
k8s-master.home.lan    ansible_host=10.2.5.2

[k8s_workers]
k8s-worker.home.lan    ansible_host=10.2.5.3
k8s-worker-2.home.lan  ansible_host=10.2.5.4

[k8s:children]
k8s_master
k8s_workers

# Hosts whose PHYSICAL disks are worth SMART-monitoring, fed to Zabbix by
# playbooks/smart-monitor.yml. Membership is a monitoring decision, not a
# topology one, which is why this is its own group rather than a reuse of
# [proxmox_hosts]: pbs is bare metal rather than a hypervisor and would not
# belong there, and it is the one host here that had no coverage at all.
#
# A VM does not belong in this group. Its virtual disks expose no SMART data —
# verified 2026-08-25 on omv, where every /dev/sd* returns an empty model and
# empty health line — so adding one yields items that can never collect, which
# is worse than no item at all: it looks monitored.
[smart_monitored]
pbs.home.lan
pve.home.lan
pve-ai.home.lan
pve-router.home.lan

# -----------------------
# Global vars
# -----------------------
  
[all:vars]
ansible_user=ansible
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/home/ansible/.ssh/id_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=no
ansible_remote_tmp=/home/ansible/.ansible/tmp
 
become_allow_same_user=true
