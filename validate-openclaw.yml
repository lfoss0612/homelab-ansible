---
- name: Validate OpenClaw installation
  hosts: all
  become: true
  tasks:

    - name: Validate OpenClaw binary exists
      shell: test -x /opt/openclaw/releases/v2026.05.17-1/bin/openclaw
      register: oc_check
      ignore_errors: true

    - name: Fail if broken install
      fail:
        msg: "OpenClaw install is broken on this node"
      when: oc_check.rc != 0
