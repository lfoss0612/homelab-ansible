---
- name: Build OpenClaw inside release directory
  shell: |
    set -euo pipefail

    export NODE_ENV=production

    LOG=/var/log/openclaw/build.log
    mkdir -p /var/log/openclaw
    touch "$LOG"

    echo "[build] START $(date -Is)" | tee -a "$LOG"

    # Clean previous build artifacts
    rm -rf dist node_modules/.cache || true

    # Ensure dependencies exist (important for fresh releases)
    pnpm install 2>&1 | tee -a "$LOG"

    # Build backend
    stdbuf -oL -eL pnpm run build 2>&1 | tee -a "$LOG"

    # Build UI
    stdbuf -oL -eL pnpm run ui:build 2>&1 | tee -a "$LOG"

    echo "[build] END $(date -Is)" | tee -a "$LOG"
  args:
    chdir: "{{ openclaw_release_dir }}"
    executable: /bin/bash
  register: build_result

# ---------------------------------------------------
# HARD FAILURE IF BUILD FAILED
# ---------------------------------------------------
- name: Fail if build command failed
  ansible.builtin.fail:
    msg: "OpenClaw build process failed (pnpm build/ui:build returned error)"
  when: build_result.rc != 0

# ---------------------------------------------------
# VERIFY BUILD OUTPUT (STRICT)
# ---------------------------------------------------
- name: Verify dist directory exists
  ansible.builtin.stat:
    path: "{{ openclaw_release_dir }}/dist"
  register: dist_dir

- name: Fail if dist directory missing
  ansible.builtin.fail:
    msg: "Build failed: dist/ directory missing in release {{ openclaw_release_dir }}"
  when: not dist_dir.stat.exists

- name: Verify index.js exists
  ansible.builtin.stat:
    path: "{{ openclaw_release_dir }}/dist/index.js"
  register: dist_index

- name: Fail if dist/index.js missing
  ansible.builtin.fail:
    msg: "Build failed: dist/index.js missing in release {{ openclaw_release_dir }}"
  when: not dist_index.stat.exists
