---
- name: Ensure OpenClaw release directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: openclaw
    group: openclaw
    mode: "0755"
  loop:
    - /opt/openclaw
    - /opt/openclaw/releases

- name: Define release paths
  ansible.builtin.set_fact:
    openclaw_release_file: "/tmp/openclaw-{{ openclaw_version }}.tar.gz"
    openclaw_release_dir: "/opt/openclaw/releases/{{ openclaw_version }}"

- name: Create versioned release directory
  ansible.builtin.file:
    path: "{{ openclaw_release_dir }}"
    state: directory
    owner: openclaw
    group: openclaw
    mode: "0755"

- name: Download OpenClaw source release
  ansible.builtin.get_url:
    url: "{{ openclaw_tar_url }}"
    dest: "{{ openclaw_release_file }}"
    mode: "0644"

- name: Extract OpenClaw release into versioned directory
  ansible.builtin.unarchive:
    src: "{{ openclaw_release_file }}"
    dest: "{{ openclaw_release_dir }}"
    remote_src: yes
    owner: openclaw
    group: openclaw
    extra_opts:
      - --strip-components=1
