---
# Gateway deployment: npm-installed CLI, no source build. Order matters —
# back up state, install the shared runtime, template the unit, then
# health-gate before declaring success.

- name: Check whether OpenClaw state directory exists yet
  ansible.builtin.stat:
    path: "/home/{{ openclaw_user }}/.openclaw"
  register: openclaw_state_dir

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: /var/backups
    state: directory
    mode: "0755"

- name: Back up existing OpenClaw state before any changes
  ansible.builtin.command: >-
    tar czf /var/backups/openclaw-state-{{ ansible_date_time.iso8601_basic_short }}.tar.gz
    -C /home/{{ openclaw_user }} .openclaw
  args:
    creates: "/var/backups/openclaw-state-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
  when: openclaw_state_dir.stat.exists

- name: Tighten OpenClaw state file permissions
  ansible.builtin.file:
    path: "/home/{{ openclaw_user }}/.openclaw/openclaw.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "0600"
  when: openclaw_state_dir.stat.exists

# Tagged for the same reason as in the node role — see the note there.
- name: Install shared OpenClaw runtime
  ansible.builtin.include_role:
    name: openclaw.node.common
  tags: [privileges, dns, networkd]

# Found ON in a security audit 2026-08-04: gateway.controlUi.allowedOrigins
# includes the public duckdns hostname, so this was reachable well past a
# trusted LAN. The schema's own description calls the flag "short-lived
# debugging on trusted networks, then turn it off immediately" — it was
# never turned back off. Read/compare/patch/verify, same shape as the models
# role, for the same reason: `config set`'s exit code doesn't prove the
# write landed in the right file (see the runuser note there — running
# as root silently edits /root/.openclaw/openclaw.json instead).
#
# The three tasks below use `runuser -u {{ openclaw_user }}` rather than
# `become_user:`, because the ansible user's sudoers runas spec excludes openclaw
# (see playbooks/users/ansible-user.yml). They run from root, which is still
# permitted, and runuser sets HOME to the openclaw user's home — which is exactly
# the property the paragraph above depends on. runuser resets PATH, hence the
# absolute path from common's resolved npm prefix (common ran at line 34, so
# openclaw_npm_prefix is in scope).
- name: Read the current Control UI device-auth bypass setting
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config get gateway.controlUi.dangerouslyDisableDeviceAuth --json
  register: openclaw_device_auth_bypass
  changed_when: false
  check_mode: false
  failed_when: false
  when: openclaw_state_dir.stat.exists

- name: Harden the Control UI device-auth bypass setting
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config set gateway.controlUi.dangerouslyDisableDeviceAuth false --strict-json
  register: openclaw_device_auth_bypass_fix
  changed_when: openclaw_device_auth_bypass_fix.rc == 0
  when:
    - openclaw_state_dir.stat.exists
    - openclaw_device_auth_bypass.rc == 0
    - (openclaw_device_auth_bypass.stdout | from_json) == true
  notify: restart openclaw gateway

- name: Re-read the Control UI device-auth setting to confirm the write landed
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config get gateway.controlUi.dangerouslyDisableDeviceAuth --json
  register: openclaw_device_auth_bypass_verify
  # lint-check-mode: ignore (only runs when the write above changed something, never under --check)
  changed_when: false
  when:
    - openclaw_device_auth_bypass_fix is changed
    - not ansible_check_mode

- name: Assert the device-auth bypass is off
  ansible.builtin.assert:
    that:
      - (openclaw_device_auth_bypass_verify.stdout | from_json) == false
    fail_msg: >-
      Patch reported success but gateway.controlUi.dangerouslyDisableDeviceAuth
      is still {{ openclaw_device_auth_bypass_verify.stdout | default('(unreadable)') }}.
      Check that the CLI ran as {{ openclaw_user }} and not root — running as
      root edits /root/.openclaw/openclaw.json and reports success.
    quiet: true
  when:
    - openclaw_device_auth_bypass_fix is changed
    - not ansible_check_mode

# --- State migration on a package change -------------------------------------
# A new OpenClaw can change the on-disk state schema (SQLite, pairing stores,
# config), and `openclaw doctor --fix` is what migrates it -- but only with the
# gateway stopped. The package was just replaced by the common role (the running
# gateway still has the old binary in memory), so: stop, [optionally set the
# legacy agent DB aside], doctor, and let the "ensure running" task below start
# it. Skipped entirely when the package did not change, so a no-op run never
# stops the gateway.
#
# Doctor's own exit code is NOT trusted: it exits 1 at the very end because it
# cannot restart a system-scope unit as the openclaw user (seen 2026-11-17 on
# 2026.9.7 after a successful migration). The gateway health gate at the bottom
# of this role is the real check, and a doctor that left unmigrated state makes
# the gateway fail to start there. Only a doctor that is killed (rc >= 2, incl.
# timeout 124) fails here. The log is kept for diagnosis either way.
#
# This is a no-op on the first deploy (no state dir yet).
- name: Migrate OpenClaw state after a package change
  when:
    - openclaw_cli_install is defined
    - openclaw_cli_install is changed
    - openclaw_state_dir.stat.exists
    - not ansible_check_mode
  block:
    - name: Record the migration timestamp
      ansible.builtin.set_fact:
        openclaw_migrate_stamp: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"

    - name: Stop the gateway and node (doctor needs the gateway stopped)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: [openclaw-gateway.service, openclaw-node.service]
      when: item in (ansible_facts.services | default({}))

    - name: Find legacy per-agent SQLite databases
      ansible.builtin.find:
        paths: "/home/{{ openclaw_user }}/.openclaw/agents"
        patterns: ["openclaw-agent.sqlite", "openclaw-agent.sqlite-wal", "openclaw-agent.sqlite-shm"]
        recurse: true
      register: openclaw_legacy_agent_dbs
      when: openclaw_migrate_discard_legacy_agent_db | bool

    - name: Set the legacy agent databases aside (sessions in them are lost)
      ansible.builtin.shell: |
        set -e
        aside=/var/backups/openclaw-agent-legacy-{{ openclaw_migrate_stamp }}
        mkdir -p "$aside" && chmod 700 "$aside"
        mv {{ openclaw_legacy_agent_dbs.files | map(attribute='path') | map('quote') | join(' ') }} "$aside"/
      when:
        - openclaw_migrate_discard_legacy_agent_db | bool
        - openclaw_legacy_agent_dbs.files | length > 0

    - name: Run openclaw doctor --fix as the service user
      ansible.builtin.shell:
        cmd: >-
          runuser -u {{ openclaw_user }} --
          timeout {{ openclaw_doctor_timeout_seconds }}
          {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw doctor --fix --non-interactive
          > /var/tmp/openclaw-doctor-{{ openclaw_migrate_stamp }}.log 2>&1
      register: openclaw_doctor
      changed_when: true
      failed_when: openclaw_doctor.rc >= 2

    - name: Tail the doctor log
      ansible.builtin.command: tail -n 25 /var/tmp/openclaw-doctor-{{ openclaw_migrate_stamp }}.log
      register: openclaw_doctor_log
      # lint-check-mode: ignore (only runs when the write above changed something, never under --check)
      changed_when: false

    - name: Show the doctor log tail (rc {{ openclaw_doctor.rc }}; rc 1 is expected, see comment)
      ansible.builtin.debug:
        var: openclaw_doctor_log.stdout_lines
  rescue:
    - name: Fail loudly, leaving the gateway stopped
      ansible.builtin.fail:
        msg: >-
          OpenClaw state migration failed and the gateway was left STOPPED (the
          new package cannot be rolled back over migrated state, and the old one
          refuses a newer schema). Log: /var/tmp/openclaw-doctor-*.log on this
          host. Recover from the VM snapshot, or the state backup this role took
          at the top (/var/backups/openclaw-state-*.tar.gz).

- name: Install gateway systemd unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: /etc/systemd/system/openclaw-gateway.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart openclaw gateway

- name: Ensure the gateway service is enabled and running
  ansible.builtin.systemd:
    name: openclaw-gateway
    enabled: true
    state: started

- name: Flush handlers so the health check reflects the current unit
  ansible.builtin.meta: flush_handlers

- name: Wait for the gateway health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port }}/health"
    return_content: true
  register: openclaw_gateway_health
  until: openclaw_gateway_health.status == 200 and (openclaw_gateway_health.json.ok | default(false))
  retries: "{{ openclaw_gateway_health_retries }}"
  delay: 5

# gateway.trustedProxies takes effect without a restart (live reload). Read,
# compare, set, verify -- same shape as the device-auth task above.
- name: Read gateway.trustedProxies
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config get gateway.trustedProxies --json
  register: openclaw_trusted_proxies_now
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openclaw_gateway_trusted_proxies | length > 0
    - openclaw_version is version(openclaw_gateway_trusted_proxies_min_version, '>=')

- name: Set gateway.trustedProxies
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config set gateway.trustedProxies '{{ openclaw_gateway_trusted_proxies | to_json }}' --strict-json
  when:
    - openclaw_gateway_trusted_proxies | length > 0
    - openclaw_version is version(openclaw_gateway_trusted_proxies_min_version, '>=')
    - >-
      openclaw_trusted_proxies_now.rc != 0 or
      (openclaw_trusted_proxies_now.stdout | from_json) != openclaw_gateway_trusted_proxies

