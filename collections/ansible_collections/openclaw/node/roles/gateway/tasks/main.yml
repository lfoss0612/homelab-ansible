---
# Gateway deployment: npm-installed CLI, no source build. Order matters —
# back up state, install the shared runtime, template the unit, then
# health-gate before declaring success.

- name: Check whether OpenClaw state directory exists yet
  ansible.builtin.stat:
    path: "/home/{{ openclaw_user }}/.openclaw"
  register: openclaw_state_dir

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: /var/backups
    state: directory
    mode: "0755"

- name: Back up existing OpenClaw state before any changes
  ansible.builtin.command: >-
    tar czf /var/backups/openclaw-state-{{ ansible_date_time.iso8601_basic_short }}.tar.gz
    -C /home/{{ openclaw_user }} .openclaw
  args:
    creates: "/var/backups/openclaw-state-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
  when: openclaw_state_dir.stat.exists

- name: Tighten OpenClaw state file permissions
  ansible.builtin.file:
    path: "/home/{{ openclaw_user }}/.openclaw/openclaw.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "0600"
  when: openclaw_state_dir.stat.exists

# Tagged for the same reason as in the node role — see the note there.
- name: Install shared OpenClaw runtime
  ansible.builtin.include_role:
    name: openclaw.node.common
  tags: [privileges, dns, networkd]

# Found ON in a security audit 2026-08-04: gateway.controlUi.allowedOrigins
# includes the public duckdns hostname, so this was reachable well past a
# trusted LAN. The schema's own description calls the flag "short-lived
# debugging on trusted networks, then turn it off immediately" — it was
# never turned back off. Read/compare/patch/verify, same shape as the models
# role, for the same reason: `config set`'s exit code doesn't prove the
# write landed in the right file (see the runuser note there — running
# as root silently edits /root/.openclaw/openclaw.json instead).
#
# The three tasks below use `runuser -u {{ openclaw_user }}` rather than
# `become_user:`, because the ansible user's sudoers runas spec excludes openclaw
# (see playbooks/users/ansible-user.yml). They run from root, which is still
# permitted, and runuser sets HOME to the openclaw user's home — which is exactly
# the property the paragraph above depends on. runuser resets PATH, hence the
# absolute path from common's resolved npm prefix (common ran at line 34, so
# openclaw_npm_prefix is in scope).
- name: Read the current Control UI device-auth bypass setting
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config get gateway.controlUi.dangerouslyDisableDeviceAuth --json
  register: openclaw_device_auth_bypass
  changed_when: false
  check_mode: false
  failed_when: false
  when: openclaw_state_dir.stat.exists

- name: Harden the Control UI device-auth bypass setting
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config set gateway.controlUi.dangerouslyDisableDeviceAuth false --strict-json
  register: openclaw_device_auth_bypass_fix
  changed_when: openclaw_device_auth_bypass_fix.rc == 0
  when:
    - openclaw_state_dir.stat.exists
    - openclaw_device_auth_bypass.rc == 0
    - (openclaw_device_auth_bypass.stdout | from_json) == true
  notify: restart openclaw gateway

- name: Re-read the Control UI device-auth setting to confirm the write landed
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ openclaw_user }} --
      {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
      config get gateway.controlUi.dangerouslyDisableDeviceAuth --json
  register: openclaw_device_auth_bypass_verify
  changed_when: false
  when:
    - openclaw_device_auth_bypass_fix is changed
    - not ansible_check_mode

- name: Assert the device-auth bypass is off
  ansible.builtin.assert:
    that:
      - (openclaw_device_auth_bypass_verify.stdout | from_json) == false
    fail_msg: >-
      Patch reported success but gateway.controlUi.dangerouslyDisableDeviceAuth
      is still {{ openclaw_device_auth_bypass_verify.stdout | default('(unreadable)') }}.
      Check that the CLI ran as {{ openclaw_user }} and not root — running as
      root edits /root/.openclaw/openclaw.json and reports success.
    quiet: true
  when:
    - openclaw_device_auth_bypass_fix is changed
    - not ansible_check_mode

- name: Install gateway systemd unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: /etc/systemd/system/openclaw-gateway.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart openclaw gateway

- name: Ensure the gateway service is enabled and running
  ansible.builtin.systemd:
    name: openclaw-gateway
    enabled: true
    state: started

- name: Flush handlers so the health check reflects the current unit
  ansible.builtin.meta: flush_handlers

- name: Wait for the gateway health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port }}/health"
    return_content: true
  register: openclaw_gateway_health
  until: openclaw_gateway_health.status == 200 and (openclaw_gateway_health.json.ok | default(false))
  retries: 12
  delay: 5
