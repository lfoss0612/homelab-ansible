---
- name: Ensure systemd drop-in directory exists
  file:
    path: /etc/systemd/system/openclaw-gateway.service.d
    state: directory
    mode: "0755"

- name: Install OpenClaw systemd override (debug enabled)
  copy:
    dest: /etc/systemd/system/openclaw-gateway.service.d/override.conf
    mode: "0644"
    content: |
      [Service]

      WorkingDirectory=/opt/openclaw/current

      ExecStart=

      ExecStart=/usr/bin/node /opt/openclaw/current/dist/index.js gateway \
        --bind lan \
        --port 18789 \
        --allow-unconfigured

      Environment=NODE_ENV=production
      Environment=DEBUG=*
      Environment=NODE_OPTIONS=--trace-warnings --trace-deprecation

      StandardOutput=journal+console

      TimeoutStartSec=300
      TimeoutStopSec=60
      Restart=always
      RestartSec=5

- name: Reload systemd
  systemd:
    daemon_reload: true
