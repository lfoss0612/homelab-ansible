---
- name: update ca certificates
  ansible.builtin.command: update-ca-certificates

# Supplementary groups are resolved at process start, so a running agent keeps
# its old set until restarted — without this the journal/adm access silently
# does not take effect until the next unrelated restart.
#
# Only units that already exist are touched. On a first deploy neither is
# present yet, and the node/gateway roles start them afterwards with the right
# groups already in place.
#
# Tagged to match the tasks that notify it: handlers are tag-filtered too, so an
# untagged handler is silently dropped from a `--tags privileges` run even when
# notified. An untagged full run still executes it, since no filter applies.
- name: restart openclaw units for group membership
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - openclaw-gateway.service
    - openclaw-node.service
  when: item in (ansible_facts.services | default({}))
  tags: privileges

# Only notified when a DNS-block task actually edits resolved.conf or a
# drop-in, and only reachable at all when systemd-resolved.service already
# exists on the host (see the `when` guards in the dns tasks) — so this never
# fires on a host that doesn't run it.
- name: restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: restarted
  tags: dns

# A DNS= edit in a .network file does nothing until networkd re-reads it, and
# resolved only learns the new per-link servers once networkd pushes them.
#
# Deliberately `networkctl reload`, NOT `systemctl restart systemd-networkd`:
# the restart can bounce interfaces, and on pve-router those interfaces are
# vmbr0/vmbr1 -- the bridges the OPNsense VM's taps sit on, i.e. the whole
# house network. reload re-applies configuration in place.
- name: reload systemd-networkd
  ansible.builtin.command: networkctl reload
  when: "'systemd-networkd.service' in ansible_facts.services"
  tags: dns

# agent2 parses UserParameters at startup, so a new drop-in does nothing until
# the agent restarts. Tagged to match the task that notifies it — handlers are
# tag-filtered too, so an untagged handler is silently dropped from a
# `--tags zabbix` run even when notified (same trap as the openclaw units
# handler above).
- name: restart zabbix agent2
  ansible.builtin.systemd:
    name: zabbix-agent2.service
    state: restarted
  tags: zabbix
