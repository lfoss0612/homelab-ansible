---
# Shared install surface for both the gateway and node roles. The openclaw
# CLI is installed once via npm; there is no more per-host build or a
# releases/current/shared directory tree — npm owns the install.

- name: Get installed Node.js version
  ansible.builtin.command: node -v
  register: openclaw_node_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Normalize installed Node.js version (a missing/broken node reads as 0.0.0)
  ansible.builtin.set_fact:
    openclaw_node_installed_version_clean: >-
      {{ (openclaw_node_installed_version.stdout | trim | regex_replace('^v', ''))
         if openclaw_node_installed_version.rc == 0 else '0.0.0' }}

- name: Determine whether Node.js needs upgrading
  ansible.builtin.set_fact:
    openclaw_node_needs_upgrade: >-
      {{ openclaw_node_installed_version_clean is version(openclaw_node_min_version, '<') }}

# Guard on the installed version, not `creates:` — this must also catch a
# host that already has an older Node.js from a previous NodeSource install.
# The NodeSource repo itself is assumed already configured (Phase 3); this
# does not rewrite nodesource.sources.
- name: Upgrade Node.js to the {{ openclaw_node_min_version }} floor
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
  when: openclaw_node_needs_upgrade

- name: Create openclaw group
  ansible.builtin.group:
    name: "{{ openclaw_group }}"
    system: true

- name: Create openclaw user
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    system: true
    home: "/home/{{ openclaw_user }}"
    shell: /bin/bash
    create_home: true

# The read half of the read plane. Group membership, not sudo: it confers log
# visibility and no ability to change anything. Intersected with the real group
# database so a host missing one of them is skipped, never has it created.
- name: Read the group database
  ansible.builtin.getent:
    database: group
  tags: privileges

- name: Collect service facts
  ansible.builtin.service_facts:
  tags: [privileges, dns, networkd]

- name: Grant the openclaw user read-only log access
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    groups: "{{ openclaw_read_groups | intersect(ansible_facts.getent_group.keys() | list) }}"
    append: true
  notify: restart openclaw units for group membership
  tags: privileges

# --- Read-plane enforcement -------------------------------------------------
# The agent observes; Ansible makes changes. Root capability here is a
# write-plane grant and defeats that split. An unrestricted
# `NOPASSWD: /usr/bin/systemctl` is not a service-restart grant but full root:
# the user owns its home, so `systemctl link ~/unit.service && systemctl start`
# runs arbitrary code as root. The fleet had such grants in both locations
# before this was managed — /etc/sudoers.d/openclaw on the 11 nodes, an inline
# /etc/sudoers line on the gateway — so both are reconciled here.
#
# `validate: visudo -cf %s` on both tasks is load-bearing: a malformed sudoers
# file locks every user out of sudo, and validation happens on the temp file
# before it is moved into place.
#
# All six tasks above and below carry `tags: privileges` so the privilege
# change can be applied on its own, without the npm install task dragging the
# fleet from 2026.5.26 to the pinned version as a side effect.

- name: Remove inline openclaw grants from /etc/sudoers
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^\s*{{ openclaw_user }}\s+ALL\s*='
    state: absent
    validate: visudo -cf %s
  tags: privileges

- name: Remove the openclaw sudo grant
  ansible.builtin.file:
    path: /etc/sudoers.d/openclaw
    state: absent
  when: openclaw_sudo_commands | length == 0
  tags: privileges

- name: Install a scoped openclaw sudo grant
  ansible.builtin.copy:
    dest: /etc/sudoers.d/openclaw
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
    content: |
      # Managed by Ansible — openclaw.node.common role. Do not edit on the host;
      # set openclaw_sudo_commands instead. See docs/execution-model.md.
      {% for command in openclaw_sudo_commands %}
      {{ openclaw_user }} ALL=(root) NOPASSWD: {{ command }}
      {% endfor %}
  when: openclaw_sudo_commands | length > 0
  tags: privileges

- name: Install Home LAN Internal CA
  ansible.builtin.copy:
    src: home-lan-ca.crt
    dest: /usr/local/share/ca-certificates/home-lan-ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: update ca certificates

- name: Ensure log directory exists
  ansible.builtin.file:
    path: /var/log/openclaw
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "0755"

# The openclaw node process chmods this directory back to 0755 within
# seconds of every start (writing the Memory Core sqlite db there) — a
# fight the role always loses. Declaring 0700 produced a permanent
# changed=1 on every deploy --check across the fleet with no real security
# benefit: everything sensitive inside (openclaw.json, node.json,
# exec-approvals.json, and the identity/state/plugins/cache/flows
# subdirs) already carries its own restrictive mode independent of this
# parent. See homelab-vault TODO.md ("OpenClaw .openclaw permission
# fight", closed 2026-08-09) for the full investigation.
- name: Ensure openclaw home state directory exists
  ansible.builtin.file:
    path: "/home/{{ openclaw_user }}/.openclaw"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "0755"

- name: Resolve global npm prefix
  ansible.builtin.command: npm prefix -g
  register: openclaw_npm_prefix
  changed_when: false
  check_mode: false

- name: Stat the openclaw CLI path in the npm prefix
  ansible.builtin.stat:
    path: "{{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw"
  register: openclaw_cli_in_prefix

# A plain file here (not an npm-managed symlink) makes `npm install -g` fail
# EEXIST. Move it aside rather than removing it — see Phase 2d/4 of the
# fleet migration plan for the per-host collision matrix.
- name: Move aside a pre-existing openclaw CLI that would collide with npm install
  ansible.builtin.command: >-
    mv {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw
    {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw.pre-npm.disabled
  when:
    - openclaw_cli_in_prefix.stat.exists
    - not openclaw_cli_in_prefix.stat.islnk

# Separately: a hand-written wrapper at /usr/local/bin/openclaw shadows the
# npm-installed binary on any host whose npm prefix is /usr, because
# /usr/local/bin precedes /usr/bin on PATH. Only relevant when the prefix
# itself isn't /usr/local (else the two checks above and below are the same
# file).
- name: Stat a hand-written wrapper shadowing the npm-installed CLI
  ansible.builtin.stat:
    path: /usr/local/bin/openclaw
  register: openclaw_cli_shadow
  when: (openclaw_npm_prefix.stdout | trim) != '/usr/local'

- name: Move aside a shadowing wrapper on a higher-priority PATH entry
  ansible.builtin.command: mv /usr/local/bin/openclaw /usr/local/bin/openclaw.pre-npm.disabled
  when:
    - (openclaw_npm_prefix.stdout | trim) != '/usr/local'
    - openclaw_cli_shadow.stat is defined
    - openclaw_cli_shadow.stat.exists
    - not openclaw_cli_shadow.stat.islnk

- name: Check installed openclaw CLI version
  ansible.builtin.command: openclaw --version
  register: openclaw_cli_version
  changed_when: false
  failed_when: false
  check_mode: false

# Postinstall (postinstall-bundled-plugins.mjs) is allowed to run — no
# --ignore-scripts — it installs the bundled plugins the CLI expects.
- name: Install/upgrade the openclaw CLI via npm
  ansible.builtin.command: "npm install -g openclaw@{{ openclaw_version }}"
  when: >-
    openclaw_cli_version.rc != 0 or
    openclaw_version not in openclaw_cli_version.stdout

# --- DNS resolver assertion -------------------------------------------------
# Independently-gated fixes for DNS misconfigurations found by hand on the
# gateway, pbs, and pve-ai on 2026-08-02 (see docs/execution-model.md and
# homelab-vault TODO.md) — none of which were git-tracked, so a rebuild of
# any of those hosts reintroduced the same breakage. OPNsense/Unbound is
# already the correct resolver on every VLAN; each fix below just undoes a
# local override that bypasses it. Each is a no-op (changed=0) on a host
# that doesn't have the specific problem.
#
# Two of the three original findings are auto-fixed here (immutable
# resolv.conf, resolved.conf override) and confirmed against the live fleet
# to only fire on genuine instances — including catching a 4th, previously
# undocumented case of the resolved.conf override on `pve`. The third
# (stale /etc/hosts self-reference) is report-only, not auto-removed — see
# the comment above that task for why.
#
# `openclaw_dns_resolver` defaults to this host's own default gateway
# (common/defaults/main.yml) — OPNsense is the router on every VLAN here, so
# that stays correct without a per-VLAN lookup table.
#
# The `include_role` for this role is tagged `[privileges, dns]` in both the
# node and gateway roles — same gotcha as `privileges`: with a dynamic
# include, --tags is matched against the include first, so a task tagged
# `dns` here is unreachable unless the include itself also carries that tag.

- name: Gather network facts for DNS assertion, if not already present
  ansible.builtin.setup:
    gather_subset: network
  when: ansible_default_ipv4 is not defined
  tags: dns

# The pbs case: a static resolv.conf, deliberately made immutable so nothing
# (including DHCP) can silently overwrite it, but pointed at the wrong IP.
# Non-immutable hosts are left alone — those are NetworkManager/resolvconf
# managed and already track DHCP-learned per-link DNS correctly as long as
# nothing else overrides it (handled below).
- name: Check for an immutable /etc/resolv.conf
  ansible.builtin.command: lsattr -d /etc/resolv.conf
  register: openclaw_resolv_conf_lsattr
  changed_when: false
  failed_when: false
  check_mode: false
  tags: dns

- name: Read current /etc/resolv.conf
  ansible.builtin.slurp:
    path: /etc/resolv.conf
  register: openclaw_resolv_conf_raw
  tags: dns

- name: Determine whether an immutable resolv.conf needs correcting
  # Each clause must itself evaluate to a real boolean before `and`-chaining
  # them: regex_search() returns None (not False) on no match, and
  # `None and X` short-circuits to None rather than False. A strict/native
  # Jinja `when:` rejects a None result outright ("Conditionals must have a
  # boolean result") — hence `is not none` rather than a bare truthy check.
  ansible.builtin.set_fact:
    openclaw_resolv_conf_needs_fix: >-
      {{ (openclaw_resolv_conf_lsattr.rc == 0) and
         ((openclaw_resolv_conf_lsattr.stdout | regex_search('^\S*i\S* ')) is not none) and
         (('nameserver ' ~ openclaw_dns_resolver) not in (openclaw_resolv_conf_raw.content | b64decode)) }}
  tags: dns

- name: Remove immutable attribute before correcting resolv.conf
  ansible.builtin.command: chattr -i /etc/resolv.conf
  when: openclaw_resolv_conf_needs_fix
  tags: dns

- name: Correct an immutable resolv.conf to point at the OPNsense resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      search home.lan
      nameserver {{ openclaw_dns_resolver }}
    owner: root
    group: root
    mode: "0644"
  when: openclaw_resolv_conf_needs_fix
  tags: dns

- name: Restore the immutable attribute on resolv.conf
  ansible.builtin.command: chattr +i /etc/resolv.conf
  when: openclaw_resolv_conf_needs_fix
  tags: dns

# The pve-ai case: a correct per-link DHCP-provided DNS= config, shadowed by
# a global override in resolved.conf (or a drop-in) pointing somewhere else.
# Removing the override — not replacing it — is deliberate: it lets the
# correct per-link value win instead of hardcoding a second place the
# resolver IP has to be kept in sync.
- name: Look for a global DNS override in resolved.conf
  ansible.builtin.command: grep -E '^DNS=' /etc/systemd/resolved.conf
  register: openclaw_resolved_conf_dns
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'systemd-resolved.service' in ansible_facts.services"
  tags: dns

- name: Remove a global DNS override that isn't the OPNsense resolver
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^DNS='
    state: absent
  when:
    - "'systemd-resolved.service' in ansible_facts.services"
    - openclaw_resolved_conf_dns.rc == 0
    - openclaw_dns_resolver not in openclaw_resolved_conf_dns.stdout
  notify: restart systemd-resolved
  tags: dns

- name: Find systemd-resolved drop-ins
  ansible.builtin.find:
    paths: /etc/systemd/resolved.conf.d
    patterns: "*.conf"
  register: openclaw_resolved_dropins
  when: "'systemd-resolved.service' in ansible_facts.services"
  tags: dns

- name: Check each drop-in for a DNS override
  ansible.builtin.command: grep -E '^DNS=' {{ item.path }}
  loop: "{{ openclaw_resolved_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: openclaw_resolved_dropin_dns
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'systemd-resolved.service' in ansible_facts.services"
  tags: dns

- name: Remove a drop-in DNS override that isn't the OPNsense resolver
  ansible.builtin.lineinfile:
    path: "{{ item.item.path }}"
    regexp: '^DNS='
    state: absent
  loop: "{{ openclaw_resolved_dropin_dns.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path | default('n/a') }}"
  when:
    - "'systemd-resolved.service' in ansible_facts.services"
    - item.rc is defined
    - item.rc == 0
    - openclaw_dns_resolver not in item.stdout
  notify: restart systemd-resolved
  tags: dns

# The gateway case: a stale self-referential /etc/hosts entry (predating a
# routing change) shadowing what DNS would otherwise correctly resolve.
#
# NOT auto-removed, deliberately — a non-loopback "own IP -> own hostname"
# line is normal on most hosts (cloud-init/provisioning writes it so a host
# can resolve its own name before DNS is up), confirmed against the live
# fleet: `k8s-worker` and `pve` both have exactly this pattern with a
# correct, current IP, and blindly stripping it would have removed
# legitimate config on most of the fleet. The gateway's actual bug was
# narrower — its own node process needed to route to itself *through
# HAProxy*, and a same-named entry pointing straight at its own LAN IP
# bypassed that — which isn't reliably distinguishable from the benign case
# without knowing about that specific routing requirement. So: report only,
# for a human to judge, same pattern as the "reported, not asserted" doctor
# findings in validate-openclaw.yml.
- name: Find non-loopback /etc/hosts entries for this host's own name
  ansible.builtin.shell: >-
    set -o pipefail;
    grep -E '^[0-9]' /etc/hosts | grep -vE '^127\.' | grep -w '{{ inventory_hostname }}' || true
  args:
    executable: /bin/bash
  register: openclaw_hosts_self_ref
  changed_when: false
  check_mode: false
  tags: dns

# --- systemd-resolved standardization ---------------------------------------
# Opt-in per host (openclaw_resolved_standardize, default false — see
# common/defaults/main.yml) as the fleet-wide standardize-on-systemd-resolved
# TODO (homelab-vault TODO.md) is rolled out one audited host at a time.
# Installs/enables systemd-resolved and repoints /etc/resolv.conf at its stub.
#
# Safety gate: resolution is proven working *through resolved specifically*
# (resolvectl talks to the resolved daemon directly, independent of whatever
# /etc/resolv.conf currently points at) before the existing, working
# /etc/resolv.conf is touched at all. If that check fails, the cutover tasks
# below are skipped — a safe no-op, not a play failure — and the host keeps
# resolving exactly as it did before this ran.

- name: Install systemd-resolved
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
  register: openclaw_resolved_install
  when: openclaw_resolved_standardize
  tags: dns

- name: Enable and start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
    enabled: true
    state: started
  when: openclaw_resolved_standardize
  tags: dns

# Found on pbs 2026-08-03: a systemd-resolved that has never run on this host
# before can lose its own D-Bus name-registration race on its very first
# start -- dbus.service is typically already running (long-lived, predates
# the install) and hasn't necessarily re-scanned /usr/share/dbus-1 for the
# resolve1 activation file the package just dropped, right when resolved's
# own startup tries to claim that name. The process stays up (systemd sees
# it as active) but resolvectl/anything over D-Bus times out
# ("Failed to activate service 'org.freedesktop.resolve1'"). Restarting the
# already-running daemon after the fresh install clears it reliably; only
# fires on the run that actually just installed the package, never on a
# host where it was already present and working.
- name: Restart systemd-resolved once, to clear a first-install D-Bus registration race
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: restarted
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_install.changed | default(false)
  tags: dns

# systemd-networkd pushes each link's DNS= servers to resolved over D-Bus as
# part of applying a link's configuration -- it does this when the link comes
# up, not retroactively just because resolved started existing. A host whose
# link was already configured before resolved was ever installed (the pbs
# case: networkd has owned enp3s0, DNS= included, since before this task
# existed) needs one reload to make it push that already-correct config to
# the now-running daemon. Reload, not restart: re-applies config over the
# existing bus connection without tearing down the daemon or the interface.
- name: Reload systemd-networkd so it (re)registers DNS servers with resolved
  ansible.builtin.systemd:
    name: systemd-networkd.service
    state: reloaded
  when:
    - openclaw_resolved_standardize
    - "'systemd-networkd.service' in (ansible_facts.services | default({}))"
  tags: dns

- name: Check whether /etc/resolv.conf already points at the resolved stub
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false
  register: openclaw_resolv_conf_link
  when: openclaw_resolved_standardize
  tags: dns

- name: Determine whether the stub cutover is still needed
  ansible.builtin.set_fact:
    openclaw_resolved_cutover_needed: >-
      {{ not (openclaw_resolv_conf_link.stat.islnk | default(false) and
              'stub-resolv.conf' in (openclaw_resolv_conf_link.stat.lnk_source | default(''))) }}
  when: openclaw_resolved_standardize
  tags: dns

# Read, not written -- safe even while the file is still chattr +i.  force:
# false makes this a one-time backup: later idempotent runs (already migrated)
# never reach this block at all (openclaw_resolved_cutover_needed is false by
# then), but force: false is cheap insurance if it's ever re-run mid-cutover.
- name: Back up the pre-migration /etc/resolv.conf
  ansible.builtin.copy:
    src: /etc/resolv.conf
    dest: /etc/resolv.conf.pre-resolved-migration
    remote_src: true
    force: false
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
  tags: dns

- name: Check for an immutable /etc/resolv.conf before cutover
  ansible.builtin.command: lsattr -d /etc/resolv.conf
  register: openclaw_resolved_cutover_lsattr
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
  tags: dns

- name: Remove immutable attribute before cutover
  ansible.builtin.command: chattr -i /etc/resolv.conf
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
    - openclaw_resolved_cutover_lsattr.rc == 0
    - (openclaw_resolved_cutover_lsattr.stdout | regex_search('^\S*i\S* ')) is not none
  tags: dns

# The actual safety gate. resolvectl queries resolved directly -- this proves
# end-to-end resolution works through the daemon *before* the known-working
# /etc/resolv.conf is replaced, not after.
- name: Prove resolution works through resolved before touching resolv.conf
  ansible.builtin.command: resolvectl query openclaw.home.lan
  register: openclaw_resolved_precheck
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
  tags: dns

- name: Report a failed pre-cutover resolution check
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: resolvectl could not resolve through
      systemd-resolved ({{ openclaw_resolved_precheck.stdout
      | default(openclaw_resolved_precheck.stderr) | default('no output') }}).
      Leaving /etc/resolv.conf untouched -- not cutting over this run.
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
    - openclaw_resolved_precheck.rc != 0
  tags: dns

- name: Point /etc/resolv.conf at the resolved stub
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: link
    src: /run/systemd/resolve/stub-resolv.conf
    force: true
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
    - openclaw_resolved_precheck.rc == 0
  tags: dns

- name: Verify resolution still works after cutover
  ansible.builtin.command: getent hosts openclaw.home.lan
  register: openclaw_resolved_postcheck
  changed_when: false
  failed_when: openclaw_resolved_postcheck.rc != 0
  check_mode: false
  when:
    - openclaw_resolved_standardize
    - openclaw_resolved_cutover_needed
    - openclaw_resolved_precheck.rc == 0
  tags: dns

# --- systemd-networkd static config correction -------------------------------
# Opt-in per host via openclaw_networkd_static_network (a dict; empty/unset is
# a no-op for every host that doesn't need it). For a host where networkd
# already owns the interface but its .network file has the wrong directive --
# pdm's DHCP=yes, when the subnet's dynamic pool doesn't cover its address at
# all (10.0.5.8 is below the LAB pool's 10.0.5.50 floor -- see homelab-vault
# Network/dhcp.md) -- this replaces it with a static config matching every
# other host on the subnet, then proves address assignment actually works
# live BEFORE the ifupdown-masking task below is allowed to run.
#
# ifupdown is deliberately left running during the write+verify: since the
# target values match exactly what ifupdown already has applied, having both
# active at once here is provably safe (identical to cockpit's permanent,
# harmless duplicate-config state) -- there's always a working fallback in
# place while networkd's own config is being proven, unlike the first attempt
# at this (2026-08-04), which masked ifupdown before ever confirming networkd
# could actually bring the interface up on its own, and caused a real
# connectivity outage when it turned out it couldn't (DHCP=yes against a pool
# that would never serve that address).

- name: Write a static networkd config, replacing a broken/incorrect directive
  ansible.builtin.copy:
    dest: "/etc/systemd/network/10-{{ openclaw_networkd_static_network.iface }}.network"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Match]
      Name={{ openclaw_networkd_static_network.iface }}

      [Network]
      Address={{ openclaw_networkd_static_network.address }}
      Gateway={{ openclaw_networkd_static_network.gateway }}
      {% for server in openclaw_networkd_static_network.dns %}
      DNS={{ server }}
      {% endfor %}
      {% if openclaw_networkd_static_network.domains is defined %}
      Domains={{ openclaw_networkd_static_network.domains }}
      {% endif %}
  register: openclaw_networkd_static_write
  when: (openclaw_networkd_static_network | default({})) | length > 0
  tags: networkd

- name: Enable and start systemd-networkd to test the corrected config
  ansible.builtin.systemd:
    name: systemd-networkd.service
    enabled: true
    state: started
  when: (openclaw_networkd_static_network | default({})) | length > 0
  tags: networkd

- name: Reload systemd-networkd if the config file just changed
  ansible.builtin.systemd:
    name: systemd-networkd.service
    state: reloaded
  when:
    - (openclaw_networkd_static_network | default({})) | length > 0
    - openclaw_networkd_static_write.changed
  tags: networkd

# A fixed, bounded wait -- not a hang-risking networkctl reconfigure/query
# call like the ones that got stuck for minutes earlier tonight.
- name: Give networkd a moment to apply the corrected config
  ansible.builtin.pause:
    seconds: 5
  when: (openclaw_networkd_static_network | default({})) | length > 0
  tags: networkd

- name: Check the interface's actual live address
  ansible.builtin.command: "ip -4 addr show {{ openclaw_networkd_static_network.iface }}"
  register: openclaw_networkd_static_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: (openclaw_networkd_static_network | default({})) | length > 0
  tags: networkd

- name: Set whether the static networkd config is confirmed working
  ansible.builtin.set_fact:
    openclaw_networkd_static_confirmed: >-
      {{ (openclaw_networkd_static_network.address.split('/')[0] ~ '/') in (openclaw_networkd_static_check.stdout | default(''))
         if (openclaw_networkd_static_network | default({})) | length > 0
         else true }}
  tags: networkd

- name: Report a failed static networkd config verification
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: expected address
      {{ openclaw_networkd_static_network.address }} on
      {{ openclaw_networkd_static_network.iface }} but it wasn't found live --
      NOT masking ifupdown this run. ifupdown is still active as a fallback.
  when:
    - (openclaw_networkd_static_network | default({})) | length > 0
    - not openclaw_networkd_static_confirmed
  tags: networkd

# --- systemd-networkd standardization ----------------------------------------
# Opt-in per host (openclaw_networkd_standardize, default false), same rollout
# philosophy as the resolved work above: a pre-migration audit per host,
# flipped on individually via host_vars, not a fleet-wide default. Only masks
# networking.service (ifupdown) -- never touches an interface, address, route,
# or DNS setting. The `masked` param on the systemd module is itself
# idempotent, so this is a no-op once already masked. Gated additionally on
# openclaw_networkd_static_confirmed (defaults true when no static-network
# correction applies to this host, so this is unchanged for cockpit/the
# gateway) -- for a host that needed the correction above, masking only
# proceeds once networkd is proven to actually hold the interface up itself.
- name: Mask networking.service now that systemd-networkd owns the interface
  ansible.builtin.systemd:
    name: networking.service
    masked: true
  when:
    - openclaw_networkd_standardize
    - "'networking.service' in (ansible_facts.services | default({}))"
    - openclaw_networkd_static_confirmed | default(true)
  tags: networkd

# --- systemd-networkd migration from NetworkManager --------------------------
# Opt-in per host (openclaw_networkd_migrate_from_nm, default false).
# Deliberately staged as prep-only: writes the matching .network file and
# disables NetworkManager -- but only for the *next* boot (enabled/disabled,
# never started/stopped). No separate package to install: systemd-networkd
# ships inside the base systemd package (confirmed via dpkg -S on desktop —
# `apt install systemd-networkd` fails outright, "No package matching" — the
# unit already exists, just disabled). The live interface is never touched
# by this play; a host on this path needs an actual reboot, on its own
# schedule, to complete the cutover -- see the report task below.

- name: Write the networkd config for the migrated interface
  ansible.builtin.copy:
    dest: "/etc/systemd/network/10-{{ openclaw_networkd_migrate_iface }}.network"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Match]
      Name={{ openclaw_networkd_migrate_iface }}

      [Network]
      DHCP=yes
  when: openclaw_networkd_migrate_from_nm
  tags: networkd

- name: Enable systemd-networkd for the next boot (NetworkManager migration)
  ansible.builtin.systemd:
    name: systemd-networkd.service
    enabled: true
  when: openclaw_networkd_migrate_from_nm
  tags: networkd

- name: Disable NetworkManager from starting on the next boot
  ansible.builtin.systemd:
    name: NetworkManager.service
    enabled: false
  when: openclaw_networkd_migrate_from_nm
  tags: networkd

- name: Report that a reboot is required to complete the networkd migration
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: systemd-networkd is prepped and enabled,
      NetworkManager is disabled for the next boot -- nothing has changed on
      the live interface. Reboot when convenient to complete the cutover,
      then verify with `networkctl status {{ openclaw_networkd_migrate_iface }}`
      and `ip addr show {{ openclaw_networkd_migrate_iface }}`.
  when: openclaw_networkd_migrate_from_nm
  tags: networkd

- name: Report a non-loopback /etc/hosts entry for this host's own name
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has a non-loopback /etc/hosts entry for its own
      name: {{ openclaw_hosts_self_ref.stdout_lines | join('; ') }}. Usually
      benign (fast local self-resolution) — only a problem if it's stale or
      bypasses routing that should go through DNS instead (the gateway's
      HAProxy migration bug). Not auto-removed; review by hand.
  when: (openclaw_hosts_self_ref.stdout_lines | default([])) | length > 0
  tags: dns
