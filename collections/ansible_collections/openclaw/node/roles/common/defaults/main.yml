---
openclaw_user: openclaw
openclaw_group: openclaw
openclaw_version: "latest"
openclaw_node_min_version: "22.22.3"

# Root capabilities granted to the openclaw runtime user, as sudoers command
# specs. Empty is the read-plane default: the agent observes, Ansible changes
# things (docs/execution-model.md), so it needs no root at all. Any entry added
# here is a write-plane grant — scope it to an exact command with arguments,
# never a bare binary path.
openclaw_sudo_commands: []

# Supplementary groups giving the agent the read half of the read plane. These
# replace what the sudo grant was really being used for — reading logs — with
# capability that cannot mutate anything:
#   systemd-journal  full journal, every unit (without it the agent sees only
#                    its own uid's entries, and not even those on the gateway)
#   adm              the root:adm / syslog:adm files under /var/log, e.g.
#                    syslog, auth.log, and the Proxmox task logs
# Groups absent on a host are skipped rather than created.
openclaw_read_groups:
  - systemd-journal
  - adm

# Expected DNS resolver for this host. OPNsense (Unbound) is both the router
# and the resolver on every VLAN in this network, so the host's own default
# gateway is a correct, subnet-agnostic proxy for "the right nameserver" —
# no per-VLAN lookup table to keep in sync, and it self-adjusts if a VLAN's
# OPNsense IP ever changes. Override per-host/group if a VLAN's resolver and
# gateway ever diverge.
openclaw_dns_resolver: "{{ ansible_default_ipv4.gateway }}"

# Opt-in, per-host: install/enable systemd-resolved and repoint /etc/resolv.conf
# at its stub, only on hosts explicitly flipped on via host_vars. Default false —
# fleet-wide standardization (homelab-vault TODO.md) is being rolled out one host
# at a time, each with its own pre-migration audit, not as a single fleet-wide
# flip. See host_vars/pbs.home.lan.yml for the first one.
openclaw_resolved_standardize: false

# Opt-in, per-host: mask networking.service (ifupdown) once systemd-networkd is
# confirmed to already own the interface for real. Same rollout philosophy as
# openclaw_resolved_standardize -- a pre-migration audit per host before
# flipping this on, not a fleet-wide default. See host_vars/openclaw.home.lan.yml
# for the first one.
openclaw_networkd_standardize: false

# Opt-in, per-host: correct a broken/incorrect networkd .network directive to
# a static config before openclaw_networkd_standardize is allowed to mask
# ifupdown. Empty dict (default) is a no-op everywhere. Set the four keys
# (iface, address, gateway, dns -- a list; domains is optional) on a host that
# needs it. See host_vars/pdm.home.lan.yml, the first (and, as of writing,
# only) host on this path.
openclaw_networkd_static_network: {}

# Opt-in, per-host: migrate a NetworkManager-managed interface to
# systemd-networkd. Unlike openclaw_networkd_standardize (masking an already-
# dormant ifupdown), this is a real interface-manager migration -- deliberately
# staged as prep-only. It installs networkd and a matching .network file, and
# disables NetworkManager, but only for the *next* boot (systemctl
# enable/disable, never start/stop) -- the live interface is never touched.
# A host with this flipped on needs an actual reboot, on its own schedule, to
# complete the cutover. See host_vars/desktop.home.lan.yml, the first (and, as
# of writing, only) host on this path.
openclaw_networkd_migrate_from_nm: false

# Interface to migrate when openclaw_networkd_migrate_from_nm is set. Defaults
# to the host's own default-route interface.
openclaw_networkd_migrate_iface: "{{ ansible_default_ipv4.interface }}"

# --- Zabbix: installed-version reporting -------------------------------------
# Publishes the openclaw version actually installed on this host as an agent
# UserParameter, so version drift is visible without depending on a convergence
# run having succeeded — the failure mode described in openclaw-fleet-update.sh.
# Skipped automatically on hosts with no agent2 include directory (the k8s
# nodes, which are covered by the in-cluster DaemonSet instead).
openclaw_zabbix_version_report: true
openclaw_zabbix_version_key: openclaw.version
openclaw_zabbix_agent2_include_dir: /etc/zabbix/zabbix_agent2.d
