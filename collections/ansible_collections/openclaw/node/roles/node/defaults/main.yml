---
openclaw_user: openclaw
openclaw_group: openclaw

# Where the openclaw user's own systemd manager reads unit files from. Only
# consumed by purge-legacy-user-units.yml, which deletes the pre-npm-rewrite
# units that still live here; this role installs nothing into it.
openclaw_user_unit_dir: "/home/{{ openclaw_user }}/.config/systemd/user"
openclaw_version: "latest"
openclaw_node_gateway_host: "10.0.5.7"
openclaw_node_gateway_port: 18789
openclaw_gateway_token: "REQUIRED_SET_IN_GROUP_VARS"

# --- openclaw-node.service sandbox -------------------------------------------
# Make the read plane kernel-enforced rather than a side effect of the openclaw
# user lacking sudo. Without this the node cannot become root, but nothing stops
# it writing anywhere the openclaw user owns -- including its own $HOME, its
# ~/.config/systemd/user manager, and every world-writable path on the box.
# See docs/execution-model.md, "Sandboxing openclaw-node.service".
#
# Rolled out opt-in per host (same philosophy as openclaw_resolved_standardize
# and openclaw_networkd_standardize) and defaulted on 2026-08-08 once both
# canaries -- zabbix for the plain path, pbs for the ZFS hand-back -- had been
# through a clean validate-openclaw.yml. Left as a variable so a host that ever
# needs the sandbox off can say so in host_vars rather than by hand-editing a
# unit that self-heals on the next deploy.
openclaw_node_hardening: true

# Extra writable paths for a host whose node legitimately needs one. Empty is
# correct for the whole fleet as audited 2026-08-08: the only write FDs any node
# held open were the Memory Core SQLite and its -wal/-shm under
# ~openclaw/.openclaw/state/, which the template grants unconditionally.
openclaw_node_hardening_extra_rw: []

# Node temp and cache directories. 2026.9.x+ resolves a secure temp root at
# startup and, for the node host, falls back to <cache root>/openclaw-<uid>, where
# the cache root is $XDG_CACHE_HOME if set (absolute) and otherwise ~/.cache.
# Under this unit's sandbox ~/.cache is read-only (ProtectHome=read-only), so the
# node crash-looped on 2026.9.7 with "Unable to create fallback OpenClaw temp dir"
# (2026-11-17). TMPDIR alone did NOT fix it (tried first, same error); pointing
# XDG_CACHE_HOME at a directory inside the already-writable ~/.openclaw does,
# without widening the sandbox. TMPDIR is kept for the os.tmpdir() users.
openclaw_node_tmpdir: "/home/{{ openclaw_user }}/.openclaw/tmp"
# From this release the node migrates its own state too: 2026.11.5 refuses to run
# while the retired ~/.openclaw/node.json exists ("retired node-host state remains
# ...; stop the node host and run `openclaw doctor --fix`") and crash-loops until
# doctor has been run (seen on every node 2026-11-17). Doctor runs on a package
# change, or whenever node.json is still present on a host at/after this version.
openclaw_node_doctor_min_version: "2026.9.0"
openclaw_node_doctor_timeout_seconds: 300
openclaw_node_cache_dir: "/home/{{ openclaw_user }}/.openclaw/cache"

# Device nodes to keep reachable inside the sandbox, beyond what is
# auto-detected (currently /dev/zfs). Each entry costs a DeviceAllow plus a bind
# mount -- add one only for a device a real read-plane command needs.
openclaw_node_hardening_devices: []
