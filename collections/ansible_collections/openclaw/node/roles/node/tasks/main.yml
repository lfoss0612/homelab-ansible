---
# OpenClaw Node deployment — npm-installed CLI via the shared common role.
# No release/current/shared directory tree; npm owns the install.

- name: Assert required vars are set
  ansible.builtin.assert:
    that:
      - openclaw_gateway_token is defined
      - openclaw_gateway_token != "REPLACE_WITH_VAULTED_TOKEN"
      - openclaw_gateway_token != "REQUIRED_SET_IN_GROUP_VARS"
      - openclaw_version != "latest"
    fail_msg: "Set openclaw_gateway_token and openclaw_version in group_vars/openclaw.yml"

# Both `privileges` and `dns` must be here as well as on common's own tasks:
# with a dynamic include, --tags is evaluated against this task first, so an
# untagged include is filtered out and the inner tags never get a chance to
# match. The inner tasks are still filtered by their own tags once the
# include runs, so `--tags privileges` or `--tags dns` each reach only their
# own tasks in common, not the npm install.
- name: Install shared OpenClaw runtime
  ansible.builtin.include_role:
    name: openclaw.node.common
  tags: [privileges, dns]

- name: Write environment file (token, insecure-ws flag)
  ansible.builtin.template:
    src: openclaw-node-env.j2
    dest: /etc/default/openclaw-node
    owner: root
    group: "{{ openclaw_group }}"
    mode: "0640"
  notify: restart openclaw-node

- name: Install systemd unit
  ansible.builtin.template:
    src: openclaw-node.service.j2
    dest: /etc/systemd/system/openclaw-node.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart openclaw-node

- name: Enable and start openclaw-node service
  ansible.builtin.systemd:
    name: openclaw-node
    enabled: true
    state: started
