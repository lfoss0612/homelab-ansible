---
# OpenClaw Node deployment — npm-installed CLI via the shared common role.
# No release/current/shared directory tree; npm owns the install.

- name: Assert required vars are set
  ansible.builtin.assert:
    that:
      - openclaw_gateway_token is defined
      - openclaw_gateway_token != "REPLACE_WITH_VAULTED_TOKEN"
      - openclaw_gateway_token != "REQUIRED_SET_IN_GROUP_VARS"
      - openclaw_version != "latest"
    fail_msg: "Set openclaw_gateway_token and openclaw_version in group_vars/openclaw.yml"

# Both `privileges` and `dns` must be here as well as on common's own tasks:
# with a dynamic include, --tags is evaluated against this task first, so an
# untagged include is filtered out and the inner tags never get a chance to
# match. The inner tasks are still filtered by their own tags once the
# include runs, so `--tags privileges`, `--tags dns`, or `--tags networkd`
# each reach only their own tasks in common, not the npm install.
- name: Install shared OpenClaw runtime
  ansible.builtin.include_role:
    name: openclaw.node.common
  tags: [privileges, dns, networkd]

- name: Write environment file (token, insecure-ws flag)
  ansible.builtin.template:
    src: openclaw-node-env.j2
    dest: /etc/default/openclaw-node
    owner: root
    group: "{{ openclaw_group }}"
    mode: "0640"
  notify: restart openclaw-node

# --- sandbox device detection ------------------------------------------------
# PrivateDevices=true replaces /dev with a minimal set of API pseudo-devices, so
# any real device node a read-plane command needs has to be handed back
# explicitly. /dev/zfs is the only one on this fleet: `zpool status` / `zfs list`
# work today for the unprivileged openclaw user (the node is crw-rw-rw-) and
# would silently start failing with "/dev/zfs and /proc/self/mounts are
# required" on pve, pve-ai, pve-router, pbs and omv.
#
# Detected rather than listed in group_vars deliberately -- the ZFS hosts span
# proxmox_hosts, bare_metal and qemu_vms, so there is no group that means "has
# ZFS", and a host that gains or loses ZFS later self-corrects on the next run.
#
# Both the device AND a userspace tool are required, because the device alone
# does not mean the host has ZFS: zabbix has /dev/zfs (the module is loaded)
# but no zpool binary at all, so handing the device back there would punch a
# hole in the sandbox that nothing on the host could ever use. Caught on the
# first live canary run, 2026-08-08.
- name: Check for a ZFS control device
  ansible.builtin.stat:
    path: /dev/zfs
  register: openclaw_node_zfs_dev

- name: Check whether a ZFS userspace tool is actually installed
  ansible.builtin.shell: command -v zpool
  register: openclaw_node_zfs_cli
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve the device nodes the sandbox must keep available
  ansible.builtin.set_fact:
    openclaw_node_sandbox_devices: >-
      {{ (openclaw_node_hardening_devices
          + (['/dev/zfs']
             if (openclaw_node_zfs_dev.stat.exists and openclaw_node_zfs_cli.rc == 0)
             else []))
         | unique }}

- name: Install systemd unit
  ansible.builtin.template:
    src: openclaw-node.service.j2
    dest: /etc/systemd/system/openclaw-node.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart openclaw-node

- name: Enable and start openclaw-node service
  ansible.builtin.systemd:
    name: openclaw-node
    enabled: true
    state: started

# After the system unit above is confirmed running, so a host is never left
# with neither the legacy user unit nor a working system one.
#
# `apply` is load-bearing, not decoration: tags on a dynamic include select the
# include statement alone, so without it `--tags purge-legacy` runs the include
# and then filters out every task inside it — the run reports "included: ..."
# and does nothing. Same include/--tags interaction as the `privileges`/`dns`
# tags above, in its other direction.
- name: Purge pre-npm-rewrite units from the openclaw user manager
  ansible.builtin.include_tasks:
    file: purge-legacy-user-units.yml
    apply:
      tags: [purge-legacy]
  tags: [purge-legacy]
