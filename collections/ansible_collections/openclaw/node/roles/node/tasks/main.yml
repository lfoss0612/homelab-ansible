---
# OpenClaw Node deployment — npm-installed CLI via the shared common role.
# No release/current/shared directory tree; npm owns the install.

- name: Assert required vars are set
  ansible.builtin.assert:
    that:
      - openclaw_gateway_token is defined
      - openclaw_gateway_token != "REPLACE_WITH_VAULTED_TOKEN"
      - openclaw_gateway_token != "REQUIRED_SET_IN_GROUP_VARS"
      - openclaw_version != "latest"
    fail_msg: "Set openclaw_gateway_token and openclaw_version in group_vars/openclaw.yml"

# Both `privileges` and `dns` must be here as well as on common's own tasks:
# with a dynamic include, --tags is evaluated against this task first, so an
# untagged include is filtered out and the inner tags never get a chance to
# match. The inner tasks are still filtered by their own tags once the
# include runs, so `--tags privileges`, `--tags dns`, or `--tags networkd`
# each reach only their own tasks in common, not the npm install.
- name: Install shared OpenClaw runtime
  ansible.builtin.include_role:
    name: openclaw.node.common
  tags: [privileges, dns, networkd]

# --- Node state migration ------------------------------------------------------
# Same idea as the gateway role's migration block, minus the legacy agent-DB
# set-aside: stop the node, run `openclaw doctor --fix` as the service user, and
# let "Enable and start" below bring it back. Doctor exits 1 on success here too
# (it cannot restart a system-scope unit as the openclaw user), so only rc >= 2
# fails; the node's own is-active health gate in the playbook is the real check.
# Not on the gateway host: its doctor ran in the gateway role, and the gateway
# must be stopped for doctor, which it is not here.
- name: Look for retired node-host state
  ansible.builtin.stat:
    path: "/home/{{ openclaw_user }}/.openclaw/node.json"
  register: openclaw_node_retired_state

- name: Migrate node state with openclaw doctor
  when:
    - inventory_hostname not in groups['openclaw_gateway']
    - openclaw_version is version(openclaw_node_doctor_min_version, '>=')
    - >-
      (openclaw_cli_install is defined and openclaw_cli_install is changed)
      or openclaw_node_retired_state.stat.exists
    - not ansible_check_mode
  block:
    - name: Stop the node for doctor
      ansible.builtin.systemd:
        name: openclaw-node.service
        state: stopped
      failed_when: false

    # Doctor reads everything under ~/.openclaw as the service user and refuses
    # ("Private update capture marker is unreadable ... EACCES") if anything there
    # is root-owned. zabbix had ~/.openclaw/plugins as root:root 0700 from April
    # 2026 (2026-11-17). Hand the service user back what is its own state dir.
    - name: Find root-owned entries inside the openclaw state directory
      ansible.builtin.command:
        cmd: find /home/{{ openclaw_user }}/.openclaw -xdev ! -user {{ openclaw_user }}
      register: openclaw_node_foreign_owned
      changed_when: false

    - name: Give those entries back to the service user
      ansible.builtin.command:
        cmd: chown -R {{ openclaw_user }}:{{ openclaw_group }} /home/{{ openclaw_user }}/.openclaw
      changed_when: true
      when: openclaw_node_foreign_owned.stdout | length > 0

    # Doctor refuses an unversioned legacy exec-approvals.json ("Invalid legacy
    # exec approvals (version: expected a supported value)") and stops before the
    # node-host step -- on every node here, 2026-11-17: a May 2026 file of the form
    # {"mode": "allowlist", "allowlist": ["/usr/bin/uname"]}. Its own advice is to
    # reconcile the file with the intended policy, not delete it or broaden it. This
    # rewrites it in the versioned shape with the SAME policy (allowlist mode, same
    # commands, unmatched commands denied -- docs: `--agent "*"` applies to all
    # agents), keeping the original beside it. Only a file with no "version" key
    # is touched, and only if it has exactly the old keys, so anything unexpected
    # still stops here for a human.
    - name: Convert an unversioned legacy exec-approvals.json to the versioned shape
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -e
          f=/home/{{ openclaw_user }}/.openclaw/exec-approvals.json
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json, shutil, sys, os
          f = sys.argv[1]
          d = json.load(open(f))
          if "version" in d:
              sys.exit(0)
          if set(d) - {"mode", "allowlist"} or d.get("mode") != "allowlist" \
                  or not all(isinstance(x, str) for x in d.get("allowlist", [])):
              print("UNEXPECTED legacy exec-approvals shape; leaving it for a human", file=sys.stderr)
              sys.exit(3)
          shutil.copy2(f, f + ".pre-versioned")
          new = {
              "version": 1,
              "defaults": {"security": "allowlist", "ask": "off", "askFallback": "deny"},
              "agents": {"*": {"allowlist": [{"pattern": p} for p in d.get("allowlist", [])]}},
          }
          json.dump(new, open(f, "w"), indent=2)
          print("CONVERTED")
          PY
          chown {{ openclaw_user }}:{{ openclaw_group }} "$f" "$f.pre-versioned" 2>/dev/null || true
          chmod 600 "$f"
      register: openclaw_exec_approvals_convert
      changed_when: "'CONVERTED' in openclaw_exec_approvals_convert.stdout"

    - name: Run openclaw doctor --fix as the service user
      ansible.builtin.shell:
        cmd: >-
          runuser -u {{ openclaw_user }} --
          timeout {{ openclaw_node_doctor_timeout_seconds }}
          {{ openclaw_npm_prefix.stdout | trim }}/bin/openclaw doctor --fix --non-interactive
          > /var/tmp/openclaw-node-doctor.log 2>&1
      register: openclaw_node_doctor
      changed_when: true
      failed_when: openclaw_node_doctor.rc >= 2

    - name: Confirm the retired node state is gone
      ansible.builtin.stat:
        path: "/home/{{ openclaw_user }}/.openclaw/node.json"
      register: openclaw_node_retired_after

    - name: Fail if doctor left the retired node state behind
      ansible.builtin.fail:
        msg: >-
          openclaw doctor ran (rc {{ openclaw_node_doctor.rc }}) but
          ~/.openclaw/node.json is still there; see /var/tmp/openclaw-node-doctor.log.
      when: openclaw_node_retired_after.stat.exists

# Inside ~/.openclaw, which the sandbox already makes writable. 0700 because the
# secure-temp-root check refuses a directory others can write.
- name: Ensure the node temp and cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "0700"
  loop:
    - "{{ openclaw_node_tmpdir }}"
    - "{{ openclaw_node_cache_dir }}"

- name: Write environment file (token, insecure-ws flag)
  ansible.builtin.template:
    src: openclaw-node-env.j2
    dest: /etc/default/openclaw-node
    owner: root
    group: "{{ openclaw_group }}"
    mode: "0640"
  notify: restart openclaw-node

# --- sandbox device detection ------------------------------------------------
# PrivateDevices=true replaces /dev with a minimal set of API pseudo-devices, so
# any real device node a read-plane command needs has to be handed back
# explicitly. /dev/zfs is the only one on this fleet: `zpool status` / `zfs list`
# work today for the unprivileged openclaw user (the node is crw-rw-rw-) and
# would silently start failing with "/dev/zfs and /proc/self/mounts are
# required" on pve, pve-ai, pve-router, pbs and omv.
#
# Detected rather than listed in group_vars deliberately -- the ZFS hosts span
# proxmox_hosts, bare_metal and qemu_vms, so there is no group that means "has
# ZFS", and a host that gains or loses ZFS later self-corrects on the next run.
#
# Both the device AND a userspace tool are required, because the device alone
# does not mean the host has ZFS: zabbix has /dev/zfs (the module is loaded)
# but no zpool binary at all, so handing the device back there would punch a
# hole in the sandbox that nothing on the host could ever use. Caught on the
# first live canary run, 2026-08-08.
- name: Check for a ZFS control device
  ansible.builtin.stat:
    path: /dev/zfs
  register: openclaw_node_zfs_dev

- name: Check whether a ZFS userspace tool is actually installed
  ansible.builtin.shell: command -v zpool
  register: openclaw_node_zfs_cli
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve the device nodes the sandbox must keep available
  ansible.builtin.set_fact:
    openclaw_node_sandbox_devices: >-
      {{ (openclaw_node_hardening_devices
          + (['/dev/zfs']
             if (openclaw_node_zfs_dev.stat.exists and openclaw_node_zfs_cli.rc == 0)
             else []))
         | unique }}

- name: Install systemd unit
  ansible.builtin.template:
    src: openclaw-node.service.j2
    dest: /etc/systemd/system/openclaw-node.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart openclaw-node

- name: Enable and start openclaw-node service
  ansible.builtin.systemd:
    name: openclaw-node
    enabled: true
    state: started

# After the system unit above is confirmed running, so a host is never left
# with neither the legacy user unit nor a working system one.
#
# `apply` is load-bearing, not decoration: tags on a dynamic include select the
# include statement alone, so without it `--tags purge-legacy` runs the include
# and then filters out every task inside it — the run reports "included: ..."
# and does nothing. Same include/--tags interaction as the `privileges`/`dns`
# tags above, in its other direction.
- name: Purge pre-npm-rewrite units from the openclaw user manager
  ansible.builtin.include_tasks:
    file: purge-legacy-user-units.yml
    apply:
      tags: [purge-legacy]
  tags: [purge-legacy]
