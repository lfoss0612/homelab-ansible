---
# Control-node automation: the unattended half of the write plane.
# See docs/execution-model.md — this is the only thing in the homelab that
# changes hosts without a human at the keyboard, so everything it runs is a
# playbook from git and nothing it does writes a tracked file.

openclaw_control_dir: /opt/ansible
openclaw_control_user: ansible
openclaw_control_group: ansible

openclaw_control_unit: openclaw-fleet-update
openclaw_control_script: /usr/local/sbin/openclaw-fleet-update
openclaw_control_state_dir: /var/lib/openclaw-fleet-update

# Weekly, not near-daily. The pin lives in a human commit, so the timer's job
# is drift correction — a host rebuilt from an old image, a package that got
# rolled back — not chasing upstream releases. Sunday 03:00 plus a randomized
# hour so a fleet-wide serialized rollout does not start at the same instant
# as every other timer on the box.
openclaw_control_on_calendar: "Sun *-*-* 03:00:00"
openclaw_control_randomized_delay: 1h

# update-openclaw.yml is serialized across 12 hosts with per-host health gates,
# and validate-openclaw.yml adds the gateway checks. An hour is generous; the
# point is that the unit can never hang forever.
openclaw_control_timeout_sec: 3600

# Run in order, each gating the next. Convergence alone is not success — a
# fleet that installed the pin but fails its health checks must leave the unit
# failed, not record a green run.
openclaw_control_playbooks:
  - playbooks/update-openclaw.yml
  - playbooks/validate-openclaw.yml

# Replaced by this role. openclaw-sync.timer polled the gateway every 5 minutes
# and rewrote group_vars before verifying the rollout; see the script header.
openclaw_control_legacy_units:
  - openclaw-sync.timer
  - openclaw-sync.service

# --- Outcome notification ---------------------------------------------------
# Until this existed, a failed weekly run announced itself to nobody: the
# evidence was a journal entry and a `last-success` file that silently stopped
# advancing. The scheduled run on 2026-08-02 03:46 died in `git pull` and was
# only found by reading the journal by hand a week later — and by then systemd
# had lost even the failed state.
openclaw_control_notify_script: /usr/local/sbin/openclaw-fleet-update-notify
openclaw_control_notify_unit: openclaw-fleet-update-notify

# Zabbix trapper push: 1 on failure, 0 on success, so a trigger raises AND
# clears itself. No secret is needed — the agent config already names both the
# server and this host — but the trapper ITEM must exist on the Zabbix host, or
# the server accepts the value and discards it ("processed: 0; failed: 1").
# Item/trigger are created by playbooks/zabbix-fleet-update-item.yml.
openclaw_control_notify_zabbix: true
openclaw_control_notify_zabbix_key: openclaw.fleet.update

# A LIST, tried in order, first readable one wins. This was a single path
# (/etc/zabbix/zabbix_agentd.conf) until 2026-08-24, which silently disabled
# the whole channel once cockpit moved to agent2: the file simply stopped
# existing, the script's `[ ! -r ]` guard fired, and it logged
# "not readable — skipping the zabbix channel" to a journal nobody reads.
# The fleet-update timer then failed on 2026-08-16 and 2026-08-23 with no
# notification of any kind. A list rather than a corrected single path because
# the failure mode is the hardcoding, not the value: agent1 is kept as a
# fallback so this survives a move in either direction.
openclaw_control_notify_zabbix_confs:
  - /etc/zabbix/zabbix_agent2.conf
  - /etc/zabbix/zabbix_agentd.conf

# Generic POST for ntfy/Gotify/Home Assistant/Discord. Empty disables it.
# Set it in group_vars/openclaw_control.yml (vault the URL if it embeds a token).
openclaw_control_notify_webhook: ""

# Journal lines captured into the last-failure record.
openclaw_control_notify_journal_lines: 40
